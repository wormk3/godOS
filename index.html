<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Ascensión Infinita</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #02010a;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      touch-action: none;
    }
    canvas {
      display: block;
    }
    #overlay {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #ffffff;
      font-weight: 600;
      font-size: 22px;
      text-align: center;
      z-index: 10;
      text-shadow: 0 0 18px rgba(150, 120, 255, 0.8);
      background: radial-gradient(circle at center, rgba(40, 20, 80, 0.6), rgba(0, 0, 0, 0.9));
      cursor: pointer;
    }
    #overlay-content {
      padding: 18px 26px;
      border-radius: 14px;
      background: rgba(10, 5, 25, 0.85);
      box-shadow: 0 0 24px rgba(120, 90, 255, 0.6);
      border: 1px solid rgba(180, 150, 255, 0.4);
    }
    #overlay-content small {
      display: block;
      margin-top: 8px;
      font-size: 13px;
      opacity: 0.75;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="overlay">
    <div id="overlay-content">
      ASCENSIÓN INFINITA<br />
      <small>Toca para comenzar • Inclina el celular para moverte</small>
    </div>
  </div>

  <script>
    // ==== Utilidades ====
    const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

    // ==== Input Manager ====
    class InputManager {
      constructor() {
        this.tiltX = 0;
        this.keys = new Set();
        this.motionEnabled = false;
      }

      init() {
        window.addEventListener("keydown", (e) => {
          this.keys.add(e.key);
        });
        window.addEventListener("keyup", (e) => {
          this.keys.delete(e.key);
        });
      }

      enableMotion() {
        if (this.motionEnabled) return;

        if (
          typeof DeviceMotionEvent !== "undefined" &&
          typeof DeviceMotionEvent.requestPermission === "function"
        ) {
          DeviceMotionEvent.requestPermission()
            .then((res) => {
              if (res === "granted") {
                window.addEventListener("devicemotion", this.handleTilt.bind(this), false);
                this.motionEnabled = true;
              }
            })
            .catch(() => {});
        } else if ("DeviceMotionEvent" in window) {
          window.addEventListener("devicemotion", this.handleTilt.bind(this), false);
          this.motionEnabled = true;
        }
      }

      handleTilt(event) {
        // En iPhone: inclinación izquierda = valor negativo
        this.tiltX = event.accelerationIncludingGravity.x || 0;
      }

      getHorizontalInput() {
        let x = 0;

        // Teclado (PC)
        if (this.keys.has("ArrowLeft") || this.keys.has("a")) x -= 1;
        if (this.keys.has("ArrowRight") || this.keys.has("d")) x += 1;

        // Tilt móvil
        if (this.motionEnabled) {
          // Escalamos suavemente el tilt
          x += this.tiltX * 0.25; // número pequeño para que no sea hiper sensible
        }

        return clamp(x, -1.5, 1.5); // limitamos por seguridad
      }
    }

    // ==== Player ====
    class Player {
      constructor(game) {
        this.game = game;
        this.radius = 18;
        this.reset();
      }

      reset() {
        this.x = this.game.width / 2;
        this.y = this.game.height - 120;
        this.vx = 0;
        this.vy = 0;
        this.maxHeight = 0;
        this.score = 0;
        this.isJumping = false;
      }

      applyPhysics(dt) {
        const G = this.game.config.GRAVITY;
        this.vy += G * dt;
        this.y += this.vy * dt;

        // Movimiento horizontal
        const input = this.game.input.getHorizontalInput();
        const accel = this.game.config.HORIZONTAL_ACCEL;
        const maxVx = this.game.config.MAX_VX;
        this.vx += input * accel * dt;
        this.vx = clamp(this.vx, -maxVx, maxVx);

        // Rozamiento suave cuando no hay input
        if (Math.abs(input) < 0.1) {
          this.vx *= this.game.config.HORIZONTAL_DAMPING;
        }

        this.x += this.vx * dt;

        // Wrap horizontal
        if (this.x < -this.radius) this.x = this.game.width + this.radius;
        if (this.x > this.game.width + this.radius) this.x = -this.radius;

        // Info para animación
        this.isJumping = this.vy < 0;

        // Altura máxima alcanzada (para score)
        const theoreticalHeight = this.game.spawnBaseY - this.y;
        if (theoreticalHeight > this.maxHeight) {
          this.maxHeight = theoreticalHeight;
          this.score = Math.floor(this.maxHeight / 100);
        }
      }

      handleCollisions(platforms) {
        if (this.vy <= 0) return; // solo si va cayendo

        const bottom = this.y + this.radius;

        for (const p of platforms) {
          if (
            this.x + this.radius > p.x &&
            this.x - this.radius < p.x + p.width &&
            bottom > p.y &&
            bottom < p.y + p.height
          ) {
            // Toca parte superior de la plataforma
            if (bottom < p.y + p.height / 2) {
              this.y = p.y - this.radius;
              this.vy = this.game.config.JUMP_VELOCITY;
              this.isJumping = true;
              break;
            }
          }
        }
      }

      update(dt, platforms) {
        this.applyPhysics(dt);
        this.handleCollisions(platforms);
      }

      draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);

        const r = this.radius;

        // Glow místico
        const glowGrad = ctx.createRadialGradient(0, 0, r * 0.4, 0, 0, r * 2.2);
        glowGrad.addColorStop(0, "rgba(180, 150, 255, 0.8)");
        glowGrad.addColorStop(1, "rgba(20, 5, 60, 0)");
        ctx.fillStyle = glowGrad;
        ctx.beginPath();
        ctx.arc(0, 0, r * 2.2, 0, Math.PI * 2);
        ctx.fill();

        // Cuerpo principal
        const coreGrad = ctx.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.2, 0, 0, r);
        coreGrad.addColorStop(0, "#fff9d5");
        coreGrad.addColorStop(0.4, "#ffe27a");
        coreGrad.addColorStop(1, "#ff9f5a");
        ctx.fillStyle = coreGrad;
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fill();

        ctx.lineWidth = 2;
        ctx.strokeStyle = "rgba(20, 8, 40, 0.9)";
        ctx.stroke();

        // Ojos
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(-r * 0.35, -r * 0.2, 2.4, 0, Math.PI * 2);
        ctx.arc(r * 0.35, -r * 0.2, 2.4, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#23213a";
        ctx.beginPath();
        ctx.arc(-r * 0.35, -r * 0.2, 1.1, 0, Math.PI * 2);
        ctx.arc(r * 0.35, -r * 0.2, 1.1, 0, Math.PI * 2);
        ctx.fill();

        // Boca
        ctx.strokeStyle = "#4d2640";
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        if (this.isJumping) {
          // sonrisa grande
          ctx.arc(0, r * 0.1, 5, 0, Math.PI, false);
        } else if (this.vy > 600) {
          // recta (concentrado/asustado)
          ctx.moveTo(-4, r * 0.1);
          ctx.lineTo(4, r * 0.1);
        } else {
          // sonrisa suave
          ctx.arc(0, r * 0.12, 4, 0, Math.PI);
        }
        ctx.stroke();

        ctx.restore();
      }
    }

    // ==== Platform ====
    class Platform {
      constructor(x, y, width, height) {
        this.x = x;
        this.y = y;
        this.width = width;
        this.height = height;
      }

      draw(ctx) {
        ctx.save();
        // base
        ctx.fillStyle = "rgba(18, 10, 40, 0.95)";
        ctx.fillRect(this.x, this.y, this.width, this.height);

        // línea de luz
        const glowGrad = ctx.createLinearGradient(
          this.x,
          this.y,
          this.x,
          this.y + this.height
        );
        glowGrad.addColorStop(0, "rgba(190,170,255,0.9)");
        glowGrad.addColorStop(1, "rgba(80,40,150,0.3)");
        ctx.fillStyle = glowGrad;
        ctx.fillRect(this.x, this.y, this.width, this.height * 0.4);

        ctx.restore();
      }
    }

    // ==== Game ====
    class Game {
      constructor(canvas) {
        this.canvas = canvas;
        this.ctx = canvas.getContext("2d");

        this.width = window.innerWidth;
        this.height = window.innerHeight;

        this.dpr = window.devicePixelRatio || 1;
        this.resize();

        this.state = "START"; // START | RUNNING | GAME_OVER

        this.config = {
          GRAVITY: 1500,
          JUMP_VELOCITY: -800,
          MAX_VX: 320,
          HORIZONTAL_ACCEL: 1200,
          HORIZONTAL_DAMPING: 0.92,
          PLATFORM_WIDTH: 70,
          PLATFORM_HEIGHT: 12,
          PLATFORM_COUNT: 16
        };

        this.input = new InputManager();
        this.input.init();

        this.player = new Player(this);

        this.platforms = [];
        this.spawnBaseY = this.height - 80;
        this.maxPlatformY = this.spawnBaseY;

        this.lastTime = 0;

        this.setupInitialPlatforms();
        this.attachEvents();
      }

      resize() {
        this.width = window.innerWidth;
        this.height = window.innerHeight;

        const w = this.width * this.dpr;
        const h = this.height * this.dpr;
        this.canvas.width = w;
        this.canvas.height = h;
        this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
      }

      setupInitialPlatforms() {
        this.platforms = [];
        this.maxPlatformY = this.spawnBaseY;

        // Plataforma inicial
        const baseX = this.width / 2 - this.config.PLATFORM_WIDTH / 2;
        this.platforms.push(
          new Platform(
            baseX,
            this.spawnBaseY,
            this.config.PLATFORM_WIDTH,
            this.config.PLATFORM_HEIGHT
          )
        );

        // Resto
        for (let i = 0; i < this.config.PLATFORM_COUNT; i++) {
          this.spawnPlatform();
        }
      }

      spawnPlatform() {
        const minSpacing = this.height * 0.08;
        const maxSpacing = this.height * 0.13;
        const spacing =
          minSpacing + Math.random() * (maxSpacing - minSpacing);

        const y = this.maxPlatformY - spacing;

        const margin = 40;
        const x =
          margin +
          Math.random() *
            (this.width - this.config.PLATFORM_WIDTH - margin * 2);

        const p = new Platform(
          x,
          y,
          this.config.PLATFORM_WIDTH,
          this.config.PLATFORM_HEIGHT
        );

        this.platforms.push(p);
        this.maxPlatformY = y;
      }

      attachEvents() {
        window.addEventListener("resize", () => {
          this.resize();
        });

        const overlay = document.getElementById("overlay");
        const handleStart = (ev) => {
          ev.preventDefault();
          if (this.state === "START") {
            this.startGame();
          } else if (this.state === "GAME_OVER") {
            this.restartGame();
          }
        };
        overlay.addEventListener("click", handleStart);
        overlay.addEventListener("touchstart", handleStart, { passive: false });
      }

      startGame() {
        this.state = "RUNNING";
        document.getElementById("overlay").style.display = "none";
        this.input.enableMotion();
      }

      restartGame() {
        this.player.reset();
        this.setupInitialPlatforms();
        this.state = "RUNNING";
        document.getElementById("overlay").style.display = "none";
        this.input.enableMotion();
      }

      gameOver() {
        this.state = "GAME_OVER";
        const overlay = document.getElementById("overlay");
        const oc = document.getElementById("overlay-content");
        oc.innerHTML = `GAME OVER<br><small>Altura: ${this.player.score} • Toca para reiniciar</small>`;
        overlay.style.display = "flex";
      }

      update(dt) {
        if (this.state !== "RUNNING") return;

        // Actualizar jugador
        this.player.update(dt, this.platforms);

        // Scroll de cámara hacia arriba
        if (this.player.y < this.height * 0.45) {
          const dy = this.height * 0.45 - this.player.y;
          this.player.y = this.height * 0.45;

          // bajamos plataformas (sube el mundo)
          for (const p of this.platforms) {
            p.y += dy;
          }
          this.spawnBaseY += dy;
          this.maxPlatformY += dy;

          // eliminar plataformas muy abajo
          this.platforms = this.platforms.filter(
            (p) => p.y < this.height + 80
          );

          // generar nuevas plataformas arriba
          while (this.maxPlatformY > -this.height * 0.25) {
            this.spawnPlatform();
          }
        }

        // Condición de caída
        if (this.player.y - this.player.radius > this.height + 80) {
          this.gameOver();
        }
      }

      drawBackground() {
        const ctx = this.ctx;

        const h = this.player.maxHeight;
        // "zona" suavizada por altura
        const t = clamp(h / 20000, 0, 1); // 0 a 1

        // interpolate entre púrpura oscuro y azul eléctrico
        const topColor = `hsl(${260 - t * 20}, 60%, ${16 + t * 10}%)`;
        const midColor = `hsl(${210 - t * 10}, 70%, ${20 + t * 20}%)`;
        const bottomColor = `hsl(${190}, 80%, ${10 + t * 15}%)`;

        const grad = ctx.createLinearGradient(0, 0, 0, this.height);
        grad.addColorStop(0, topColor);
        grad.addColorStop(0.5, midColor);
        grad.addColorStop(1, bottomColor);

        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, this.width, this.height);

        // "haze" mística
        ctx.fillStyle = "rgba(255,255,255,0.06)";
        for (let i = 0; i < 3; i++) {
          const y = (this.height / 4) * i + (h * 0.01 * (i + 1) % this.height);
          ctx.beginPath();
          ctx.ellipse(
            this.width / 2,
            y,
            this.width * 0.7,
            this.height * 0.18,
            0,
            0,
            Math.PI * 2
          );
          ctx.fill();
        }
      }

      drawHud() {
        const ctx = this.ctx;
        ctx.save();
        ctx.fillStyle = "rgba(255,255,255,0.9)";
        ctx.font = "16px system-ui";
        ctx.textAlign = "left";
        ctx.fillText(`Altura: ${this.player.score}`, 12, 26);
        ctx.restore();
      }

      draw() {
        this.drawBackground();

        // Plataformas
        for (const p of this.platforms) {
          p.draw(this.ctx);
        }

        // Jugador
        this.player.draw(this.ctx);

        // HUD
        this.drawHud();
      }

      loop(timestamp) {
        if (!this.lastTime) this.lastTime = timestamp;
        let dt = (timestamp - this.lastTime) / 1000;
        this.lastTime = timestamp;

        // cap de dt para evitar saltos locos
        if (dt > 0.035) dt = 0.035;

        this.update(dt);
        this.draw();

        requestAnimationFrame(this.loop.bind(this));
      }
    }

    // ==== Boot ====
    const canvas = document.getElementById("game");
    const game = new Game(canvas);
    requestAnimationFrame(game.loop.bind(game));
  </script>
</body>
</html>
