<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ASCENSIÓN INFINITA</title>
    <style>
        /* Estilos para asegurar que el canvas ocupe toda la pantalla en móvil y evitar el scroll */
        body {
            margin: 0;
            overflow: hidden;
            touch-action: manipulation; /* Mejora la respuesta táctil en móvil */
            background-color: #000;
            font-family: Arial, sans-serif;
        }
        canvas {
            display: block;
        }
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            pointer-events: none; /* Permite clicks pasar al canvas */
            z-index: 10;
        }
        #overlay-content {
            padding: 20px;
            background-color: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>
    <div id="overlay">
        <div id="overlay-content">TOCA PARA EMPEZAR</div>
    </div>

    <script>
        // === ARQUITECTURA LIMPIA Y VARIABLES GLOBALES ===

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('overlay');
        const overlayContent = document.getElementById('overlay-content');

        // Estado del juego
        let started = false;
        let gameOver = false;
        let lastTime = 0;
        let deltaTime = 0;

        // Propiedades de la pantalla
        let W, H;
        
        // Colores y Zonas (Altura en píxeles)
        const ZONE_HEIGHT = 10000; // Cada 10,000 píxeles una nueva zona
        const COLORS = {
            'Jardín': { top: 'hsl(120, 50%, 40%)', bottom: 'hsl(60, 50%, 50%)' }, // Verde/Amarillo
            'Cielo': { top: 'hsl(200, 70%, 70%)', bottom: 'hsl(180, 50%, 60%)' },  // Azul claro/Cian
            'Atmósfera': { top: 'hsl(240, 50%, 50%)', bottom: 'hsl(200, 70%, 70%)' }, // Azul/Violeta
            'Espacio': { top: 'hsl(270, 40%, 30%)', bottom: 'hsl(240, 50%, 50%)' }, // Púrpura oscuro/Azul
            'Neon': { top: 'hsl(300, 80%, 60%)', bottom: 'hsl(0, 80%, 60%)' } // Magenda/Rojo (Colores vibrantes)
        };
        const ZONES = Object.keys(COLORS);

        // Propiedades del Jugador (Gusano)
        const PLAYER_SIZE = 30; // Radio o mitad de la longitud
        let player = {
            x: 0,
            y: 0,
            vx: 0,
            vy: 0,
            width: PLAYER_SIZE,
            height: PLAYER_SIZE,
            isJumping: false,
            maxHeight: 0,
            score: 0
        };

        // Física
        const GRAVITY = 1500; // Píxeles/segundo^2 (más alta para un juego de arcade)
        const JUMP_VELOCITY = -800; // Velocidad de salto inicial
        const MAX_HORIZONTAL_VELOCITY = 300;
        const DRAG = 0.98; // Fricción horizontal

        // Controles Móviles
        const TILT_SENSITIVITY = 1000; // Reducido para baja sensibilidad
        let tiltX = 0; // Valor de inclinación (aceleración en X)

        // Propiedades de las Plataformas
        const PLATFORM_COUNT = 15;
        const PLATFORM_WIDTH = 60;
        const PLATFORM_HEIGHT = 10;
        let platforms = [];
        let maxPlatformY = 0;

        // Sprite del Gusano (SVG Base64: Simple círculo para "enrollado" y óvalo para "estirado")
        const WORM_SVG_ENROLLED = 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzMCIgaGVpZ2h0PSIzMCIgdmlld0JveD0iMCAwIDMwIDMwIj48Y2lyY2xlIGN4PSIxNSIgY3k9IjE1IiByPSIxMiIgc3R5bGU9ImZpbGw6I2ZmZGE5ZjtzdHJva2U6IzE3MTcxNzsiIHN0cm9rZS13aWR0aD0iMiIvPjwvZ3ZnPg==';
        const WORM_SVG_STRETCHED = 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzMCIgaGVpZ2h0PSI0MCIgdmlld0JveD0iMCAwIDMwIDQwIj48ZWxsaXBzZSBjeD0iMTUiIGN5PSIyMCIgcng9IjEyIiByeT0iMTgiIHN0eWxlPSJmaWxsOiNmZmRhOWY7c3Ryb2tlOiMxNzE3MTc7IiBzdHJva2Utd2lkdGg9IjIiLz48L3N2ZyA+';
        
        let wormImageEnrolled = new Image();
        wormImageEnrolled.src = WORM_SVG_ENROLLED;

        let wormImageStretched = new Image();
        wormImageStretched.src = WORM_SVG_STRETCHED;


        // === FUNCIONES DE INICIALIZACIÓN Y REINICIO ===

        /** Inicializa el tamaño del canvas y los puntos de inicio. */
        function setupCanvas() {
            W = window.innerWidth;
            H = window.innerHeight;
            canvas.width = W;
            canvas.height = H;

            // Posición inicial del jugador
            player.x = W / 2;
            player.y = H - 100;
            player.vx = 0;
            player.vy = 0;
            player.maxHeight = 0;
            player.score = 0;
            
            // Generar plataformas iniciales
            generateInitialPlatforms();
        }

        /** Genera las plataformas para el inicio del juego. */
        function generateInitialPlatforms() {
            platforms = [];
            maxPlatformY = H;
            
            // Plataforma inicial debajo del jugador
            platforms.push({ x: W / 2 - PLATFORM_WIDTH / 2, y: H - 50, type: 'normal' });

            // Generar el resto de plataformas
            for (let i = 0; i < PLATFORM_COUNT; i++) {
                generateNewPlatform(maxPlatformY);
            }
        }

        /** Llama a la inicialización y añade listeners. */
        function init() {
            setupCanvas();
            window.addEventListener('resize', setupCanvas);
            
            // Eventos de inicio (click/touch)
            document.addEventListener('click', handleStart, { once: true });
            document.addEventListener('touchstart', handleStart, { once: true });
            
            // Eventos de control de PC
            document.addEventListener('keydown', handleKeyDown);
            document.addEventListener('keyup', handleKeyUp);

            // Iniciar el bucle de juego (detenido por 'started = false')
            requestAnimationFrame(gameLoop);
        }

        /** Maneja el primer toque o click para empezar o reiniciar. */
        function handleStart() {
            if (!started) {
                // Iniciar juego
                started = true;
                gameOver = false;
                overlay.style.display = 'none';
                
                // Activar sensores de movimiento solo en móvil
                if ('DeviceOrientationEvent' in window) {
                    window.addEventListener('devicemotion', handleTilt, false);
                }
                
                // Reiniciar listeners de inicio para un posible reinicio
                document.removeEventListener('click', handleStart);
                document.removeEventListener('touchstart', handleStart);

            } else if (gameOver) {
                // Reiniciar juego
                restartGame();
            }
        }

        /** Reinicia todas las variables del juego. */
        function restartGame() {
            setupCanvas();
            gameOver = false;
            started = true; // No necesita otro toque, ya está empezado
            overlay.style.display = 'none';
            player.y = H - 100;
            player.vy = JUMP_VELOCITY; // Inicia con un pequeño salto
            player.isJumping = true;
            
            // Asegurar que el listener de reinicio esté activo
            document.removeEventListener('click', restartGame);
            document.removeEventListener('touchstart', restartGame);
        }

        // === GESTIÓN DE ENTRADA (CONTROLES) ===

        /** Maneja la inclinación del dispositivo (DeviceMotionEvent). */
        function handleTilt(event) {
            // Utilizamos el eje de aceleración sin gravedad (accelerationIncludingGravity.x) 
            // y lo invertimos si es necesario para simular Doodle Jump
            tiltX = -event.accelerationIncludingGravity.x; 
        }

        /** Maneja las teclas en PC (flechas izquierda/derecha). */
        function handleKeyDown(event) {
            if (event.key === 'ArrowLeft') {
                player.vx = -MAX_HORIZONTAL_VELOCITY;
            } else if (event.key === 'ArrowRight') {
                player.vx = MAX_HORIZONTAL_VELOCITY;
            }
        }

        /** Detiene el movimiento horizontal al soltar las teclas. */
        function handleKeyUp(event) {
            if (event.key === 'ArrowLeft' && player.vx < 0) {
                player.vx = 0;
            } else if (event.key === 'ArrowRight' && player.vx > 0) {
                player.vx = 0;
            }
        }

        // === LÓGICA DE FÍSICA Y JUEGO ===

        /**
         * Actualiza la posición y velocidad del jugador.
         * @param {number} dt Delta Time en segundos.
         */
        function updatePlayer(dt) {
            if (gameOver || !started) return;

            // 1. Movimiento Horizontal (Mobile vs PC)
            
            if ('DeviceOrientationEvent' in window) {
                // Movimiento móvil basado en inclinación
                // Multiplicamos por sensibilidad y dt. Se usa Math.min/max para limitar.
                player.vx = Math.min(
                    Math.max(tiltX * TILT_SENSITIVITY * dt, -MAX_HORIZONTAL_VELOCITY), 
                    MAX_HORIZONTAL_VELOCITY
                );
            }

            // Aplicar DRAG solo si no se está moviendo con teclas (para PC)
            if (player.vx === 0) {
                player.vx *= DRAG; 
            }
            
            player.x += player.vx * dt;

            // 2. Movimiento Vertical (Física)
            player.vy += GRAVITY * dt; // Aplicar gravedad
            player.y += player.vy * dt;

            // 3. Salto/Animación
            player.isJumping = player.vy < 0; // Se considera saltando cuando sube

            // 4. Bucle en los límites de la pantalla (wrap-around)
            if (player.x < -player.width / 2) {
                player.x = W + player.width / 2;
            } else if (player.x > W + player.width / 2) {
                player.x = -player.width / 2;
            }
            
            // 5. Scroll de la cámara y puntuación
            if (player.y < H / 2) {
                // Mover todas las plataformas hacia abajo
                const scrollAmount = H / 2 - player.y;
                player.y = H / 2;
                platforms.forEach(p => p.y += scrollAmount);
                maxPlatformY += scrollAmount;
                player.maxHeight += scrollAmount; // Aumentar la altura total

                // Actualizar puntuación (simplificada como max-height / 100)
                player.score = Math.floor(player.maxHeight / 100);

                // Generar nuevas plataformas mientras haya espacio
                while (platforms[platforms.length - 1].y > -H / 4) { // Umbral de generación
                    generateNewPlatform(platforms[platforms.length - 1].y);
                }
            }

            // 6. Condición de Muerte
            if (player.y > H + player.height / 2) {
                endGame();
            }
        }

        /**
         * Verifica colisiones entre el jugador y las plataformas.
         */
        function checkCollisions() {
            if (gameOver || !started) return;
            
            // Solo comprobar si el jugador está cayendo
            if (player.vy > 0) {
                for (let i = 0; i < platforms.length; i++) {
                    const p = platforms[i];
                    
                    // Colisión vertical (el jugador cae sobre la plataforma)
                    if (player.x < p.x + PLATFORM_WIDTH &&
                        player.x + player.width > p.x &&
                        player.y + player.height / 2 > p.y &&
                        player.y + player.height / 2 < p.y + PLATFORM_HEIGHT) {
                        
                        // Si no está muy alto (permite saltos más largos)
                        if (player.y + player.height / 2 < p.y + PLATFORM_HEIGHT / 2) {
                            player.y = p.y - player.height / 2;
                            player.vy = JUMP_VELOCITY; // Rebotar
                        }
                    }
                }
            }
            
            // Limpiar plataformas fuera de pantalla (para optimizar)
            platforms = platforms.filter(p => p.y < H + 50);
        }

        /** Genera una nueva plataforma con dificultad creciente. */
        function generateNewPlatform(lastY) {
            const minSpacing = H * 0.08; 
            const maxSpacing = H * 0.12; 
            const minX = 50;
            const maxX = W - PLATFORM_WIDTH - 50;
            
            // Nueva posición Y (siempre por encima de la última)
            const newY = lastY - (minSpacing + Math.random() * (maxSpacing - minSpacing));
            
            // Lógica de dificultad (más dispersas mientras subes)
            let platformRange = W * 0.8; // Rango inicial
            const zoneIndex = Math.floor(player.maxHeight / ZONE_HEIGHT);
            
            // Reducir el rango de aparición para hacerlas más aleatorias
            if (zoneIndex >= 1) {
                platformRange = W * (0.8 - Math.min(zoneIndex * 0.1, 0.4)); // Más dispersión
            }
            
            // Posición X aleatoria, evitando que siempre aparezcan en el centro
            const newX = minX + Math.random() * (maxX - minX);

            platforms.push({
                x: newX,
                y: newY,
                type: 'normal'
            });

            // Actualizar la Y más alta generada
            maxPlatformY = newY;
        }

        /** Establece el estado de "GAME OVER". */
        function endGame() {
            gameOver = true;
            started = false; // Detener la física
            overlayContent.innerHTML = `GAME OVER<br>Puntuación: ${player.score}<br>TOCA PARA REINICIAR`;
            overlay.style.display = 'flex';
            
            // Preparar para el reinicio
            document.addEventListener('click', restartGame, { once: true });
            document.addEventListener('touchstart', restartGame, { once: true });
        }


        // === FUNCIONES DE DIBUJO Y RENDERIZADO ===

        /** Dibuja el fondo con un gradiente dinámico. */
        function drawBackground() {
            const currentHeight = Math.floor(player.maxHeight);
            
            // Calcular la zona actual y la siguiente (para la transición del gradiente)
            const currentZoneIndex = Math.floor(currentHeight / ZONE_HEIGHT);
            const nextZoneIndex = Math.min(currentZoneIndex + 1, ZONES.length - 1);

            const zoneName = ZONES[currentZoneIndex] || ZONES[ZONES.length - 1];
            const nextZoneName = ZONES[nextZoneIndex] || ZONES[ZONES.length - 1];

            const currentColors = COLORS[zoneName];
            const nextColors = COLORS[nextZoneName];

            // Factor de interpolación (0 a 1)
            const progressInZone = (currentHeight % ZONE_HEIGHT) / ZONE_HEIGHT;

            // Simple gradiente vertical
            const gradient = ctx.createLinearGradient(0, 0, 0, H);
            
            // Lógica de color muy simplificada (usando HSL para una transición más suave)
            // Se puede hacer más complejo, pero HSL/CSS strings son difíciles de interpolar directamente.
            // Para este prototipo, se usa la interpolación entre los colores definidos de las zonas.
            // Nota: Para una transición perfecta, se requeriría una librería de interpolación de colores.

            // Usaremos una mezcla simple aquí
            let colorTop = currentColors.top;
            let colorBottom = currentColors.bottom;
            
            if (progressInZone > 0 && currentZoneIndex < ZONES.length - 1) {
                // Si estamos en transición, podríamos simplemente forzar el color de la siguiente zona
                // en la parte superior del gradiente para un efecto de "aproximación".
                // En este caso, solo usamos el color de la zona actual:
                // La magia está en que al scroll, el color sube con la cámara.
            }
            
            gradient.addColorStop(0, colorTop); 
            gradient.addColorStop(1, colorBottom);

            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, W, H);

            // Mostrar el nombre de la zona actual
            ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
            ctx.font = 'bold 16px Arial';
            ctx.textAlign = 'right';
            ctx.fillText(`Zona: ${zoneName}`, W - 10, 20);
        }

        /** Dibuja el personaje gusano (animado: enrollado o estirado). */
        function drawPlayer() {
            ctx.save();
            ctx.translate(player.x, player.y);

            let img;
            let drawW, drawH;
            
            if (player.isJumping) {
                // Gusano estirado al subir
                img = wormImageStretched;
                drawW = PLAYER_SIZE; 
                drawH = PLAYER_SIZE * 1.5; // Un poco más alto
            } else {
                // Gusano enrollado (cayendo o esperando)
                img = wormImageEnrolled;
                drawW = PLAYER_SIZE * 1.2;
                drawH = PLAYER_SIZE * 1.2;
            }

            // Dibujar la imagen centrada
            ctx.drawImage(img, -drawW / 2, -drawH / 2, drawW, drawH);
            ctx.restore();
            
            // Dibuja el score
            ctx.fillStyle = 'white';
            ctx.font = 'bold 24px Arial';
            ctx.textAlign = 'left';
            ctx.fillText(`Altura: ${player.score}`, 10, 30);
        }

        /** Dibuja todas las plataformas. */
        function drawPlatforms() {
            ctx.fillStyle = '#171717'; // Color oscuro para las plataformas
            platforms.forEach(p => {
                ctx.fillRect(p.x, p.y, PLATFORM_WIDTH, PLATFORM_HEIGHT);
            });
        }


        // === BUCLE PRINCIPAL DEL JUEGO ===

        /** Bucle principal del juego (Game Loop). */
        function gameLoop(currentTime) {
            // Calcular Delta Time (dt) en segundos
            deltaTime = (currentTime - lastTime) / 1000; 
            lastTime = currentTime;

            // Limpiar canvas y dibujar fondo
            drawBackground();

            // Solo actualizar si el juego ha empezado Y no ha terminado
            if (started && !gameOver) {
                // Actualizar física, posiciones, scroll, y colisiones
                updatePlayer(deltaTime);
                checkCollisions();
            }
            
            // Dibujar elementos del juego
            drawPlatforms();
            drawPlayer();

            // Continuar el bucle
            requestAnimationFrame(gameLoop);
        }

        // === INICIO ===
        init();

    </script>

</body>
</html>
