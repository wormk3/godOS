<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Ascensión Infinita – Prototipo v2</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <style>
    body {
      margin: 0;
      background: #050510;
      color: #ffffff;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      height: 100vh;
      overflow: hidden;
    }
    h1 {
      margin: 10px 0 2px;
      font-size: 18px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #ffcc55;
    }
    #info {
      font-size: 11px;
      opacity: 0.85;
      text-align: center;
      margin-bottom: 4px;
      padding: 0 8px;
    }
    #hud {
      font-size: 13px;
      margin-top: 4px;
      opacity: 0.9;
    }
    canvas {
      border: 2px solid #ffcc55;
      border-radius: 4px;
      margin-top: 4px;
      background: #000000;
      touch-action: none;
    }
  </style>
</head>
<body>
  <h1>ASCENSIÓN INFINITA</h1>
  <div id="info">
    MÓVIL: Inclina el celular para moverte · Toca una vez para activar sensores (si lo pide)<br>
    PC: Usa las flechas ← → para moverte · Rebotas en plataformas y subes sin límite
  </div>
  <canvas id="game" width="360" height="640"></canvas>
  <div id="hud">Altura: 0 m · Zona: Jardín</div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const hud = document.getElementById("hud");

    const W = canvas.width;
    const H = canvas.height;

    let cameraY = 0;
    let maxHeight = 0;
    let gameOver = false;

    const player = {
      x: W / 2,
      y: 80,
      radius: 14,
      vx: 0,
      vy: 0,
    };

    const GRAVITY = -0.5;
    const JUMP_SPEED = 13.5;
    let HORIZ_SPEED_MAX = 4.5;
    const FRICTION_AIR = 0.02;

    const platforms = [];
    const BASE_PLATFORM_WIDTH = 80;
    const PLATFORM_HEIGHT = 12;

    let tiltControlActive = false;
    let tiltX = 0; // -1..1
    const keys = { left: false, right: false };

    function difficultyFactor() {
      // 0 a ~3 según qué tan alto estás
      return Math.min(maxHeight / 1500, 3);
    }

    function generateInitialPlatforms() {
      platforms.length = 0;

      platforms.push({
        x: W / 2 - BASE_PLATFORM_WIDTH * 1.1 / 2,
        y: 40,
        w: BASE_PLATFORM_WIDTH * 1.1,
        h: PLATFORM_HEIGHT,
        type: "start",
        vx: 0
      });

      let y = 120;
      let spacing = 70;

      for (let i = 0; i < 25; i++) {
        const w = BASE_PLATFORM_WIDTH;
        const margin = 25;
        const maxX = W - margin - w;
        const x = margin + Math.random() * (maxX - margin);

        platforms.push({
          x,
          y,
          w,
          h: PLATFORM_HEIGHT,
          type: "normal",
          vx: 0
        });
        y += spacing;
        spacing += 1.5;
      }
    }

    function addPlatformsAboveIfNeeded() {
      let highest = 0;
      for (const p of platforms) if (p.y > highest) highest = p.y;

      const target = cameraY + H * 2;
      let y = highest;
      let spacingBase = 75 + maxHeight / 200; // sube poco a poco

      while (y < target) {
        const diff = difficultyFactor();

        y += spacingBase + Math.random() * 15; // algo de random

        // ancho disminuye con la altura
        const minWidth = 40;
        const widthDrop = Math.min(diff * 12, BASE_PLATFORM_WIDTH - minWidth);
        const w = BASE_PLATFORM_WIDTH - widthDrop;

        const margin = 15; // margen fijo para que use todo el ancho
        const maxX = W - margin - w;
        let x = margin + Math.random() * (maxX - margin);

        // tipo de plataforma según dificultad
        let type = "normal";
        let vx = 0;

        if (diff > 0.8 && Math.random() < 0.18) {
          // plataformas móviles
          type = "moving";
          // velocidad según dificultad
          vx = (Math.random() < 0.5 ? -1 : 1) * (0.8 + diff * 0.5);
        } else if (diff > 1.6 && Math.random() < 0.12) {
          // plataformas pequeñas difíciles
          type = "small";
        }

        platforms.push({
          x,
          y,
          w: type === "small" ? w * 0.6 : w,
          h: PLATFORM_HEIGHT,
          type,
          vx
        });

        spacingBase += 1.0;
      }

      const minY = cameraY - H * 2;
      for (let i = platforms.length - 1; i >= 0; i--) {
        if (platforms[i].y < minY) platforms.splice(i, 1);
      }
    }

    function resetGame() {
      cameraY = 0;
      maxHeight = 0;
      gameOver = false;

      player.x = W / 2;
      player.y = 80;
      player.vx = 0;
      player.vy = JUMP_SPEED;

      generateInitialPlatforms();
      updateHUD();
    }

    function getZoneName(h) {
      if (h < 300) return "Jardín";
      if (h < 900) return "Cielo";
      if (h < 2000) return "Estratosfera";
      if (h < 5000) return "Espacio cercano";
      if (h < 9000) return "Espacio profundo";
      return "Dimensión Neon";
    }

    function updateHUD() {
      const zone = getZoneName(maxHeight);
      hud.textContent = "Altura: " + Math.floor(maxHeight) + " m · Zona: " + zone;
      if (gameOver) {
        hud.textContent += " · GAME OVER (toca o pulsa R para reiniciar)";
      }
    }

    function worldToScreenY(yWorld) {
      return H - (yWorld - cameraY);
    }

    function drawBackground() {
      const h = maxHeight;
      let grad = ctx.createLinearGradient(0, 0, 0, H);

      if (h < 300) {
        grad.addColorStop(0, "#88d0ff");
        grad.addColorStop(0.6, "#55aa55");
        grad.addColorStop(1, "#225522");
      } else if (h < 900) {
        grad.addColorStop(0, "#6ab8ff");
        grad.addColorStop(1, "#2a4a88");
      } else if (h < 2000) {
        grad.addColorStop(0, "#4060a0");
        grad.addColorStop(1, "#0b1025");
      } else if (h < 5000) {
        grad.addColorStop(0, "#151530");
        grad.addColorStop(1, "#020208");
      } else if (h < 9000) {
        grad.addColorStop(0, "#050013");
        grad.addColorStop(1, "#000000");
      } else {
        grad.addColorStop(0, "#1b0033");
        grad.addColorStop(0.5, "#001133");
        grad.addColorStop(1, "#000000");
      }

      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);

      if (h > 1500) {
        const starCount = 40;
        ctx.fillStyle = "rgba(255,255,255,0.7)";
        for (let i = 0; i < starCount; i++) {
          const sx = (i * 97) % W;
          const sy = ((i * 53) % H);
          ctx.fillRect(sx, sy, 2, 2);
        }
      }

      if (h >= 300 && h < 2000) {
        ctx.beginPath();
        ctx.arc(W * 0.8, H * 0.2, 20, 0, Math.PI * 2);
        ctx.fillStyle = "#ffdd88";
        ctx.fill();
      }
    }

    let lastTime = 0;
    function update(dt) {
      if (gameOver) return;
      if (dt > 40) dt = 40;
      const factor = dt / 16;

      const diff = difficultyFactor();
      HORIZ_SPEED_MAX = 4.5 + diff * 0.8; // un poco más rápido a más altura

      let inputX = 0;
      if (tiltControlActive) inputX += tiltX;
      if (keys.left) inputX -= 1;
      if (keys.right) inputX += 1;

      player.vx += inputX * 0.7 * factor;
      player.vx *= (1 - FRICTION_AIR * factor);

      if (player.vx > HORIZ_SPEED_MAX) player.vx = HORIZ_SPEED_MAX;
      if (player.vx < -HORIZ_SPEED_MAX) player.vx = -HORIZ_SPEED_MAX;

      player.vy += GRAVITY * factor;
      player.x += player.vx * factor;
      player.y += player.vy * factor;

      if (player.x < -player.radius) player.x = W + player.radius;
      if (player.x > W + player.radius) player.x = -player.radius;

      // mover plataformas móviles
      for (const p of platforms) {
        if (p.type === "moving") {
          p.x += p.vx * factor;
          if (p.x < 10 || p.x + p.w > W - 10) {
            p.vx *= -1;
          }
        }
      }

      if (player.vy <= 0) {
        for (const p of platforms) {
          const top = p.y + p.h;
          const px = player.x;
          const py = player.y;

          const withinX = px > p.x && px < p.x + p.w;
          const wasAbove = (py - player.vy * factor) - player.radius >= top;
          const nowBelowTop = py - player.radius <= top + 2;

          if (withinX && wasAbove && nowBelowTop) {
            player.y = top + player.radius;
            player.vy = JUMP_SPEED;
            break;
          }
        }
      }

      if (player.y > cameraY + H * 0.4) {
        cameraY = player.y - H * 0.4;
      }

      if (player.y > maxHeight) {
        maxHeight = player.y;
        updateHUD();
      }

      if (player.y + player.radius < cameraY - H * 0.5) {
        gameOver = true;
        updateHUD();
      }

      addPlatformsAboveIfNeeded();
    }

    function draw() {
      drawBackground();

      if (maxHeight < 320) {
        const groundY = worldToScreenY(0);
        ctx.fillStyle = "#338833";
        ctx.fillRect(0, groundY, W, H - groundY);

        ctx.fillStyle = "#cfa070";
        const houseWidth = 80;
        const houseHeight = 60;
        const houseX = 30;
        const houseY = worldToScreenY(40 + houseHeight);
        ctx.fillRect(houseX, houseY - houseHeight, houseWidth, houseHeight);

        ctx.beginPath();
        ctx.moveTo(houseX - 5, houseY - houseHeight);
        ctx.lineTo(houseX + houseWidth / 2, houseY - houseHeight - 30);
        ctx.lineTo(houseX + houseWidth + 5, houseY - houseHeight);
        ctx.closePath();
        ctx.fillStyle = "#aa5533";
        ctx.fill();
      }

      for (const p of platforms) {
        const syTop = worldToScreenY(p.y + p.h);
        const ph = worldToScreenY(p.y) - syTop;

        if (p.type === "start") {
          ctx.fillStyle = "#ffee66";
          ctx.fillRect(p.x, syTop, p.w, ph);
          ctx.strokeStyle = "#ffcc33";
          ctx.strokeRect(p.x + 0.5, syTop + 0.5, p.w - 1, ph - 1);
          ctx.strokeStyle = "#aa3344";
          ctx.beginPath();
          ctx.moveTo(p.x + 5, syTop + ph / 2);
          ctx.lineTo(p.x + p.w - 5, syTop + ph / 2);
          ctx.stroke();
        } else if (p.type === "moving") {
          ctx.fillStyle = "#3344aa";
          ctx.fillRect(p.x, syTop, p.w, ph);
          ctx.strokeStyle = "#88ddff";
          ctx.strokeRect(p.x + 0.5, syTop + 0.5, p.w - 1, ph - 1);
        } else if (p.type === "small") {
          ctx.fillStyle = "#aa2255";
          ctx.fillRect(p.x, syTop, p.w, ph);
          ctx.strokeStyle = "#ff77aa";
          ctx.strokeRect(p.x + 0.5, syTop + 0.5, p.w - 1, ph - 1);
        } else {
          ctx.fillStyle = "#222a66";
          ctx.fillRect(p.x, syTop, p.w, ph);
          ctx.strokeStyle = "#66aaff";
          ctx.strokeRect(p.x + 0.5, syTop + 0.5, p.w - 1, ph - 1);
        }
      }

      const px = player.x;
      const pyScreen = worldToScreenY(player.y);

      ctx.beginPath();
      ctx.arc(px, pyScreen, player.radius + 6, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(255,255,255,0.08)";
      ctx.fill();

      ctx.beginPath();
      ctx.arc(px, pyScreen, player.radius, 0, Math.PI * 2);
      ctx.fillStyle = "#ff3366";
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = "#ff88aa";
      ctx.stroke();

      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(px - 4, pyScreen - 2, 2, 0, Math.PI * 2);
      ctx.arc(px + 4, pyScreen - 2, 2, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = "#551122";
      ctx.lineWidth = 1.3;
      ctx.beginPath();
      ctx.arc(px, pyScreen + 3, 4, 0, Math.PI);
      ctx.stroke();

      if (gameOver) {
        ctx.fillStyle = "rgba(0,0,0,0.45)";
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = "#ffcc55";
        ctx.font = "24px system-ui";
        ctx.textAlign = "center";
        ctx.fillText("GAME OVER", W / 2, H / 2 - 10);
        ctx.fillStyle = "#ffffff";
        ctx.font = "13px system-ui";
        ctx.fillText("Toca o pulsa R para jugar de nuevo", W / 2, H / 2 + 14);
        ctx.textAlign = "left";
      }
    }

    function loop(timestamp) {
      const dt = timestamp - lastTime;
      lastTime = timestamp;
      update(dt);
      draw();
      requestAnimationFrame(loop);
    }

    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") keys.left = true;
      if (e.key === "ArrowRight") keys.right = true;
      if ((e.key === "r" || e.key === "R") && gameOver) resetGame();
    });

    window.addEventListener("keyup", (e) => {
      if (e.key === "ArrowLeft") keys.left = false;
      if (e.key === "ArrowRight") keys.right = false;
    });

    function handleOrientation(event) {
      const gamma = event.gamma || 0;
      // más sensible: dividir entre 18 en vez de 30
      let norm = gamma / 18;
      if (norm > 1) norm = 1;
      if (norm < -1) norm = -1;
      tiltX = norm;
      tiltControlActive = true;
    }

    function requestMotionPermission() {
      if (
        typeof DeviceOrientationEvent !== "undefined" &&
        typeof DeviceOrientationEvent.requestPermission === "function"
      ) {
        DeviceOrientationEvent.requestPermission()
          .then((state) => {
            if (state === "granted") {
              window.addEventListener("deviceorientation", handleOrientation);
            }
          })
          .catch(() => {});
      } else if (typeof DeviceOrientationEvent !== "undefined") {
        window.addEventListener("deviceorientation", handleOrientation);
      }
    }

    canvas.addEventListener("click", () => {
      if (gameOver) resetGame();
      else requestMotionPermission();
    });

    canvas.addEventListener("touchstart", () => {
      if (gameOver) resetGame();
      else requestMotionPermission();
    });

    resetGame();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
