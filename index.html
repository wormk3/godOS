<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Ascensión Infinita – Fase 2</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <style>
    body {
      margin: 0;
      background: #050510;
      color: #ffffff;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      height: 100vh;
      overflow: hidden;
    }
    h1 {
      margin: 10px 0 2px;
      font-size: 18px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #ffcc55;
    }
    #info {
      font-size: 11px;
      opacity: 0.85;
      text-align: center;
      margin-bottom: 4px;
      padding: 0 8px;
    }
    #hud {
      font-size: 12px;
      margin-top: 4px;
      opacity: 0.95;
      text-align: center;
    }
    canvas {
      border: 2px solid #ffcc55;
      border-radius: 4px;
      margin-top: 4px;
      background: #000000;
      touch-action: none;
    }
  </style>
</head>
<body>
  <h1>ASCENSIÓN INFINITA</h1>
  <div id="info">
    MÓVIL: Inclina el celular para moverte · Toca una vez para activar sensores (si lo pide)<br>
    PC: Usa las flechas ← → para moverte · Rebotas en plataformas y subes sin límite
  </div>
  <canvas id="game" width="360" height="640"></canvas>
  <div id="hud">Altura: 0 m · Orbes: 0 · Score: 0 · Record: 0</div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const hud = document.getElementById("hud");

    const W = canvas.width;
    const H = canvas.height;

    let cameraY = 0;
    let maxHeight = 0;
    let gameOver = false;

    const player = {
      x: W / 2,
      y: 80,
      radius: 14,
      vx: 0,
      vy: 0,
    };

    // FÍSICA SUAVE (sensibilidad baja)
    const GRAVITY = -0.5;
    const JUMP_SPEED = 13.8;
    let HORIZ_SPEED_MAX = 4.5;
    const FRICTION_AIR = 0.025;

    const platforms = [];
    const BASE_PLATFORM_WIDTH = 80;
    const PLATFORM_HEIGHT = 12;

    let tiltControlActive = false;
    let tiltX = 0; // -1..1
    const keys = { left: false, right: false };

    // SPRITE opcional del gusano
    const wormSprite = new Image();
    let wormSpriteLoaded = false;
    wormSprite.onload = () => { wormSpriteLoaded = true; };
    wormSprite.src = "gusano.png"; // si no existe, se usa el vectorial

    // PARTICULAS DE REBOTE Y ORBES
    const particles = [];

    // ORBES
    const orbs = [];
    let orbsCollected = 0;

    // SCORE
    let score = 0;
    let bestScore = 0;
    let newRecord = false;

    // TEXTOS FLOTANTES (ej: "+50", "Nuevo récord")
    const floatingTexts = [];

    // Cargar récord desde localStorage
    try {
      const s = localStorage.getItem("ai_best_score");
      if (s) bestScore = parseInt(s) || 0;
    } catch (e) {
      bestScore = 0;
    }

    function spawnBounceParticles(x, yWorld) {
      const count = 8;
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI;
        const speed = 3 + Math.random() * 2;
        particles.push({
          x,
          y: yWorld,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 400 + Math.random() * 200,
          maxLife: 400 + Math.random() * 200,
          color: "bounce"
        });
      }
    }

    function spawnOrbParticles(x, yWorld) {
      const count = 10;
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 2 + Math.random() * 2;
        particles.push({
          x,
          y: yWorld,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 500 + Math.random() * 200,
          maxLife: 500 + Math.random() * 200,
          color: "orb"
        });
      }
    }

    function updateParticles(dt) {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.life -= dt;
        if (p.life <= 0) {
          particles.splice(i, 1);
          continue;
        }
        p.vy += GRAVITY * 0.15 * (dt / 16);
        p.x += p.vx * (dt / 16);
        p.y += p.vy * (dt / 16);
      }
    }

    function drawParticles() {
      for (const p of particles) {
        const alpha = Math.max(p.life / p.maxLife, 0);
        const sy = worldToScreenY(p.y);
        const size = 3 + (1 - alpha) * 2;

        if (p.color === "orb") {
          ctx.fillStyle = "rgba(120,255,220," + (0.5 + 0.4 * alpha) + ")";
        } else {
          ctx.fillStyle = "rgba(255,230,150," + (0.4 + 0.4 * alpha) + ")";
        }

        ctx.beginPath();
        ctx.arc(p.x, sy, size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function addFloatingText(text, x, yWorld, color) {
      floatingTexts.push({
        text,
        x,
        y: yWorld,
        life: 800,
        maxLife: 800,
        color
      });
    }

    function updateFloatingTexts(dt) {
      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const t = floatingTexts[i];
        t.life -= dt;
        if (t.life <= 0) {
          floatingTexts.splice(i, 1);
          continue;
        }
        t.y += 0.03 * (dt / 16); // se va hacia arriba en mundo (después se proyecta)
      }
    }

    function drawFloatingTexts() {
      ctx.font = "12px system-ui";
      ctx.textAlign = "center";
      for (const t of floatingTexts) {
        const alpha = Math.max(t.life / t.maxLife, 0);
        const sy = worldToScreenY(t.y);
        let c = "#ffffff";
        if (t.color === "orb") c = "#88ffd0";
        if (t.color === "record") c = "#ffdd55";

        ctx.fillStyle = "rgba(0,0,0," + (0.3 * alpha) + ")";
        ctx.fillText(t.text, t.x + 1, sy + 1);
        ctx.fillStyle = c.replace(")", "," + alpha + ")");
        ctx.fillText(t.text, t.x, sy);
      }
      ctx.textAlign = "left";
    }

    function difficultyFactor() {
      return Math.min(maxHeight / 1500, 3);
    }

    function generateInitialPlatforms() {
      platforms.length = 0;
      orbs.length = 0;

      platforms.push({
        x: W / 2 - BASE_PLATFORM_WIDTH * 1.1 / 2,
        y: 40,
        w: BASE_PLATFORM_WIDTH * 1.1,
        h: PLATFORM_HEIGHT,
        type: "start",
        vx: 0
      });

      let y = 120;
      let spacing = 70;

      for (let i = 0; i < 25; i++) {
        addPlatformAt(y, spacing);
        y += spacing;
        spacing += 1.5;
      }
    }

    function addPlatformAt(y, spacingBase) {
      const w = BASE_PLATFORM_WIDTH;
      const margin = 25;
      const maxX = W - margin - w;
      const x = margin + Math.random() * (maxX - margin);

      const p = {
        x,
        y,
        w,
        h: PLATFORM_HEIGHT,
        type: "normal",
        vx: 0
      };
      platforms.push(p);

      // chance de orb encima de esta plataforma inicial
      if (Math.random() < 0.25) {
        orbs.push({
          x: p.x + p.w / 2,
          y: p.y + p.h + 15,
          radius: 6,
          collected: false
        });
      }
    }

    function addPlatformsAboveIfNeeded() {
      let highest = 0;
      for (const p of platforms) if (p.y > highest) highest = p.y;

      const target = cameraY + H * 2;
      let y = highest;
      let spacingBase = 75 + maxHeight / 200;

      while (y < target) {
        const diff = difficultyFactor();

        y += spacingBase + Math.random() * 15;

        const minWidth = 40;
        const widthDrop = Math.min(diff * 12, BASE_PLATFORM_WIDTH - minWidth);
        const wBase = BASE_PLATFORM_WIDTH - widthDrop;

        const margin = 15;
        const maxX = W - margin - wBase;
        let x = margin + Math.random() * (maxX - margin);

        let type = "normal";
        let vx = 0;

        if (diff > 0.8 && Math.random() < 0.18) {
          type = "moving";
          vx = (Math.random() < 0.5 ? -1 : 1) * (0.8 + diff * 0.5);
        } else if (diff > 1.6 && Math.random() < 0.12) {
          type = "small";
        }

        const p = {
          x,
          y,
          w: type === "small" ? wBase * 0.6 : wBase,
          h: PLATFORM_HEIGHT,
          type,
          vx
        };

        platforms.push(p);

        // chance de orb encima de esta plataforma
        if (Math.random() < 0.3 && type !== "start") {
          orbs.push({
            x: p.x + p.w / 2,
            y: p.y + p.h + 15,
            radius: 6,
            collected: false
          });
        }

        spacingBase += 1.0;
      }

      const minY = cameraY - H * 2;
      for (let i = platforms.length - 1; i >= 0; i--) {
        if (platforms[i].y < minY) platforms.splice(i, 1);
      }
      for (let i = orbs.length - 1; i >= 0; i--) {
        if (orbs[i].y < minY) orbs.splice(i, 1);
      }
    }

    function resetGame() {
      cameraY = 0;
      maxHeight = 0;
      gameOver = false;
      particles.length = 0;
      orbs.length = 0;
      orbsCollected = 0;
      score = 0;
      newRecord = false;
      floatingTexts.length = 0;

      player.x = W / 2;
      player.y = 80;
      player.vx = 0;
      player.vy = JUMP_SPEED;

      generateInitialPlatforms();
      updateScore();
      updateHUD();
    }

    function getZoneName(h) {
      if (h < 300) return "Jardín";
      if (h < 900) return "Cielo";
      if (h < 2000) return "Estratosfera";
      if (h < 5000) return "Espacio cercano";
      if (h < 9000) return "Espacio profundo";
      return "Dimensión Neon";
    }

    function updateScore() {
      const heightScore = Math.floor(maxHeight);
      score = heightScore + orbsCollected * 50;
    }

    function updateHUD() {
      const zone = getZoneName(maxHeight);
      hud.textContent =
        "Altura: " + Math.floor(maxHeight) +
        " m · Orbes: " + orbsCollected +
        " · Score: " + score +
        " · Record: " + bestScore +
        " · Zona: " + zone;
      if (gameOver) {
        hud.textContent += " · GAME OVER (toca o pulsa R)";
      }
    }

    function worldToScreenY(yWorld) {
      return H - (yWorld - cameraY);
    }

    // FONDO + PARALLAX
    function drawBackground() {
      const h = maxHeight;
      let grad = ctx.createLinearGradient(0, 0, 0, H);

      if (h < 300) {
        grad.addColorStop(0, "#88d0ff");
        grad.addColorStop(0.6, "#55aa55");
        grad.addColorStop(1, "#225522");
      } else if (h < 900) {
        grad.addColorStop(0, "#6ab8ff");
        grad.addColorStop(1, "#2a4a88");
      } else if (h < 2000) {
        grad.addColorStop(0, "#4060a0");
        grad.addColorStop(1, "#0b1025");
      } else if (h < 5000) {
        grad.addColorStop(0, "#151530");
        grad.addColorStop(1, "#020208");
      } else if (h < 9000) {
        grad.addColorStop(0, "#050013");
        grad.addColorStop(1, "#000000");
      } else {
        grad.addColorStop(0, "#1b0033");
        grad.addColorStop(0.5, "#001133");
        grad.addColorStop(1, "#000000");
      }

      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);

      const offsetSlow = (cameraY * 0.05) % (H * 2);
      const offsetFast = (cameraY * 0.12) % (H * 2);

      if (h > 150 && h < 2500) {
        ctx.fillStyle = "rgba(255,255,255,0.5)";
        for (let i = 0; i < 5; i++) {
          const cx = (i * 90 + 40) % W;
          const cy = ((i * 60) + offsetSlow) % (H + 80) - 40;
          ctx.beginPath();
          ctx.ellipse(cx, cy, 35, 18, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      if (h > 1500) {
        ctx.fillStyle = "rgba(255,255,255,0.7)";
        for (let i = 0; i < 40; i++) {
          const sx = (i * 97) % W;
          const sy = ((i * 53) + offsetFast) % H;
          ctx.fillRect(sx, sy, 2, 2);
        }
      }

      if (h >= 300 && h < 2000) {
        ctx.beginPath();
        ctx.arc(W * 0.8, H * 0.2, 20, 0, Math.PI * 2);
        ctx.fillStyle = "#ffdd88";
        ctx.fill();
      } else if (h >= 2000 && h < 5000) {
        ctx.beginPath();
        ctx.arc(W * 0.8, H * 0.2, 14, 0, Math.PI * 2);
        ctx.fillStyle = "#dde6ff";
        ctx.fill();
      }
    }

    let lastTime = 0;
    function update(dt) {
      if (gameOver) return;
      if (dt > 40) dt = 40;
      const factor = dt / 16;

      const diff = difficultyFactor();
      HORIZ_SPEED_MAX = 4.5 + diff * 0.6;

      let inputX = 0;
      if (tiltControlActive) inputX += tiltX;
      if (keys.left) inputX -= 1;
      if (keys.right) inputX += 1;

      // fuerza moderada: hay que inclinar bastante
      player.vx += inputX * 0.55 * factor;
      player.vx *= (1 - FRICTION_AIR * factor);

      if (player.vx > HORIZ_SPEED_MAX) player.vx = HORIZ_SPEED_MAX;
      if (player.vx < -HORIZ_SPEED_MAX) player.vx = -HORIZ_SPEED_MAX;

      player.vy += GRAVITY * factor;
      player.x += player.vx * factor;
      player.y += player.vy * factor;

      if (player.x < -player.radius) player.x = W + player.radius;
      if (player.x > W + player.radius) player.x = -player.radius;

      // plataformas móviles
      for (const p of platforms) {
        if (p.type === "moving") {
          p.x += p.vx * factor;
          if (p.x < 10 || p.x + p.w > W - 10) p.vx *= -1;
        }
      }

      // colisión / rebote
      if (player.vy <= 0) {
        for (const p of platforms) {
          const top = p.y + p.h;
          const px = player.x;
          const py = player.y;

          const withinX = px > p.x && px < p.x + p.w;
          const wasAbove = (py - player.vy * factor) - player.radius >= top;
          const nowBelowTop = py - player.radius <= top + 2;

          if (withinX && wasAbove && nowBelowTop) {
            player.y = top + player.radius;
            player.vy = JUMP_SPEED;
            spawnBounceParticles(px, top);
            break;
          }
        }
      }

      // recoger orbes
      for (const orb of orbs) {
        if (orb.collected) continue;
        const dx = player.x - orb.x;
        const dy = player.y - orb.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < player.radius * 0.8 + orb.radius) {
          orb.collected = true;
          orbsCollected++;
          spawnOrbParticles(orb.x, orb.y);
          addFloatingText("+50", orb.x, orb.y + 10, "orb");
          updateScore();
          updateHUD();
        }
      }

      if (player.y > cameraY + H * 0.4) {
        cameraY = player.y - H * 0.4;
      }

      if (player.y > maxHeight) {
        maxHeight = player.y;
        updateScore();
        updateHUD();
      }

      if (player.y + player.radius < cameraY - H * 0.5) {
        gameOver = true;

        // al morir, comprobar récord
        if (score > bestScore) {
          bestScore = score;
          newRecord = true;
          addFloatingText("¡Nuevo récord!", player.x, player.y + 40, "record");
          try {
            localStorage.setItem("ai_best_score", String(bestScore));
          } catch (e) {}
        }

        updateHUD();
      }

      addPlatformsAboveIfNeeded();
      updateParticles(dt);
      updateFloatingTexts(dt);
    }

    // GUSANO VECTORIAL MEJORADO
    function drawWormVector(px, pyScreen) {
      const r = player.radius;

      let stretch = 0;
      if (player.vy > 1) {
        stretch = Math.min(player.vy / 12, 1);
      } else if (player.vy < -2) {
        stretch = Math.min(Math.abs(player.vy) / 18, 0.6);
      }

      const baseHeight = r * 1.6;
      const extraHeight = r * 2.2 * stretch;
      const bodyHeight = baseHeight + extraHeight;
      const bodyWidth = r * (1.6 - 0.4 * stretch);

      ctx.save();
      ctx.translate(px, pyScreen);

      const hw = bodyWidth / 2;
      const hh = bodyHeight / 2;

      // cuerpo cápsula
      ctx.beginPath();
      ctx.moveTo(-hw, -hh + hw);
      ctx.arc(-hw, -hh + hw, hw, Math.PI, -Math.PI / 2);
      ctx.lineTo(hw, -hh);
      ctx.arc(hw, -hh + hw, hw, -Math.PI / 2, 0);
      ctx.lineTo(hw, hh - hw);
      ctx.arc(hw, hh - hw, hw, 0, Math.PI / 2);
      ctx.lineTo(-hw, hh);
      ctx.arc(-hw, hh - hw, hw, Math.PI / 2, Math.PI);
      ctx.closePath();

      const grad = ctx.createLinearGradient(0, -hh, 0, hh);
      grad.addColorStop(0, "#ff88bb");
      grad.addColorStop(0.5, "#ff5599");
      grad.addColorStop(1, "#ff3366");
      ctx.fillStyle = grad;
      ctx.fill();

      ctx.lineWidth = 2;
      ctx.strokeStyle = "#ffb6d5";
      ctx.stroke();

      // líneas de segmento
      ctx.strokeStyle = "rgba(255,255,255,0.35)";
      ctx.lineWidth = 1;
      for (let i = -2; i <= 2; i++) {
        const yy = (i / 3) * hh * 0.9;
        ctx.beginPath();
        ctx.moveTo(-hw * 0.7, yy);
        ctx.lineTo(hw * 0.7, yy);
        ctx.stroke();
      }

      // estado emocional según vy
      let mood = "neutral";
      if (player.vy > 6) mood = "happy";
      else if (player.vy < -8) mood = "scared";

      const faceY = -hh * 0.4;

      // ojos
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      if (mood === "scared") {
        ctx.arc(-hw * 0.3, faceY - 2, 3, 0, Math.PI * 2);
        ctx.arc(hw * 0.3, faceY - 2, 3, 0, Math.PI * 2);
      } else if (mood === "happy") {
        ctx.arc(-hw * 0.3, faceY - 1, 2, 0, Math.PI * 2);
        ctx.arc(hw * 0.3, faceY - 1, 2, 0, Math.PI * 2);
      } else {
        ctx.arc(-hw * 0.3, faceY - 2, 2, 0, Math.PI * 2);
        ctx.arc(hw * 0.3, faceY - 2, 2, 0, Math.PI * 2);
      }
      ctx.fill();

      // boca
      ctx.strokeStyle = "#551122";
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      if (mood === "happy") {
        ctx.arc(0, faceY + 3, 4, 0, Math.PI, false);
      } else if (mood === "scared") {
        ctx.moveTo(-3, faceY + 5);
        ctx.lineTo(3, faceY + 5);
      } else {
        ctx.arc(0, faceY + 3, 4, 0, Math.PI);
      }
      ctx.stroke();

      ctx.restore();
    }

    function drawWorm(px, pyScreen) {
      const r = player.radius;

      let stretch = 0;
      if (player.vy > 1) {
        stretch = Math.min(player.vy / 12, 1);
      } else if (player.vy < -2) {
        stretch = Math.min(Math.abs(player.vy) / 18, 0.6);
      }

      const baseHeight = r * 1.6;
      const extraHeight = r * 2.2 * stretch;
      const bodyHeight = baseHeight + extraHeight;
      const bodyWidth = r * (1.6 - 0.4 * stretch);

      if (wormSpriteLoaded) {
        const scaleX = bodyWidth / wormSprite.width;
        const scaleY = bodyHeight / wormSprite.height;

        ctx.save();
        ctx.translate(px, pyScreen);
        ctx.scale(scaleX, scaleY);
        ctx.drawImage(
          wormSprite,
          -wormSprite.width / 2,
          -wormSprite.height / 2
        );
        ctx.restore();
      } else {
        drawWormVector(px, pyScreen);
      }
    }

    function draw() {
      drawBackground();

      // suelo y casa al inicio
      if (maxHeight < 320) {
        const groundY = worldToScreenY(0);
        ctx.fillStyle = "#338833";
        ctx.fillRect(0, groundY, W, H - groundY);

        ctx.fillStyle = "#cfa070";
        const houseWidth = 80;
        const houseHeight = 60;
        const houseX = 30;
        const houseY = worldToScreenY(40 + houseHeight);
        ctx.fillRect(houseX, houseY - houseHeight, houseWidth, houseHeight);

        ctx.beginPath();
        ctx.moveTo(houseX - 5, houseY - houseHeight);
        ctx.lineTo(houseX + houseWidth / 2, houseY - houseHeight - 30);
        ctx.lineTo(houseX + houseWidth + 5, houseY - houseHeight);
        ctx.closePath();
        ctx.fillStyle = "#aa5533";
        ctx.fill();
      }

      // plataformas
      for (const p of platforms) {
        const syTop = worldToScreenY(p.y + p.h);
        const ph = worldToScreenY(p.y) - syTop;

        if (p.type === "start") {
          ctx.fillStyle = "#ffee66";
          ctx.fillRect(p.x, syTop, p.w, ph);
          ctx.strokeStyle = "#ffcc33";
          ctx.strokeRect(p.x + 0.5, syTop + 0.5, p.w - 1, ph - 1);
          ctx.strokeStyle = "#aa3344";
          ctx.beginPath();
          ctx.moveTo(p.x + 5, syTop + ph / 2);
          ctx.lineTo(p.x + p.w - 5, syTop + ph / 2);
          ctx.stroke();
        } else if (p.type === "moving") {
          ctx.fillStyle = "#3344aa";
          ctx.fillRect(p.x, syTop, p.w, ph);
          ctx.strokeStyle = "#88ddff";
          ctx.strokeRect(p.x + 0.5, syTop + 0.5, p.w - 1, ph - 1);
        } else if (p.type === "small") {
          ctx.fillStyle = "#aa2255";
          ctx.fillRect(p.x, syTop, p.w, ph);
          ctx.strokeStyle = "#ff77aa";
          ctx.strokeRect(p.x + 0.5, syTop + 0.5, p.w - 1, ph - 1);
        } else {
          ctx.fillStyle = "#222a66";
          ctx.fillRect(p.x, syTop, p.w, ph);
          ctx.strokeStyle = "#66aaff";
          ctx.strokeRect(p.x + 0.5, syTop + 0.5, p.w - 1, ph - 1);
        }
      }

      // ORBES
      for (const orb of orbs) {
        if (orb.collected) continue;
        const sy = worldToScreenY(orb.y);
        const pulsate = 1 + 0.2 * Math.sin(Date.now() / 200);
        const r = orb.radius * pulsate;

        const grad = ctx.createRadialGradient(
          orb.x, sy, 0,
          orb.x, sy, r
        );
        grad.addColorStop(0, "rgba(180,255,240,0.95)");
        grad.addColorStop(0.5, "rgba(120,255,220,0.8)");
        grad.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(orb.x, sy, r, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "rgba(255,255,255,0.9)";
        ctx.beginPath();
        ctx.arc(orb.x - r * 0.3, sy - r * 0.2, r * 0.25, 0, Math.PI * 2);
        ctx.fill();
      }

      // partículas encima de plataformas y orbes
      drawParticles();

      const px = player.x;
      const pyScreen = worldToScreenY(player.y);

      ctx.beginPath();
      ctx.arc(px, pyScreen, player.radius + 10, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(255,255,255,0.05)";
      ctx.fill();

      drawWorm(px, pyScreen);

      // textos flotantes (score, +50, récord)
      drawFloatingTexts();

      if (gameOver) {
        ctx.fillStyle = "rgba(0,0,0,0.5)";
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = "#ffcc55";
        ctx.font = "24px system-ui";
        ctx.textAlign = "center";
        ctx.fillText("GAME OVER", W / 2, H / 2 - 20);

        ctx.fillStyle = "#ffffff";
        ctx.font = "14px system-ui";
        ctx.fillText("Score: " + score, W / 2, H / 2 + 2);
        ctx.fillText("Record: " + bestScore, W / 2, H / 2 + 22);

        if (newRecord) {
          ctx.fillStyle = "#ffdd55";
          ctx.font = "13px system-ui";
          ctx.fillText("¡Nuevo récord!", W / 2, H / 2 + 44);
        }

        ctx.fillStyle = "#cccccc";
        ctx.font = "11px system-ui";
        ctx.fillText("Toca o pulsa R para jugar de nuevo", W / 2, H / 2 + 64);

        ctx.textAlign = "left";
      }
    }

    function loop(timestamp) {
      const dt = timestamp - lastTime;
      lastTime = timestamp;
      update(dt);
      draw();
      requestAnimationFrame(loop);
    }

    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") keys.left = true;
      if (e.key === "ArrowRight") keys.right = true;
      if ((e.key === "r" || e.key === "R") && gameOver) resetGame();
    });

    window.addEventListener("keyup", (e) => {
      if (e.key === "ArrowLeft") keys.left = false;
      if (e.key === "ArrowRight") keys.right = false;
    });

    function handleOrientation(event) {
      const gamma = event.gamma || 0;
      // SENSIBILIDAD BAJA → hay que inclinar bien
      let norm = gamma / 40; // antes /30, ahora más baja
      if (norm > 1) norm = 1;
      if (norm < -1) norm = -1;
      tiltX = norm;
      tiltControlActive = true;
    }

    function requestMotionPermission() {
      if (
        typeof DeviceOrientationEvent !== "undefined" &&
        typeof DeviceOrientationEvent.requestPermission === "function"
      ) {
        DeviceOrientationEvent.requestPermission()
          .then((state) => {
            if (state === "granted") {
              window.addEventListener("deviceorientation", handleOrientation);
            }
          })
          .catch(() => {});
      } else if (typeof DeviceOrientationEvent !== "undefined") {
        window.addEventListener("deviceorientation", handleOrientation);
      }
    }

    canvas.addEventListener("click", () => {
      if (gameOver) resetGame();
      else requestMotionPermission();
    });

    canvas.addEventListener("touchstart", () => {
      if (gameOver) resetGame();
      else requestMotionPermission();
    });

    resetGame();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
