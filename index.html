<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Thunder Ascension</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />

  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #05030a;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #fff;
    }

    .frame {
      width: min(420px, 100vw);
      aspect-ratio: 9 / 16;
      border-radius: 16px;
      border: 2px solid #ff55dd;
      box-shadow: 0 0 32px rgba(255,85,221,0.4);
      overflow: hidden;
      background: #000;
      position: relative;
      touch-action: none;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* HUD SUPERIOR */
    .hud-top {
      position: absolute;
      top: 4px;
      left: 0;
      width: 100%;
      pointer-events: none;
      padding: 4px 10px;
      background: rgba(40,40,40,0.8); /* gris 80% */
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-shadow: 0 0 4px #000;
      z-index: 10;
    }

    .hud-left { display: flex; flex-direction: column; }

    .hud-score {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .hud-zone {
      font-size: 11px;
      opacity: 0.85;
    }

    .hud-coins {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 15px;
      font-weight: 700;
    }

    .coin-icon {
      width: 18px;
      height: 18px;
      image-rendering: pixelated;
    }

    /* HUD INFERIOR */
    .hud-bottom {
      position: absolute;
      bottom: 4px;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 12px;
      pointer-events: none;
      text-shadow: 0 0 4px #000;
    }

    .hint {
      position: absolute;
      bottom: 26px;
      width: 100%;
      text-align: center;
      font-size: 10px;
      opacity: 0.75;
      pointer-events: none;
    }
  </style>
</head>
<body>

<div class="frame">
  <div class="hud-top">
    <div class="hud-left">
      <div id="hudScore" class="hud-score">0 m</div>
      <div id="hudZone" class="hud-zone">THUNDER ASCENSION — Zona: Jardín</div>
    </div>
    <div class="hud-coins">
      <img src="thunder-coin.png" class="coin-icon" alt="coin" />
      <span id="hudCoins">0</span>
    </div>
  </div>

  <!-- AQUÍ SÍ VA EL CANVAS -->
  <canvas id="game"></canvas>

  <div class="hint">PC: Flechas ← → · Móvil: toca izquierda/derecha</div>
  <div class="hud-bottom" id="hudBottom">Mejor: 0 m</div>
</div>

<script>
// ======================================================
//              CARGA DE RECURSOS
// ======================================================
const bgImgs = {
  garden: new Image(),
  sky: new Image(),
  solar: new Image(),
  milkyway: new Image(),
  virgo: new Image(),
  horizon: new Image()
};

const bgPaths = {
  garden: "bg-garden.jpeg",
  sky: "bg-sky.jpeg",
  solar: "bg-solar.jpeg",
  milkyway: "bg-milkyway.JPG",
  virgo: "bg-virgo.JPG",
  horizon: "bg-horizon.JPG"
};

// --------- ORBE POWER-UP (SPRITE SHEET 8 FRAMES) ---------
const orbImg = new Image();
const orbPath = "orb-electric.png";

const ORB_COLS = 8;
let ORB_FRAME_SIZE = 128;
const ORB_DRAW_SIZE = 18;

let orbAnim = 0;
let orbFrame = 0;

// --------- SPRITES THUNDER ---------
const thunderImgs = {
  idle: new Image(),
  jumpRight: new Image(),
  jumpLeft: new Image(),
  fall: new Image()
};

const thunderPaths = {
  idle: "thunder-idle.png",
  jumpRight: "thunder-jump_right.png",
  jumpLeft: "thunder_jump_left.png",
  fall: "thunder_fall.png"
};

async function preloadAssets() {
  const tasks = [];

  function load(img, path) {
    return new Promise(res => {
      img.onload = res;
      img.onerror = res;
      img.src = path;
    });
  }

  for (let k in bgPaths)      tasks.push(load(bgImgs[k], bgPaths[k]));
  for (let k in thunderPaths) tasks.push(load(thunderImgs[k], thunderPaths[k]));
  tasks.push(load(orbImg, orbPath));

  await Promise.all(tasks);

  if (orbImg.naturalWidth) {
    ORB_FRAME_SIZE = orbImg.naturalWidth / ORB_COLS;
  }

  console.log("Assets cargados");
}

// ======================================================
//                 VARIABLES DEL JUEGO
// ======================================================
const canvas = document.getElementById("game");
const ctx    = canvas.getContext("2d");

const VW = 180;
const VH = 320;

canvas.width  = VW * 2;
canvas.height = VH * 2;
ctx.scale(2,2);

const hudScore  = document.getElementById("hudScore");
const hudZone   = document.getElementById("hudZone");
const hudCoins  = document.getElementById("hudCoins");
const hudBottom = document.getElementById("hudBottom");

let coins      = 0;
let lastTime   = 0;
let leftHeld   = false;
let rightHeld  = false;
let bestHeight = 0;

const world = {
  gravity: 0.4,
  baseJumpVel: -8.5,
  maxVX: 2.4,
  friction: 0.9,
  scrollY: 0,
  heightMeters: 0
};

const player = {
  x: VW/2,
  y: VH-40,
  vx: 0,
  vy: 0,
  r: 7,
  alive: true
};

let platforms = [];
let powerUps  = [];

// ======================================================
//                FUNCIONES DE ZONAS
// ======================================================
function getZone(height) {
  if (height < 150)   return { key:"garden", name:"Jardín",          top:"#19143f", mid:"#182b57", bottom:"#0f4a3a", stars:25 };
  if (height < 900)   return { key:"sky",    name:"Cielo",           top:"#203a7a", mid:"#246db0", bottom:"#63b3ff", stars:36 };
  if (height < 3500)  return { key:"solar",  name:"Sistema Solar",   top:"#10152f", mid:"#171f4f", bottom:"#243a6b", stars:60 };
  if (height < 12000) return { key:"milkyway", name:"Vía Láctea",    top:"#050313", mid:"#151437", bottom:"#203b6a", stars:90 };
  if (height < 40000) return { key:"virgo",  name:"Supercúmulo de Virgo", top:"#05020c", mid:"#24062e", bottom:"#3c1458", stars:120 };
  return { key:"horizon", name:"Horizonte Cósmico", top:"#2b0538", mid:"#3b1374", bottom:"#ff0077", stars:140 };
}

// ======================================================
//             PLATAFORMAS / POWERUPS
// ======================================================
function createPlatform(x, y) {
  const plat = {
    x, y,
    w: 40,
    h: 6
  };

  const zone = getZone(world.heightMeters);

  // Orbe eléctrico en plataformas (no en Jardín)
  if (zone.key !== "garden" && Math.random() < 0.08) {
    powerUps.push({
      x: x + 20,
      y: y - 10,
      r: ORB_DRAW_SIZE * 0.6,
      taken: false
    });
  }

  return plat;
}

function initPlatforms() {
  platforms = [];
  powerUps  = [];

  let y = VH - 20;
  platforms.push(createPlatform(VW/2 - 20, y));

  while (y > -VH) {
    y -= 18 + Math.random()*10;
    const x = 10 + Math.random()*(VW-60);
    platforms.push(createPlatform(x, y));
  }
}

// ======================================================
//                   CONTROLES
// ======================================================
function handleKeyboard(e, down) {
  if (["ArrowLeft","a","A"].includes(e.key))  { leftHeld  = down; e.preventDefault(); }
  if (["ArrowRight","d","D"].includes(e.key)) { rightHeld = down; e.preventDefault(); }
  if (e.key === " " && !down && !player.alive) resetGame();
}
document.addEventListener("keydown", e => handleKeyboard(e,true));
document.addEventListener("keyup",   e => handleKeyboard(e,false));

// Controles táctiles – funciona en iPhone / Android
function handleTouch(e) {
  e.preventDefault();

  if (e.touches.length === 0) {
    leftHeld = rightHeld = false;
    return;
  }

  let anyLeft  = false;
  let anyRight = false;

  const rect = canvas.getBoundingClientRect();

  for (const t of e.touches) {
    const x = t.clientX - rect.left;
    if (x < rect.width * 0.5) anyLeft  = true;
    else                      anyRight = true;
  }

  leftHeld  = anyLeft;
  rightHeld = anyRight;
}
function clearTouch() {
  leftHeld = false;
  rightHeld = false;
}

// Usamos TODO el documento para evitar bugs de iOS
document.addEventListener("touchstart", handleTouch, { passive:false });
document.addEventListener("touchmove",  handleTouch, { passive:false });
document.addEventListener("touchend",   clearTouch,  { passive:false });
document.addEventListener("touchcancel",clearTouch,  { passive:false });

// Click con mouse (PC)
canvas.addEventListener("mousedown", e => {
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  if (x < rect.width * 0.5) leftHeld = true;
  else                      rightHeld = true;
});
window.addEventListener("mouseup", () => {
  leftHeld = rightHeld = false;
});

// ======================================================
//                   DIBUJO
// ======================================================
function drawBackground() {
  const z   = getZone(world.heightMeters);
  const img = bgImgs[z.key];

  if (img.complete && img.naturalWidth) {
    const iw = img.naturalWidth;
    const ih = img.naturalHeight;
    const ratio = iw/ih;
    const screenRatio = VW/VH;

    let dw, dh;
    if (ratio > screenRatio) {
      dh = VH;
      dw = dh * ratio;
    } else {
      dw = VW;
      dh = dw / ratio;
    }

    ctx.drawImage(img, (VW-dw)/2, (VH-dh)/2, dw, dh);
  } else {
    // gradiente de emergencia
    const grad = ctx.createLinearGradient(0,0,0,VH);
    grad.addColorStop(0, z.top);
    grad.addColorStop(0.5, z.mid);
    grad.addColorStop(1, z.bottom);
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,VW,VH);
  }
}

function drawPlatforms() {
  for (const p of platforms) {
    ctx.fillStyle = "#2a1238";
    ctx.fillRect(p.x, p.y+2, p.w, p.h);
    const g = ctx.createLinearGradient(p.x, p.y, p.x, p.y+p.h);
    g.addColorStop(0, "#ff8cff");
    g.addColorStop(1, "#d350ff");
    ctx.fillStyle = g;
    ctx.fillRect(p.x, p.y, p.w, p.h);
  }
}

function drawPowerUps() {
  if (!orbImg.complete || !orbImg.naturalWidth) return;

  orbAnim += 0.16;
  orbFrame = Math.floor(orbAnim) % ORB_COLS;

  const fs = ORB_FRAME_SIZE;

  for (const pu of powerUps) {
    if (pu.taken) continue;

    // glow
    const glowR = ORB_DRAW_SIZE*1.4;
    const grad = ctx.createRadialGradient(pu.x, pu.y, 0, pu.x, pu.y, glowR);
    grad.addColorStop(0, "rgba(255,255,180,0.9)");
    grad.addColorStop(1, "rgba(255,255,180,0)");
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(pu.x, pu.y, glowR, 0, Math.PI*2);
    ctx.fill();

    // sprite
    ctx.drawImage(
      orbImg,
      orbFrame*fs, 0, fs, fs,
      pu.x - ORB_DRAW_SIZE,
      pu.y - ORB_DRAW_SIZE,
      ORB_DRAW_SIZE*2,
      ORB_DRAW_SIZE*2
    );
  }
}

function drawThunder() {
  let img = thunderImgs.idle;

  if (player.vy < -0.5) img = (player.vx >= 0 ? thunderImgs.jumpRight : thunderImgs.jumpLeft);
  else if (player.vy > 1) img = thunderImgs.fall;

  if (!img.complete) return;

  ctx.drawImage(
    img,
    player.x - 13,
    player.y - 18,
    26, 36
  );
}

// ======================================================
//                   UPDATE
// ======================================================
function update(dt) {
  if (!player.alive) return;

  // movimiento lateral
  if (leftHeld && !rightHeld)  player.vx -= 0.26 * dt * 60;
  if (rightHeld && !leftHeld)  player.vx += 0.26 * dt * 60;
  if (!leftHeld && !rightHeld) player.vx *= world.friction;

  if (player.vx > world.maxVX) player.vx = world.maxVX;
  if (player.vx < -world.maxVX) player.vx = -world.maxVX;

  player.x += player.vx * dt * 60;
  if (player.x < -player.r)       player.x = VW + player.r;
  if (player.x > VW + player.r)   player.x = -player.r;

  // gravedad
  player.vy += world.gravity * dt * 60;
  player.y  += player.vy * dt * 60;

  // colisión plataformas
  if (player.vy > 0) {
    for (const p of platforms) {
      if (player.x > p.x-7 && player.x < p.x+p.w+7 &&
          player.y + player.r > p.y &&
          player.y + player.r < p.y + p.h + player.vy*dt*60 + 1) {
        player.y = p.y - player.r;
        player.vy = world.baseJumpVel;
      }
    }
  }

  // scroll vertical
  const cam = VH * 0.4;
  if (player.y < cam) {
    const diff = cam - player.y;
    player.y += diff;
    world.scrollY += diff;

    for (let p of platforms) p.y += diff;
    for (let pu of powerUps) pu.y += diff;

    platforms = platforms.filter(p => p.y < VH+20);
    while (platforms.length < 20) {
      const topY = Math.min(...platforms.map(pl => pl.y));
      const newY = topY - (18 + Math.random()*10);
      const newX = 10 + Math.random()*(VW-60);
      platforms.push(createPlatform(newX, newY));
    }

    powerUps = powerUps.filter(pu => pu.y < VH+40 && !pu.taken);
  }

  // recoger orbes
  for (const pu of powerUps) {
    if (pu.taken) continue;
    const dx = pu.x - player.x;
    const dy = pu.y - player.y;
    const rr = pu.r + player.r;
    if (dx*dx + dy*dy < rr*rr) {
      pu.taken = true;
      player.vy = world.baseJumpVel * 1.3;
      // opcional: sumar coins si luego los usas
      // coins++;
    }
  }

  const meters = Math.floor(world.scrollY / 10);
  world.heightMeters = meters;

  hudScore.textContent = `${meters} m`;
  hudZone.textContent  = `THUNDER ASCENSION — Zona: ${getZone(meters).name}`;
  hudCoins.textContent = coins;

  if (player.y > VH + 20) {
    player.alive = false;
    bestHeight = Math.max(bestHeight, world.scrollY);
    hudBottom.textContent =
      `Mejor: ${Math.floor(bestHeight/10)} m · toca para reiniciar`;
  }
}

// ======================================================
//                   LOOP PRINCIPAL
// ======================================================
function gameLoop(ts) {
  const dt = Math.min((ts - lastTime)/1000, 0.05);
  lastTime = ts;

  update(dt);

  ctx.clearRect(0,0,VW,VH);
  drawBackground();
  drawPlatforms();
  drawPowerUps();
  drawThunder();

  requestAnimationFrame(gameLoop);
}

// ======================================================
//                  RESET / START
// ======================================================
function resetGame() {
  world.scrollY = 0;
  world.heightMeters = 0;

  player.x = VW/2;
  player.y = VH-40;
  player.vx = 0;
  player.vy = -5;
  player.alive = true;

  initPlatforms();
  hudBottom.textContent = `Mejor: ${Math.floor(bestHeight/10)} m`;
}

// start
preloadAssets().then(() => {
  resetGame();
  requestAnimationFrame(gameLoop);
});

// reiniciar tocando cuando estás muerto
canvas.addEventListener("click", () => {
  if (!player.alive) {
    bestHeight = Math.max(bestHeight, world.scrollY);
    resetGame();
  }
});
</script>

</body>
</html>
