<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Thunder Ascension</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />

  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #05030a;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #fff;
    }

    .frame {
      width: min(420px, 100vw);      /* tamaño físico igual, pero el mundo interno ahora es más grande */
      aspect-ratio: 9 / 16;
      border-radius: 16px;
      border: 2px solid #ff55dd;
      box-shadow: 0 0 32px rgba(255,85,221,0.4);
      overflow: hidden;
      background: #000;
      position: relative;
      touch-action: none;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* HUD SUPERIOR ROJO */
    .hud-top {
      position: absolute;
      top: 4px;
      left: 0;
      width: 100%;
      pointer-events: none;
      padding: 4px 10px;
      background: linear-gradient(90deg, #2b000c, #410016, #2b000c);
      display: flex;
      align-items: center;
      text-shadow: 0 0 4px #000;
      z-index: 10;
      border-bottom: 1px solid #ff5577;
    }

    .hud-left { min-width: 64px; }

    .hud-score {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 1px;
      color: #ff3344;          /* metros en rojo */
    }

    .hud-center {
      flex: 1;
      text-align: center;
      line-height: 1.1;
    }

    .hud-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #ffe5e5;
    }

    .hud-zone {
      font-size: 11px;
      opacity: 0.9;
      color: #ffb3c1;
    }

    .hud-coins {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 15px;
      font-weight: 700;
      color: #ffd84a;          /* contador amarillo */
      min-width: 40px;
      justify-content: flex-end;
    }

    .coin-icon {
      width: 16px;             /* lo bajamos un poco para que no se vea tan chafa */
      height: 16px;
      image-rendering: pixelated;
    }

    /* HUD INFERIOR */
    .hud-bottom {
      position: absolute;
      bottom: 4px;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 12px;
      pointer-events: none;
      text-shadow: 0 0 4px #000;
    }

    .hint {
      position: absolute;
      bottom: 26px;
      width: 100%;
      text-align: center;
      font-size: 10px;
      opacity: 0.75;
      pointer-events: none;
    }
  </style>
</head>
<body>

<div class="frame">
  <div class="hud-top">
    <div class="hud-left">
      <div id="hudScore" class="hud-score">0 m</div>
    </div>

    <div class="hud-center">
      <div class="hud-title">THUNDER ASCENSION</div>
      <div id="hudZone" class="hud-zone">Zona: Jardín</div>
    </div>

    <div class="hud-coins">
      <!-- lo ideal sería un PNG de un solo frame para el HUD; por ahora usamos el sheet reducido -->
      <img src="thunder-coin.PNG" class="coin-icon" alt="coin" />
      <span id="hudCoins">0</span>
    </div>
  </div>

  <canvas id="game"></canvas>

  <div class="hint">PC: Flechas ← → · Móvil: toca izquierda/derecha</div>
  <div class="hud-bottom" id="hudBottom">Mejor: 0 m</div>
</div>

<script>
// ======================================================
//              CARGA DE RECURSOS
// ======================================================
const bgImgs = {
  garden:   new Image(),
  sky:      new Image(),
  strato:   new Image(),
  orbit:    new Image(),
  moon:     new Image(),
  mars:     new Image(),
  belt:     new Image(),
  jupiter:  new Image(),
  saturn:   new Image(),
  uranus:   new Image(),
  neptune:  new Image(),
  pluto:    new Image(),
  rift:     new Image()
};

// Por ahora puedes mapear varios a las mismas imágenes que ya tienes
const bgPaths = {
  garden:  "bg-garden.jpeg",
  sky:     "bg-sky.jpeg",
  strato:  "bg-sky.jpeg",
  orbit:   "bg-solar.jpeg",
  moon:    "bg-solar.jpeg",
  mars:    "bg-solar.jpeg",
  belt:    "bg-milkyway.JPG",
  jupiter: "bg-milkyway.JPG",
  saturn:  "bg-virgo.JPG",
  uranus:  "bg-virgo.JPG",
  neptune: "bg-horizon.JPG",
  pluto:   "bg-horizon.JPG",
  rift:    "bg-horizon.JPG"
};

// --------- ORBE POWER-UP (SPRITE SHEET) ---------
const orbImg = new Image();
const orbPath = "orb-electric.png";

const ORB_COLS = 8;
let ORB_FRAME_SIZE = 128;
const ORB_DRAW_SIZE = 11;       // un poquito más grande

let orbAnim = 0;
let orbFrame = 0;

// --------- THUNDER COIN (SPRITE SHEET) ---------
const coinImg = new Image();
const coinPath = "thunder-coin.PNG";

const COIN_COLS = 9;            // tu sheet de 9 frames
let COIN_FRAME_SIZE = 64;
const COIN_DRAW_SIZE = 11;

let coinAnim = 0;
let coinFrame = 0;

// --------- SPRITES THUNDER ---------
const thunderImgs = {
  idle:      new Image(),
  jumpRight: new Image(),
  jumpLeft:  new Image(),
  fall:      new Image()
};

const thunderPaths = {
  idle:      "thunder-idle.png",
  jumpRight: "thunder-jump_right.png",
  jumpLeft:  "thunder_jump_left.png",
  fall:      "thunder_fall.png"
};

async function preloadAssets() {
  const tasks = [];

  function load(img, path) {
    return new Promise(res => {
      img.onload = res;
      img.onerror = res;
      img.src = path;
    });
  }

  for (let k in bgPaths)      tasks.push(load(bgImgs[k], bgPaths[k]));
  for (let k in thunderPaths) tasks.push(load(thunderImgs[k], thunderPaths[k]));
  tasks.push(load(orbImg,  orbPath));
  tasks.push(load(coinImg, coinPath));

  await Promise.all(tasks);

  if (orbImg.naturalWidth) {
    ORB_FRAME_SIZE = orbImg.naturalWidth / ORB_COLS;
  }
  if (coinImg.naturalWidth) {
    COIN_FRAME_SIZE = coinImg.naturalWidth / COIN_COLS;
  }

  console.log("Assets cargados");
}

// ======================================================
//                 VARIABLES DEL JUEGO
// ======================================================
const canvas = document.getElementById("game");
const ctx    = canvas.getContext("2d");

// Mundo lógico más grande
const VW = 216;
const VH = 384;

canvas.width  = VW * 2;
canvas.height = VH * 2;
ctx.scale(2,2);

const hudScore  = document.getElementById("hudScore");
const hudZone   = document.getElementById("hudZone");
const hudCoins  = document.getElementById("hudCoins");
const hudBottom = document.getElementById("hudBottom");

let coins      = 0;
let lastTime   = 0;
let leftHeld   = false;
let rightHeld  = false;
let bestHeight = 0;

// físicas
const world = {
  gravity: 0.38,        // un pelín menos gravedad para boosts altos más suaves
  baseJumpVel: -8.5,
  maxVX: 2.5,
  friction: 0.9,
  scrollY: 0,
  heightMeters: 0
};

const player = {
  x: VW/2,
  y: VH-60,            // lo bajamos un poco en pantalla para que haya más "cielo"
  vx: 0,
  vy: 0,
  r: 7,
  alive: true
};

let platforms = [];
let powerUps  = [];   // orbes eléctricos
let coinItems = [];   // monedas recogibles

// ======================================================
//                ZONAS (0 a 50,000 m)
// ======================================================
function getZone(height) {
  if (height < 500)
    return { key:"garden", name:"Jardín" };
  if (height < 2000)
    return { key:"sky", name:"Cielo" };
  if (height < 5000)
    return { key:"strato", name:"Estratósfera" };
  if (height < 9000)
    return { key:"orbit", name:"Órbita Terrestre" };
  if (height < 13000)
    return { key:"moon", name:"Luna" };
  if (height < 17000)
    return { key:"mars", name:"Marte" };
  if (height < 22000)
    return { key:"belt", name:"Cinturón de Asteroides" };
  if (height < 27000)
    return { key:"jupiter", name:"Júpiter" };
  if (height < 32000)
    return { key:"saturn", name:"Saturno" };
  if (height < 37000)
    return { key:"uranus", name:"Urano" };      // aquí luego meteoro grande y lento
  if (height < 42000)
    return { key:"neptune", name:"Neptuno" };
  if (height < 46000)
    return { key:"pluto", name:"Plutón / Kuiper" };
  return { key:"rift", name:"Ruptura del Ciberespacio" };
}

// ======================================================
//             PLATAFORMAS / POWERUPS / COINS
// ======================================================
const PLATFORM_TYPES = {
  NORMAL: 'normal',
  SMALL:  'small',
  BREAK:  'break',
  MOVE:   'move',
  BOOST:  'boost'
};

function createPlatform(x, y) {
  const difficulty = world.heightMeters;
  let type = PLATFORM_TYPES.NORMAL;

  const r = Math.random();

  // Elección de tipo según altura
  if (difficulty > 3000 && r < 0.15)       type = PLATFORM_TYPES.SMALL;
  else if (difficulty > 2000 && r < 0.10)  type = PLATFORM_TYPES.BREAK;
  else if (difficulty > 800  && r < 0.10)  type = PLATFORM_TYPES.MOVE;
  else if (r < 0.05)                       type = PLATFORM_TYPES.BOOST;

  // Plataformas algo más grandes abajo, más pequeñas arriba
  let wBase = 44;
  if (difficulty > 15000) wBase = 36;
  if (difficulty > 30000) wBase = 30;

  const plat = {
    x,
    y,
    w: (type === PLATFORM_TYPES.SMALL ? 24 : wBase),
    h: 6,
    type,
    vx: (type === PLATFORM_TYPES.MOVE ? (Math.random() < 0.5 ? -0.5 : 0.5) : 0),
    rangeMin: 10,
    rangeMax: VW - 10,
    broken: false
  };

  // Monedas Thunder — pueden salir en cualquier plataforma
  if (Math.random() < 0.20) {
    coinItems.push({
      x: x + plat.w / 2,
      y: y - 12,
      r: COIN_DRAW_SIZE * 0.4,
      taken: false
    });
  }

  // Orbes eléctricos — desde Órbita Terrestre en adelante
  const zone = getZone(difficulty);
  const canHaveOrb =
    zone.key === "orbit" || zone.key === "moon" || zone.key === "mars" ||
    zone.key === "belt"  || zone.key === "jupiter" || zone.key === "saturn" ||
    zone.key === "uranus"|| zone.key === "neptune" || zone.key === "pluto" ||
    zone.key === "rift";

  if (canHaveOrb && Math.random() < 0.06) {
    powerUps.push({
      x: x + plat.w / 2,
      y: y - 18,
      r: ORB_DRAW_SIZE * 0.6,
      taken: false
    });
  }

  return plat;
}

function initPlatforms() {
  platforms = [];
  powerUps  = [];
  coinItems = [];

  let y = VH - 30;
  platforms.push(createPlatform(VW/2 - 20, y));

  // MÁS densidad de plataformas: pasos más pequeños
  while (y > -VH) {
    y -= 14 + Math.random()*6;    // antes tenías 18 + random*10
    const x = 10 + Math.random()*(VW-60);
    platforms.push(createPlatform(x, y));
  }
}

// ======================================================
//                   CONTROLES
// ======================================================
function handleKeyboard(e, down) {
  if (["ArrowLeft","a","A"].includes(e.key))  { leftHeld  = down; e.preventDefault(); }
  if (["ArrowRight","d","D"].includes(e.key)) { rightHeld = down; e.preventDefault(); }
  if (e.key === " " && !down && !player.alive) resetGame();
}
document.addEventListener("keydown", e => handleKeyboard(e,true));
document.addEventListener("keyup",   e => handleKeyboard(e,false));

// Táctil
function handleTouch(e) {
  e.preventDefault();

  if (e.touches.length === 0) {
    leftHeld = rightHeld = false;
    return;
  }

  let anyLeft  = false;
  let anyRight = false;

  const rect = canvas.getBoundingClientRect();

  for (const t of e.touches) {
    const x = t.clientX - rect.left;
    if (x < rect.width * 0.5) anyLeft  = true;
    else                      anyRight = true;
  }

  leftHeld  = anyLeft;
  rightHeld = anyRight;
}
function clearTouch() {
  leftHeld = false;
  rightHeld = false;
}

document.addEventListener("touchstart", handleTouch, { passive:false });
document.addEventListener("touchmove",  handleTouch, { passive:false });
document.addEventListener("touchend",   clearTouch,  { passive:false });
document.addEventListener("touchcancel",clearTouch,  { passive:false });

// Mouse (PC)
canvas.addEventListener("mousedown", e => {
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  if (x < rect.width * 0.5) leftHeld = true;
  else                      rightHeld = true;
});
window.addEventListener("mouseup", () => {
  leftHeld = rightHeld = false;
});

// ======================================================
//                   DIBUJO
// ======================================================
function drawBackground() {
  const z   = getZone(world.heightMeters);
  const img = bgImgs[z.key];

  if (img && img.complete && img.naturalWidth) {
    const iw = img.naturalWidth;
    const ih = img.naturalHeight;
    const ratio = iw/ih;
    const screenRatio = VW/VH;

    let dw, dh;
    if (ratio > screenRatio) {
      dh = VH;
      dw = dh * ratio;
    } else {
      dw = VW;
      dh = dw / ratio;
    }

    ctx.drawImage(img, (VW-dw)/2, (VH-dh)/2, dw, dh);
  } else {
    const grad = ctx.createLinearGradient(0,0,0,VH);
    grad.addColorStop(0, "#05020c");
    grad.addColorStop(1, "#300018");
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,VW,VH);
  }
}

function drawPlatforms() {
  for (const p of platforms) {
    // sombra
    ctx.fillStyle = "#2a1238";
    ctx.fillRect(p.x, p.y + 2, p.w, p.h);

    let topColor    = "#ff8cff";
    let bottomColor = "#d350ff";

    if (p.type === PLATFORM_TYPES.BREAK) {
      topColor    = "#ffb347";
      bottomColor = "#ff6b3d";
    } else if (p.type === PLATFORM_TYPES.MOVE) {
      topColor    = "#8cd6ff";
      bottomColor = "#5075ff";
    } else if (p.type === PLATFORM_TYPES.BOOST) {
      topColor    = "#c7ff6b";
      bottomColor = "#5fd63a";
    } else if (p.type === PLATFORM_TYPES.SMALL) {
      topColor    = "#ff9cff";
      bottomColor = "#e040ff";
    }

    const g = ctx.createLinearGradient(p.x, p.y, p.x, p.y + p.h);
    g.addColorStop(0, topColor);
    g.addColorStop(1, bottomColor);
    ctx.fillStyle = g;
    ctx.fillRect(p.x, p.y, p.w, p.h);

    if (p.type === PLATFORM_TYPES.BREAK) {
      ctx.strokeStyle = "rgba(80,0,0,0.6)";
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x + p.w, p.y + p.h);
      ctx.moveTo(p.x + p.w*0.2, p.y);
      ctx.lineTo(p.x + p.w*0.8, p.y + p.h);
      ctx.stroke();
    }
  }
}

function drawPowerUps() {
  if (!orbImg.complete || !orbImg.naturalWidth) return;

  orbAnim += 0.16;
  orbFrame = Math.floor(orbAnim) % ORB_COLS;

  const fs = ORB_FRAME_SIZE;

  for (const pu of powerUps) {
    if (pu.taken) continue;

    const glowR = ORB_DRAW_SIZE*1.6;
    const grad = ctx.createRadialGradient(pu.x, pu.y, 0, pu.x, pu.y, glowR);
    grad.addColorStop(0, "rgba(255,255,200,0.9)");
    grad.addColorStop(1, "rgba(255,255,200,0)");
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(pu.x, pu.y, glowR, 0, Math.PI*2);
    ctx.fill();

    ctx.drawImage(
      orbImg,
      orbFrame*fs, 0, fs, fs,
      pu.x - ORB_DRAW_SIZE,
      pu.y - ORB_DRAW_SIZE,
      ORB_DRAW_SIZE*2,
      ORB_DRAW_SIZE*2
    );
  }
}

function drawCoins() {
  if (!coinImg.complete || !coinImg.naturalWidth) return;

  coinAnim += 0.18;
  coinFrame = Math.floor(coinAnim) % COIN_COLS;

  const fs = COIN_FRAME_SIZE;

  for (const c of coinItems) {
    if (c.taken) continue;

    ctx.drawImage(
      coinImg,
      coinFrame * fs, 0, fs, fs,
      c.x - COIN_DRAW_SIZE,
      c.y - COIN_DRAW_SIZE,
      COIN_DRAW_SIZE * 2,
      COIN_DRAW_SIZE * 2
    );
  }
}

function drawThunder() {
  let img = thunderImgs.idle;

  if (player.vy < -0.5) img = (player.vx >= 0 ? thunderImgs.jumpRight : thunderImgs.jumpLeft);
  else if (player.vy > 1) img = thunderImgs.fall;

  if (!img.complete) return;

  ctx.drawImage(
    img,
    player.x - 13,
    player.y - 18,
    26, 36
  );
}

// ======================================================
//                   UPDATE
// ======================================================
function update(dt) {
  if (!player.alive) return;

  // mover plataformas MOVE
  for (const p of platforms) {
    if (p.type === PLATFORM_TYPES.MOVE) {
      p.x += p.vx * dt * 60;
      if (p.x < p.rangeMin || p.x + p.w > p.rangeMax) {
        p.vx *= -1;
        if (p.x < p.rangeMin) p.x = p.rangeMin;
        if (p.x + p.w > p.rangeMax) p.x = p.rangeMax - p.w;
      }
    }
  }

  // movimiento lateral
  if (leftHeld && !rightHeld)  player.vx -= 0.30 * dt * 60;
  if (rightHeld && !leftHeld)  player.vx += 0.30 * dt * 60;
  if (!leftHeld && !rightHeld) player.vx *= world.friction;

  if (player.vx > world.maxVX)  player.vx = world.maxVX;
  if (player.vx < -world.maxVX) player.vx = -world.maxVX;

  player.x += player.vx * dt * 60;
  if (player.x < -player.r)       player.x = VW + player.r;
  if (player.x > VW + player.r)   player.x = -player.r;

  // gravedad
  player.vy += world.gravity * dt * 60;
  player.y  += player.vy * dt * 60;

  // colisión plataformas
  if (player.vy > 0) {
    for (const p of platforms) {
      if (
        player.x > p.x - 7 &&
        player.x < p.x + p.w + 7 &&
        player.y + player.r > p.y &&
        player.y + player.r < p.y + p.h + player.vy * dt * 60 + 1
      ) {
        player.y = p.y - player.r;

        // saltos
        const normalJump = world.baseJumpVel;
        const boostJump  = world.baseJumpVel * 1.4; // BOOST más controlable
        if (p.type === PLATFORM_TYPES.BOOST) {
          player.vy = boostJump;
        } else {
          player.vy = normalJump;
        }

        if (p.type === PLATFORM_TYPES.BREAK) {
          p.broken = true;
        }
      }
    }
  }

  // scroll
  const cam = VH * 0.38;  // bajamos un poco la "cámara"
  if (player.y < cam) {
    const diff = cam - player.y;
    player.y += diff;
    world.scrollY += diff;

    for (let p of platforms) p.y += diff;
    for (let pu of powerUps) pu.y += diff;
    for (let c  of coinItems) c.y  += diff;

    // limpiar y re-crear
    platforms = platforms.filter(p => p.y < VH+30 && !p.broken);
    while (platforms.length < 22) {
      const topY = Math.min(...platforms.map(pl => pl.y));
      const newY = topY - (14 + Math.random()*6);
      const newX = 10 + Math.random()*(VW-60);
      platforms.push(createPlatform(newX, newY));
    }

    powerUps  = powerUps.filter(pu => pu.y < VH+40 && !pu.taken);
    coinItems = coinItems.filter(c  => c.y  < VH+40 && !c.taken);
  }

  // recoger orbes – ULTRA BOOST (más fuerte que la plataforma verde)
  for (const pu of powerUps) {
    if (pu.taken) continue;
    const dx = pu.x - player.x;
    const dy = pu.y - player.y;
    const rr = pu.r + player.r;
    if (dx*dx + dy*dy < rr*rr) {
      pu.taken = true;
      // salto MUCHO más alto, pero con menos gravedad ya es más controlable
      player.vy = world.baseJumpVel * 2.0;
    }
  }

  // recoger monedas
  for (const c of coinItems) {
    if (c.taken) continue;
    const dx = c.x - player.x;
    const dy = c.y - player.y;
    const rr = c.r + player.r;
    if (dx*dx + dy*dy < rr*rr) {
      c.taken = true;
      coins += 1;
    }
  }

  const meters = Math.floor(world.scrollY / 10);
  world.heightMeters = meters;

  hudScore.textContent = `${meters} m`;
  hudZone.textContent  = `Zona: ${getZone(meters).name}`;
  hudCoins.textContent = coins;

  if (player.y > VH + 40) {
    player.alive = false;
    bestHeight = Math.max(bestHeight, world.scrollY);
    hudBottom.textContent =
      `Mejor: ${Math.floor(bestHeight/10)} m · toca para reiniciar`;
  }
}

// ======================================================
//                   LOOP PRINCIPAL
// ======================================================
function gameLoop(ts) {
  const dt = Math.min((ts - lastTime)/1000, 0.05);
  lastTime = ts;

  update(dt);

  ctx.clearRect(0,0,VW,VH);
  drawBackground();
  drawPlatforms();
  drawPowerUps();
  drawCoins();
  drawThunder();

  requestAnimationFrame(gameLoop);
}

// ======================================================
//                  RESET / START
// ======================================================
function resetGame() {
  world.scrollY = 0;
  world.heightMeters = 0;

  player.x = VW/2;
  player.y = VH-60;
  player.vx = 0;
  player.vy = -5;
  player.alive = true;

  coins = 0;
  initPlatforms();
  hudBottom.textContent = `Mejor: ${Math.floor(bestHeight/10)} m`;
}

preloadAssets().then(() => {
  resetGame();
  requestAnimationFrame(gameLoop);
});

// reiniciar tocando cuando estás muerto
canvas.addEventListener("click", () => {
  if (!player.alive) {
    bestHeight = Math.max(bestHeight, world.scrollY);
    resetGame();
  }
});
</script>

</body>
</html>
