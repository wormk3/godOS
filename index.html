<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ascensión Infinita</title>
    <style>
        /* Estilos para el canvas y overlays */
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
            background: #000;
            font-family: Arial, sans-serif;
        }
        canvas {
            display: block;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            font-size: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="startOverlay" class="overlay">TOCA PARA EMPEZAR</div>
    <div id="gameOverOverlay" class="overlay" style="display:none;">GAME OVER - TOCA PARA REINICIAR</div>
    <canvas></canvas>

    <script>
        /* ===============================
        ASCENSIÓN INFINITA (Fase 2 Prototipo)
        =============================== */

        // Variables iniciales
        const canvas = document.querySelector("canvas");
        const ctx = canvas.getContext("2d");
        const startOverlay = document.getElementById("startOverlay");
        const gameOverOverlay = document.getElementById("gameOverOverlay");
        let width = window.innerWidth;
        let height = window.innerHeight;
        let started = false;
        let gameOver = false;
        let platforms = [];
        let worm = {
            x: width / 2,
            y: height - 60,
            radius: 20,
            velocity: { x: 0, y: 0 }, // Física
            sprite: null,
            jumping: false,
        };
        let gameData = {
            heightReached: 0,
            currentZone: "Jardín",
            platformSpacing: 120,
        };
        const backgroundGradient = ctx.createLinearGradient(0, 0, 0, height);

        // Constantes de física y control
        const GRAVITY = 0.8;
        const FRICTION = 0.98;
        const MAX_VELOCITY_X = 6; // Máxima velocidad horizontal
        const SENSITIVITY = 0.1; // Sensibilidad en móvil

        // Crear canvas adaptado a móvil
        canvas.width = width;
        canvas.height = height;

        // Sprite de gusano en base64 (SVG)
        const wormSpriteBase64 = "data:image/svg+xml;base64," +
            btoa(`
                <svg xmlns="http://www.w3.org/2000/svg" width="60" height="30">
                    <circle cx="15" cy="15" r="10" fill="green" />
                    <circle cx="30" cy="15" r="10" fill="lime" />
                    <circle cx="45" cy="15" r="10" fill="lightgreen" />
                </svg>`);
        const wormImage = new Image();
        wormImage.src = wormSpriteBase64;

        // Dibujar escenarios
        function drawBackground() {
            const colorStops = {
                Jardín: ["#76c893", "#6c757d"],
                Cielo: ["#67c5ff", "#b3daff"],
                Atmósfera: ["#4c84c8", "#27374d"],
                Espacio: ["#191d42", "#070810"],
                Neon: ["#ff00de", "#650090"],
            };
            const heightPerZone = 2000; // Cambios cromáticos conforme avanzas por zonas
            const zoneKeys = Object.keys(colorStops);

            for (let i = 0; i < zoneKeys.length; i++) {
                if (gameData.heightReached <= (i + 1) * heightPerZone) {
                    gameData.currentZone = zoneKeys[i];
                    break;
                }
            }

            backgroundGradient.addColorStop(0, colorStops[gameData.currentZone][0]);
            backgroundGradient.addColorStop(1, colorStops[gameData.currentZone][1]);

            ctx.fillStyle = backgroundGradient;
            ctx.fillRect(0, 0, width, height);
        }

        // Dibujar gusano
        function drawWorm() {
            ctx.save();
            ctx.translate(worm.x, worm.y);
            ctx.drawImage(
                wormImage, 
                -30, -30, 
            ); 
           
        // añadir
