<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Ascensión de Wormk</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <style>
    :root {
      color-scheme: dark;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #05030a;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #fff;
    }
    .frame {
      width: min(420px, 100vw);
      aspect-ratio: 9/16;
      border-radius: 16px;
      border: 2px solid #ff55dd;
      box-shadow: 0 0 32px rgba(255, 85, 221, 0.4);
      overflow: hidden;
      background: #000;
      position: relative;
      touch-action: none;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .hud-top {
      position: absolute;
      top: 4px;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-shadow: 0 0 4px #000;
      pointer-events: none;
      padding: 0 6px;
    }
    .hud-bottom {
      position: absolute;
      bottom: 4px;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 12px;
      text-shadow: 0 0 4px #000;
      pointer-events: none;
      padding: 0 6px;
    }
    .hint {
      position: absolute;
      bottom: 26px;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 10px;
      opacity: 0.75;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="hud-top" id="hudTop">ASCENSIÓN DE WORMK — Zona: Jardín</div>
    <canvas id="game"></canvas>
    <div class="hud-bottom" id="hudBottom">Altura: 0 m · Mejor: 0 m</div>
    <div class="hint">PC: Flechas ← → · Móvil: toca izquierda / derecha</div>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const hudBottom = document.getElementById("hudBottom");
    const hudTop = document.getElementById("hudTop");

    // Mundo "pixel" lógico
    const VW = 180;
    const VH = 320;

    let lastTime = 0;
    let leftHeld = false;
    let rightHeld = false;
    let bestHeight = 0;

    const world = {
      gravity: 0.35,
      baseJumpVel: -7.8,
      maxVX: 2.2,
      friction: 0.88,
      scrollY: 0,         // píxeles virtuales subidos
      heightMeters: 0,
      zoneName: "Jardín",
      controlsInverted: false,
      invertTimer: 0,
      jumpBoostTimer: 0,        // tiempo restante del buff
      jumpBoostMultiplier: 1.0  // multiplicador actual del salto
    };

    function currentJumpVel() {
      return world.baseJumpVel * (world.jumpBoostMultiplier || 1);
    }

    const player = {
      x: VW / 2,
      y: VH - 40,
      vx: 0,
      vy: 0,
      r: 7,
      alive: true
    };

    const platforms = [];
    const PLATFORM_WIDTH = 40;
    const PLATFORM_HEIGHT = 6;
    const PLATFORM_GAP_MIN = 18;
    const PLATFORM_GAP_MAX = 28;

    // Hazards
    const meteorites = [];
    const blackHoles = [];
    let meteorTimer = 0;
    let blackHoleTimer = 0;

    // Power-ups
    let powerUps = [];

    function resizeCanvas() {
      const frame = canvas.parentElement.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = frame.width * dpr;
      canvas.height = frame.height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.imageSmoothingEnabled = false;
    }

    function getZone(heightM) {
      if (heightM < 150) {
        return {
          key: "garden",
          name: "Jardín",
          top: "#19143f",
          mid: "#182b57",
          bottom: "#0f4a3a",
          stars: 25
        };
      } else if (heightM < 900) {
        return {
          key: "sky",
          name: "Cielo",
          top: "#203a7a",
          mid: "#246db0",
          bottom: "#63b3ff",
          stars: 36
        };
      } else if (heightM < 3500) {
        return {
          key: "solar",
          name: "Sistema Solar",
          top: "#10152f",
          mid: "#171f4f",
          bottom: "#243a6b",
          stars: 60
        };
      } else if (heightM < 12000) {
        return {
          key: "milkyway",
          name: "Vía Láctea",
          top: "#050313",
          mid: "#151437",
          bottom: "#203b6a",
          stars: 90
        };
      } else if (heightM < 40000) {
        return {
          key: "virgo",
          name: "Supercúmulo de Virgo",
          top: "#05020c",
          mid: "#24062e",
          bottom: "#3c1458",
          stars: 120
        };
      } else {
        return {
          key: "horizon",
          name: "Horizonte Cósmico",
          top: "#2b0538",
          mid: "#3b1374",
          bottom: "#ff0077",
          stars: 140
        };
      }
    }

    function createPlatform(x, y) {
      const plat = {
        x,
        y,
        w: PLATFORM_WIDTH,
        h: PLATFORM_HEIGHT,
        vx: 0,
        rangeMin: x,
        rangeMax: x + PLATFORM_WIDTH
      };

      const zone = getZone(world.heightMeters);

      // Plataformas móviles en zonas altas
      if (
        (zone.key === "milkyway" || zone.key === "virgo" || zone.key === "horizon") &&
        Math.random() < 0.35
      ) {
        plat.vx = (Math.random() < 0.5 ? -0.4 : 0.4);
        plat.rangeMin = 10;
        plat.rangeMax = VW - PLATFORM_WIDTH - 10;
      }

      // Power-up en algunas plataformas (excepto en Jardín)
      if (zone.key !== "garden" && Math.random() < 0.18) {
        powerUps.push({
          x: x + PLATFORM_WIDTH / 2,
          y: y - 8,
          r: 4,
          taken: false
        });
      }

      return plat;
    }

    function initPlatforms() {
      platforms.length = 0;
      powerUps = [];
      let y = VH - 20;
      platforms.push(createPlatform(VW / 2 - PLATFORM_WIDTH / 2, y));
      y -= 25;
      while (y > -VH) {
        const x = 10 + Math.random() * (VW - PLATFORM_WIDTH - 20);
        platforms.push(createPlatform(x, y));
        y -= PLATFORM_GAP_MIN + Math.random() * (PLATFORM_GAP_MAX - PLATFORM_GAP_MIN);
      }
    }

    function resetGame() {
      world.scrollY = 0;
      world.heightMeters = 0;
      world.zoneName = "Jardín";
      world.controlsInverted = false;
      world.invertTimer = 0;
      world.jumpBoostTimer = 0;
      world.jumpBoostMultiplier = 1.0;

      meteorites.length = 0;
      blackHoles.length = 0;
      meteorTimer = 0;
      blackHoleTimer = 0;
      powerUps = [];

      player.x = VW / 2;
      player.y = VH - 40;
      player.vx = 0;
      player.vy = -5;
      player.alive = true;

      initPlatforms();
    }

    function handleKeyboard(e, isDown) {
      if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") {
        leftHeld = isDown;
        e.preventDefault();
      } else if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") {
        rightHeld = isDown;
        e.preventDefault();
      } else if (e.key === " " && !isDown && !player.alive) {
        resetGame();
      }
    }

    document.addEventListener("keydown", (e) => handleKeyboard(e, true));
    document.addEventListener("keyup", (e) => handleKeyboard(e, false));

    function updateTouch(e) {
      e.preventDefault();
      if (e.touches.length === 0) {
        leftHeld = rightHeld = false;
        return;
      }
      let anyLeft = false;
      let anyRight = false;
      const rect = canvas.getBoundingClientRect();
      for (const t of e.touches) {
        const x = t.clientX - rect.left;
        if (x < rect.width * 0.5) anyLeft = true;
        else anyRight = true;
      }
      leftHeld = anyLeft;
      rightHeld = anyRight;
    }

    canvas.addEventListener("touchstart", updateTouch, { passive: false });
    canvas.addEventListener("touchmove", updateTouch, { passive: false });
    canvas.addEventListener("touchend", updateTouch, { passive: false });
    canvas.addEventListener("touchcancel", updateTouch, { passive: false });

    canvas.addEventListener("mousedown", (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      if (x < rect.width * 0.5) leftHeld = true;
      else rightHeld = true;
    });
    window.addEventListener("mouseup", () => {
      leftHeld = rightHeld = false;
    });

    // --------- HAZARDS ---------
    function spawnMeteorite() {
      const side = Math.random() < 0.5 ? "left" : "right";
      const y = 20 + Math.random() * (VH * 0.6);
      const speed = 0.8 + Math.random() * 0.7;
      const vy = 0.08 + Math.random() * 0.18;
      const x = side === "left" ? -20 : VW + 20;
      const vx = side === "left" ? speed : -speed;
      meteorites.push({
        x,
        y,
        vx,
        vy,
        r: 4 + Math.random() * 3
      });
    }

    function spawnBlackHole() {
      const x = 20 + Math.random() * (VW - 40);
      const y = -20 - Math.random() * 60;
      blackHoles.push({
        x,
        y,
        r: 7 + Math.random() * 4,
        strength: 0.12 + Math.random() * 0.08
      });
    }

    function updateHazards(dt, zone) {
      meteorTimer += dt;
      blackHoleTimer += dt;

      // Meteoritos en Sistema Solar (2 a 4 máximo)
      if (zone.key === "solar") {
        const minM = 2;
        const maxM = 4;

        if (meteorites.length < minM && meteorTimer > 0.4) {
          spawnMeteorite();
          meteorTimer = 0;
        } else if (
          meteorites.length < maxM &&
          meteorTimer > 1.8 + Math.random() * 0.8
        ) {
          spawnMeteorite();
          meteorTimer = 0;
        }
      } else {
        meteorTimer = 0;
      }

      // Agujeros negros en Vía Láctea
      if (zone.key === "milkyway") {
        if (blackHoleTimer > 4 + Math.random() * 3) {
          spawnBlackHole();
          blackHoleTimer = 0;
        }
      } else {
        blackHoleTimer = 0;
      }

      // Mover meteoritos
      for (let i = meteorites.length - 1; i >= 0; i--) {
        const m = meteorites[i];
        m.x += m.vx;
        m.y += m.vy;
        if (m.y > VH + 40 || m.y < -60 || m.x < -60 || m.x > VW + 60) {
          meteorites.splice(i, 1);
        }
      }

      // Mover agujeros negros
      for (let i = blackHoles.length - 1; i >= 0; i--) {
        const b = blackHoles[i];
        b.y += 0.05;
        if (b.y > VH + 80) {
          blackHoles.splice(i, 1);
        }
      }

      // Atracción
      if (zone.key === "milkyway" || zone.key === "virgo" || zone.key === "horizon") {
        for (const b of blackHoles) {
          const dx = b.x - player.x;
          const dy = b.y - player.y;
          const distSq = dx * dx + dy * dy;
          const maxInfluence = 70;
          if (distSq < maxInfluence * maxInfluence) {
            const dist = Math.sqrt(distSq) + 0.001;
            const pull = b.strength * (1 - dist / maxInfluence);
            player.vx += (dx / dist) * pull;
          }
        }
      }
    }

    function applyHazardCollisions() {
      // Meteoritos
      for (const m of meteorites) {
        const dx = m.x - player.x;
        const dy = m.y - player.y;
        const rr = m.r + player.r * 0.7;
        if (dx * dx + dy * dy < rr * rr) {
          player.alive = false;
          return;
        }
      }
      // Agujeros negros
      for (const b of blackHoles) {
        const dx = b.x - player.x;
        const dy = b.y - player.y;
        const rr = b.r + player.r * 0.6;
        if (dx * dx + dy * dy < rr * rr) {
          player.alive = false;
          return;
        }
      }
    }

    function update(dt) {
      if (!player.alive) return;

      const zone = getZone(world.heightMeters);

      // Timer de power-up
      if (world.jumpBoostTimer > 0) {
        world.jumpBoostTimer -= dt;
        if (world.jumpBoostTimer <= 0) {
          world.jumpBoostTimer = 0;
          world.jumpBoostMultiplier = 1.0; // se acaba el combo
        }
      }

      // Controles invertidos en Horizonte Cósmico
      if (zone.key === "horizon") {
        if (!world.controlsInverted && Math.random() < 0.003) {
          world.controlsInverted = true;
          world.invertTimer = 2.5;
        }
      }
      if (world.controlsInverted) {
        world.invertTimer -= dt;
        if (world.invertTimer <= 0) {
          world.controlsInverted = false;
        }
      }

      // Movimiento horizontal
      let moveLeft = leftHeld;
      let moveRight = rightHeld;
      if (world.controlsInverted) {
        const tmp = moveLeft;
        moveLeft = moveRight;
        moveRight = tmp;
      }

      if (moveLeft && !moveRight) {
        player.vx -= 0.22;
      } else if (moveRight && !moveLeft) {
        player.vx += 0.22;
      } else {
        player.vx *= world.friction;
      }

      if (player.vx > world.maxVX) player.vx = world.maxVX;
      if (player.vx < -world.maxVX) player.vx = -world.maxVX;

      player.x += player.vx;

      if (player.x < -player.r) player.x = VW + player.r;
      if (player.x > VW + player.r) player.x = -player.r;

      // Movimiento vertical
      player.vy += world.gravity;
      player.y += player.vy;

      // Plataformas móviles
      for (const p of platforms) {
        if (p.vx !== 0) {
          p.x += p.vx;
          if (p.x < p.rangeMin || p.x + p.w > p.rangeMax) {
            p.vx *= -1;
            if (p.x < p.rangeMin) p.x = p.rangeMin;
            if (p.x + p.w > p.rangeMax) p.x = p.rangeMax - p.w;
          }
        }
      }

      // Colisión con plataformas (cayendo)
      if (player.vy > 0) {
        const bottom = player.y + player.r;
        for (const p of platforms) {
          if (
            bottom > p.y &&
            bottom < p.y + p.h + player.vy + 1 &&
            player.x > p.x - player.r &&
            player.x < p.x + p.w + player.r
          ) {
            player.y = p.y - player.r;
            player.vy = currentJumpVel();
          }
        }
      }

      // Scroll
      const camY = VH * 0.4;
      if (player.y < camY) {
        const diff = camY - player.y;
        player.y += diff;
        world.scrollY += diff;
        for (const p of platforms) p.y += diff;
        for (const m of meteorites) m.y += diff;
        for (const b of blackHoles) b.y += diff;
        for (const pu of powerUps) pu.y += diff;

        // limpiar abajo
        for (let i = platforms.length - 1; i >= 0; i--) {
          if (platforms[i].y > VH + 20) platforms.splice(i, 1);
        }
        powerUps = powerUps.filter((pu) => pu.y < VH + 40 && !pu.taken);

        // nuevas arriba
        let highestY = Infinity;
        for (const p of platforms) {
          if (p.y < highestY) highestY = p.y;
        }
        while (highestY > -VH) {
          const gap = PLATFORM_GAP_MIN + Math.random() * (PLATFORM_GAP_MAX - PLATFORM_GAP_MIN);
          highestY -= gap;
          const x = 10 + Math.random() * (VW - PLATFORM_WIDTH - 20);
          platforms.push(createPlatform(x, highestY));
        }
      }

      // 🔹 Colisión con power-ups (por contacto, y salto inmediato)
      for (const pu of powerUps) {
        if (pu.taken) continue;
        const dx = pu.x - player.x;
        const dy = pu.y - player.y;
        const rr = pu.r + player.r; // contacto más generoso
        if (dx * dx + dy * dy < rr * rr) {
          pu.taken = true;

          // Combo: cada orbe multiplica por 1.5 el salto actual
          if (world.jumpBoostTimer > 0 && world.jumpBoostMultiplier > 1.0) {
            world.jumpBoostMultiplier *= 1.5;
          } else {
            world.jumpBoostMultiplier = 1.5;
          }

          // Limitar para no romper el juego
          if (world.jumpBoostMultiplier > 3.5) {
            world.jumpBoostMultiplier = 3.5;
          }

          // Refrescar duración
          world.jumpBoostTimer = 6;

          // Salto inmediato usando el nuevo multiplicador
          player.vy = currentJumpVel() * 1.1;
        }
      }
      powerUps = powerUps.filter((pu) => !pu.taken && pu.y < VH + 40);

      // Game over
      if (player.y - player.r > VH + 10) {
        player.alive = false;
        if (world.scrollY > bestHeight) bestHeight = world.scrollY;
      }

      // Altura
      const heightMeters = Math.floor(world.scrollY / 10);
      world.heightMeters = heightMeters;
      const zoneNow = getZone(heightMeters);
      world.zoneName = zoneNow.name;

      // Hazards
      updateHazards(dt, zoneNow);
      applyHazardCollisions();

      const bestMeters = Math.floor(bestHeight / 10);
      hudBottom.textContent =
        `Altura: ${heightMeters} m · Mejor: ${bestMeters} m` +
        (!player.alive ? " · Toca o presiona ESPACIO para reiniciar" : "");

      let topText = `ASCENSIÓN DE WORMK — Zona: ${zoneNow.name}`;
      if (world.controlsInverted) topText += " · Controles invertidos";
      if (world.jumpBoostMultiplier > 1.01) {
        topText += ` · Salto x${world.jumpBoostMultiplier.toFixed(1)}`;
      }
      hudTop.textContent = topText;
    }

    function drawBackground() {
      const h = world.heightMeters;
      const zone = getZone(h);

      const grad = ctx.createLinearGradient(0, 0, 0, VH);
      grad.addColorStop(0, zone.top);
      grad.addColorStop(0.5, zone.mid);
      grad.addColorStop(1, zone.bottom);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, VW, VH);

      ctx.fillStyle = "rgba(255,255,255,0.03)";
      ctx.beginPath();
      ctx.ellipse(VW * 0.5, VH * 0.22, VW * 0.7, VH * 0.3, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(VW * 0.5, VH * 0.75, VW * 0.9, VH * 0.55, 0, 0, Math.PI * 2);
      ctx.fill();

      const starsCount = zone.stars;
      ctx.fillStyle = "rgba(255,255,255,0.6)";
      for (let i = 0; i < starsCount; i++) {
        const x = (i * 17.13 + h * 0.7) % VW;
        const y = ((i * 53.77 + h * 0.4) % VH);
        const r = (i % 4) * 0.2 + 0.3;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }

      if (zone.key === "solar") {
        ctx.save();
        ctx.translate(VW * 0.7, VH * 0.25);
        ctx.scale(1, 0.6);
        ctx.fillStyle = "#f2d27e";
        ctx.beginPath();
        ctx.arc(0, 0, 14, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        ctx.save();
        ctx.translate(VW * 0.7, VH * 0.25);
        ctx.strokeStyle = "rgba(255,240,200,0.9)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.ellipse(0, 0, 20, 8, 0.3, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      } else if (zone.key === "milkyway") {
        ctx.save();
        ctx.translate(VW * 0.1, VH * 0.1);
        ctx.rotate(-0.4);
        const gradMW = ctx.createLinearGradient(0, 0, VW * 1.4, 0);
        gradMW.addColorStop(0, "rgba(255,255,255,0)");
        gradMW.addColorStop(0.3, "rgba(200,220,255,0.5)");
        gradMW.addColorStop(0.7, "rgba(180,200,255,0.3)");
        gradMW.addColorStop(1, "rgba(255,255,255,0)");
        ctx.fillStyle = gradMW;
        ctx.fillRect(0, VH * 0.2, VW * 1.4, VH * 0.3);
        ctx.restore();
      } else if (zone.key === "virgo") {
        for (let i = 0; i < 10; i++) {
          const gx = (i * 29.1 + h * 0.2) % VW;
          const gy = ((i * 41.7 + h * 0.3) % VH) * 0.9;
          const rr = 2.5;
          const g = ctx.createRadialGradient(gx, gy, 0, gx, gy, rr * 2);
          g.addColorStop(0, "rgba(255,255,255,0.9)");
          g.addColorStop(1, "rgba(255,255,255,0)");
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(gx, gy, rr * 2, 0, Math.PI * 2);
          ctx.fill();
        }
      } else if (zone.key === "horizon") {
        const g2 = ctx.createRadialGradient(
          VW * 0.5,
          VH * 0.3,
          10,
          VW * 0.5,
          VH * 0.3,
          VW * 0.9
        );
        g2.addColorStop(0, "rgba(255,0,180,0.4)");
        g2.addColorStop(1, "rgba(255,0,180,0)");
        ctx.fillStyle = g2;
        ctx.fillRect(0, 0, VW, VH);
      }
    }

    function drawGroundAndHouse() {
      const h = world.heightMeters;
      let alpha = 1 - h / 160;
      if (alpha <= 0) return;
      if (alpha > 1) alpha = 1;

      ctx.save();
      ctx.globalAlpha = alpha;

      const groundH = 40;
      ctx.fillStyle = "#5a3b1f";
      ctx.fillRect(0, VH - groundH, VW, groundH);

      const w = 45;
      const hHouse = 32;
      const x = 10;
      const y = VH - groundH - hHouse + 2;

      ctx.fillStyle = "#fef3dd";
      ctx.fillRect(x, y, w, hHouse);

      ctx.fillStyle = "#3b1020";
      ctx.beginPath();
      ctx.moveTo(x - 3, y);
      ctx.lineTo(x + w / 2, y - 16);
      ctx.lineTo(x + w + 3, y);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#603028";
      ctx.fillRect(x + w * 0.42, y + hHouse - 14, 8, 14);

      ctx.strokeStyle = "#3b1020";
      ctx.lineWidth = 1;
      const winSize = 8;
      const winY = y + 7;
      const win1X = x + 6;
      const win2X = x + w - winSize - 6;
      [win1X, win2X].forEach((wx) => {
        ctx.strokeRect(wx, winY, winSize, winSize);
        ctx.beginPath();
        ctx.moveTo(wx, winY);
        ctx.lineTo(wx + winSize, winY + winSize);
        ctx.moveTo(wx + winSize, winY);
        ctx.lineTo(wx, winY + winSize);
        ctx.stroke();
      });

      const tx = VW * 0.45;
      const ty = VH - groundH + 4;
      const rx = 18;
      const ry = 6;

      ctx.strokeStyle = "#d62b3e";
      ctx.lineWidth = 2;
      const legs = [-rx * 0.6, -rx * 0.2, rx * 0.2, rx * 0.6];
      legs.forEach((dx) => {
        ctx.beginPath();
        ctx.moveTo(tx + dx, ty);
        ctx.lineTo(tx + dx, ty + 10);
        ctx.stroke();
      });

      ctx.beginPath();
      ctx.ellipse(tx, ty - 2, rx, ry, 0, 0, Math.PI * 2);
      ctx.strokeStyle = "#ff3c4b";
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.restore();
    }

    function drawPlatforms() {
      for (const p of platforms) {
        ctx.fillStyle = "#2a1238";
        ctx.fillRect(p.x, p.y + 2, p.w, p.h);

        const grad = ctx.createLinearGradient(p.x, p.y, p.x, p.y + p.h);
        grad.addColorStop(0, "#ff8cff");
        grad.addColorStop(1, "#d350ff");
        ctx.fillStyle = grad;
        ctx.fillRect(p.x, p.y, p.w, p.h);
      }
    }

    function drawHazards() {
      for (const m of meteorites) {
        ctx.save();
        ctx.translate(m.x, m.y);
        ctx.rotate(Math.atan2(m.vy, m.vx));
        ctx.fillStyle = "#ffb46b";
        ctx.beginPath();
        ctx.ellipse(0, 0, m.r * 1.6, m.r, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "rgba(255,255,255,0.7)";
        ctx.beginPath();
        ctx.arc(-m.r * 0.3, -m.r * 0.3, m.r * 0.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      for (const b of blackHoles) {
        const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r * 2.2);
        g.addColorStop(0, "rgba(0,0,0,1)");
        g.addColorStop(0.5, "rgba(40,0,60,0.9)");
        g.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r * 2.2, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawPowerUps() {
      for (const pu of powerUps) {
        ctx.save();
        ctx.translate(pu.x, pu.y);
        const r = pu.r;
        const glow = ctx.createRadialGradient(0, 0, 0, 0, 0, r * 2.3);
        glow.addColorStop(0, "rgba(0,255,200,0.9)");
        glow.addColorStop(1, "rgba(0,255,200,0)");
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(0, 0, r * 2.3, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#00ffe0";
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "rgba(255,255,255,0.8)";
        ctx.beginPath();
        ctx.arc(-r * 0.3, -r * 0.3, r * 0.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    function drawPlayer() {
      const { x, y, r } = player;
      const jumping = player.vy < -1.5;

      ctx.save();
      ctx.translate(x, y);

      ctx.fillStyle = "rgba(0,0,0,0.35)";
      ctx.beginPath();
      ctx.ellipse(0, r + 5, r * 1.6, r * 0.8, 0, 0, Math.PI * 2);
      ctx.fill();

      const boosted = world.jumpBoostMultiplier > 1.01;
      const bodyColor = boosted ? "#fff389" : "#ffdf6b";
      const outline = "#2b1a0f";

      if (jumping) {
        ctx.fillStyle = bodyColor;
        ctx.strokeStyle = outline;
        ctx.lineWidth = 2;

        ctx.beginPath();
        ctx.roundRect(-r * 0.7, -r * 2.6, r * 1.4, r * 3.0, r * 0.7);
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(0, -r * 2.8, r * 0.9, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = "#3a1b1b";
        ctx.beginPath();
        ctx.arc(-r * 0.35, -r * 3.0, 1.3, 0, Math.PI * 2);
        ctx.arc(r * 0.35, -r * 3.0, 1.3, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        ctx.arc(0, -r * 2.7, 2, 0, Math.PI, false);
        ctx.lineWidth = 1.4;
        ctx.stroke();
      } else {
        ctx.fillStyle = bodyColor;
        ctx.strokeStyle = outline;
        ctx.lineWidth = 2;

        ctx.beginPath();
        ctx.roundRect(-r * 1.8, -r * 0.1, r * 3.6, r * 0.9, r * 0.5);
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.roundRect(-r * 1.4, -r * 0.9, r * 2.8, r * 0.9, r * 0.5);
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.roundRect(-r * 0.7, -r * 2.0, r * 1.4, r * 1.7, r * 0.7);
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(0, -r * 2.2, r * 0.9, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = "#3a1b1b";
        ctx.beginPath();
        ctx.arc(-r * 0.35, -r * 2.4, 1.3, 0, Math.PI * 2);
        ctx.arc(r * 0.35, -r * 2.4, 1.3, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        ctx.arc(0, -r * 2.1, 2, 0, Math.PI, false);
        ctx.lineWidth = 1.4;
        ctx.stroke();
      }

      ctx.restore();
    }

    if (!CanvasRenderingContext2D.prototype.roundRect) {
      CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
        const rr = Math.min(r, w / 2, h / 2);
        this.beginPath();
        this.moveTo(x + rr, y);
        this.arcTo(x + w, y, x + w, y + h, rr);
        this.arcTo(x + w, y + h, x, y + h, rr);
        this.arcTo(x, y + h, x, y, rr);
        this.arcTo(x, y, x + w, y, rr);
        this.closePath();
        return this;
      };
    }

    function gameLoop(timestamp) {
      const dt = Math.min((timestamp - lastTime) / 16.67, 2);
      lastTime = timestamp;

      update(dt);

      const dpr = window.devicePixelRatio || 1;
      ctx.save();
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.setTransform(
        canvas.width / (VW * dpr),
        0,
        0,
        canvas.height / (VH * dpr),
        0,
        0
      );

      drawBackground();
      drawGroundAndHouse();
      drawPlatforms();
      drawHazards();
      drawPowerUps();
      drawPlayer();

      ctx.restore();

      requestAnimationFrame(gameLoop);
    }

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();
    resetGame();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
