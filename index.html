<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Ascensión de Wormk</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <style>
    :root {
      color-scheme: dark;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #05030a;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #fff;
    }
    .frame {
      width: min(420px, 100vw);
      aspect-ratio: 9/16;
      border-radius: 16px;
      border: 2px solid #ff55dd;
      box-shadow: 0 0 32px rgba(255, 85, 221, 0.4);
      overflow: hidden;
      background: #000;
      position: relative;
      touch-action: none;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .hud-top {
      position: absolute;
      top: 4px;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 13px;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-shadow: 0 0 4px #000;
      pointer-events: none;
    }
    .hud-bottom {
      position: absolute;
      bottom: 4px;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 12px;
      text-shadow: 0 0 4px #000;
      pointer-events: none;
    }
    .hint {
      position: absolute;
      bottom: 30px;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 10px;
      opacity: 0.75;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="hud-top" id="hudTop">ASCENSIÓN DE WORMK</div>
    <canvas id="game"></canvas>
    <div class="hud-bottom" id="hudBottom">Altura: 0 m · Mejor: 0 m</div>
    <div class="hint">PC: Flechas ← → · Móvil: toca izquierda / derecha</div>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const hudBottom = document.getElementById("hudBottom");

    // Mundo "pixel" lógico
    const VW = 180;   // ancho virtual
    const VH = 320;   // alto virtual

    let lastTime = 0;
    let leftHeld = false;
    let rightHeld = false;
    let bestHeight = 0;

    const world = {
      gravity: 0.35,
      jumpVel: -7.8,
      maxVX: 2.2,
      friction: 0.88,
      scrollY: 0,   // cuánto hemos subido en total (para la altura)
    };

    const player = {
      x: VW / 2,
      y: VH - 40,
      vx: 0,
      vy: 0,
      r: 7,
      alive: true
    };

    const platforms = [];
    const PLATFORM_WIDTH = 40;
    const PLATFORM_HEIGHT = 6;
    const PLATFORM_GAP_MIN = 18;
    const PLATFORM_GAP_MAX = 28;

    function resizeCanvas() {
      const frame = canvas.parentElement.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = frame.width * dpr;
      canvas.height = frame.height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.imageSmoothingEnabled = false; // look más pixel
    }

    function initPlatforms() {
      platforms.length = 0;
      let y = VH - 20;
      platforms.push({ x: VW / 2 - PLATFORM_WIDTH / 2, y, w: PLATFORM_WIDTH, h: PLATFORM_HEIGHT });
      y -= 25;
      while (y > -VH) {
        const x = 10 + Math.random() * (VW - PLATFORM_WIDTH - 20);
        platforms.push({ x, y, w: PLATFORM_WIDTH, h: PLATFORM_HEIGHT });
        y -= PLATFORM_GAP_MIN + Math.random() * (PLATFORM_GAP_MAX - PLATFORM_GAP_MIN);
      }
    }

    function resetGame() {
      world.scrollY = 0;
      player.x = VW / 2;
      player.y = VH - 40;
      player.vx = 0;
      player.vy = -5; // pequeño salto inicial
      player.alive = true;
      initPlatforms();
    }

    function handleKeyboard(e, isDown) {
      if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") {
        leftHeld = isDown;
        e.preventDefault();
      } else if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") {
        rightHeld = isDown;
        e.preventDefault();
      } else if (e.key === " " && !isDown && !player.alive) {
        resetGame();
      }
    }

    document.addEventListener("keydown", e => handleKeyboard(e, true));
    document.addEventListener("keyup", e => handleKeyboard(e, false));

    // Controles táctiles: izquierda/derecha según la mitad de pantalla
    function updateTouch(e) {
      e.preventDefault();
      if (e.touches.length === 0) {
        leftHeld = rightHeld = false;
        return;
      }
      let anyLeft = false;
      let anyRight = false;
      const rect = canvas.getBoundingClientRect();
      for (const touch of e.touches) {
        const x = touch.clientX - rect.left;
        if (x < rect.width * 0.5) anyLeft = true;
        else anyRight = true;
      }
      leftHeld = anyLeft;
      rightHeld = anyRight;
    }

    canvas.addEventListener("touchstart", updateTouch, { passive: false });
    canvas.addEventListener("touchmove", updateTouch, { passive: false });
    canvas.addEventListener("touchend", updateTouch, { passive: false });
    canvas.addEventListener("touchcancel", updateTouch, { passive: false });

    // Clic en PC: izquierda/derecha también
    canvas.addEventListener("mousedown", e => {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      if (x < rect.width * 0.5) leftHeld = true;
      else rightHeld = true;
    });
    window.addEventListener("mouseup", () => {
      leftHeld = rightHeld = false;
    });

    function update(dt) {
      if (!player.alive) return;

      // Controles horizontales
      if (leftHeld && !rightHeld) {
        player.vx -= 0.22;
      } else if (rightHeld && !leftHeld) {
        player.vx += 0.22;
      } else {
        player.vx *= world.friction;
      }

      if (player.vx > world.maxVX) player.vx = world.maxVX;
      if (player.vx < -world.maxVX) player.vx = -world.maxVX;

      player.x += player.vx;

      // wrap horizontal tipo Doodle Jump
      if (player.x < -player.r) player.x = VW + player.r;
      if (player.x > VW + player.r) player.x = -player.r;

      // Física vertical
      player.vy += world.gravity;
      player.y += player.vy;

      // Colisiones con plataformas (solo cuando cae)
      if (player.vy > 0) {
        const bottom = player.y + player.r;
        for (const p of platforms) {
          if (
            bottom > p.y &&
            bottom < p.y + p.h + player.vy + 1 &&
            player.x > p.x - player.r &&
            player.x < p.x + p.w + player.r
          ) {
            player.y = p.y - player.r;
            player.vy = world.jumpVel;
          }
        }
      }

      // Scroll: si sube por encima de la "cámara"
      const camY = VH * 0.4;
      if (player.y < camY) {
        const diff = camY - player.y;
        player.y += diff;
        world.scrollY += diff;
        for (const p of platforms) p.y += diff;
        // quitar plataformas que salieron muy abajo
        for (let i = platforms.length - 1; i >= 0; i--) {
          if (platforms[i].y > VH + 20) platforms.splice(i, 1);
        }
        // generar nuevas arriba
        let highestY = Infinity;
        for (const p of platforms) {
          if (p.y < highestY) highestY = p.y;
        }
        while (highestY > -VH) {
          const gap = PLATFORM_GAP_MIN + Math.random() * (PLATFORM_GAP_MAX - PLATFORM_GAP_MIN);
          highestY -= gap;
          const x = 10 + Math.random() * (VW - PLATFORM_WIDTH - 20);
          platforms.push({ x, y: highestY, w: PLATFORM_WIDTH, h: PLATFORM_HEIGHT });
        }
      }

      // Game over si cae
      if (player.y - player.r > VH + 10) {
        player.alive = false;
        if (world.scrollY > bestHeight) bestHeight = world.scrollY;
      }

      const heightMeters = Math.floor(world.scrollY / 10);
      const bestMeters = Math.floor(bestHeight / 10);
      hudBottom.textContent =
        `Altura: ${heightMeters} m · Mejor: ${bestMeters} m` +
        (!player.alive ? " · Toca o presiona ESPACIO para reiniciar" : "");
    }

    function drawBackground() {
      // Cielo con degradado
      const grad = ctx.createLinearGradient(0, 0, 0, VH);
      grad.addColorStop(0, "#19143f");
      grad.addColorStop(0.5, "#182b57");
      grad.addColorStop(1, "#104454");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, VW, VH);

      // Lunas / montañas suaves para profundidad
      ctx.fillStyle = "rgba(10, 8, 30, 0.5)";
      ctx.beginPath();
      ctx.ellipse(VW * 0.5, VH * 0.15, VW * 0.55, VH * 0.25, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "rgba(7, 10, 35, 0.7)";
      ctx.beginPath();
      ctx.ellipse(VW * 0.5, VH * 0.7, VW * 0.8, VH * 0.4, 0, 0, Math.PI * 2);
      ctx.fill();

      // Estrellas
      ctx.fillStyle = "rgba(255,255,255,0.5)";
      for (let i = 0; i < 60; i++) {
        const x = (i * 17.13) % VW;
        const y = ((i * 53.77) % VH) * 0.6;
        const r = (i % 4) * 0.2 + 0.3;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawGroundAndHouse() {
      // Suelo
      const groundH = 40;
      ctx.fillStyle = "#5a3b1f";
      ctx.fillRect(0, VH - groundH, VW, groundH);

      // Casa pixel-cute
      const w = 45;
      const h = 32;
      const x = 10;
      const y = VH - groundH - h + 2;

      // cuerpo
      ctx.fillStyle = "#fef3dd";
      ctx.fillRect(x, y, w, h);

      // techo
      ctx.fillStyle = "#3b1020";
      ctx.beginPath();
      ctx.moveTo(x - 3, y);
      ctx.lineTo(x + w / 2, y - 16);
      ctx.lineTo(x + w + 3, y);
      ctx.closePath();
      ctx.fill();

      // puerta
      ctx.fillStyle = "#603028";
      ctx.fillRect(x + w * 0.42, y + h - 14, 8, 14);

      // ventanas
      ctx.strokeStyle = "#3b1020";
      ctx.lineWidth = 1;
      const winSize = 8;
      const winY = y + 7;
      const win1X = x + 6;
      const win2X = x + w - winSize - 6;
      [win1X, win2X].forEach(wx => {
        ctx.strokeRect(wx, winY, winSize, winSize);
        ctx.beginPath();
        ctx.moveTo(wx, winY);
        ctx.lineTo(wx + winSize, winY + winSize);
        ctx.moveTo(wx + winSize, winY);
        ctx.lineTo(wx, winY + winSize);
        ctx.stroke();
      });

      // Trampolín rojo
      const tx = VW * 0.45;
      const ty = VH - groundH + 4;
      const rx = 18;
      const ry = 6;

      // patas
      ctx.strokeStyle = "#d62b3e";
      ctx.lineWidth = 2;
      const legs = [-rx * 0.6, -rx * 0.2, rx * 0.2, rx * 0.6];
      legs.forEach(dx => {
        ctx.beginPath();
        ctx.moveTo(tx + dx, ty);
        ctx.lineTo(tx + dx, ty + 10);
        ctx.stroke();
      });

      ctx.beginPath();
      ctx.ellipse(tx, ty - 2, rx, ry, 0, 0, Math.PI * 2);
      ctx.strokeStyle = "#ff3c4b";
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    function drawPlatforms() {
      for (const p of platforms) {
        // marco oscuro
        ctx.fillStyle = "#2a1238";
        ctx.fillRect(p.x, p.y + 2, p.w, p.h);

        // parte brillante
        const grad = ctx.createLinearGradient(p.x, p.y, p.x, p.y + p.h);
        grad.addColorStop(0, "#ff8cff");
        grad.addColorStop(1, "#d350ff");
        ctx.fillStyle = grad;
        ctx.fillRect(p.x, p.y, p.w, p.h);
      }
    }

    function drawPlayer() {
      const { x, y, r } = player;
      const jumping = player.vy < -1.5;

      ctx.save();
      ctx.translate(x, y);

      // sombra
      ctx.fillStyle = "rgba(0,0,0,0.35)";
      ctx.beginPath();
      ctx.ellipse(0, r + 5, r * 1.6, r * 0.8, 0, 0, Math.PI * 2);
      ctx.fill();

      // cuerpo
      const bodyColor = "#ffdf6b";
      const outline = "#2b1a0f";

      if (jumping) {
        // estirado
        ctx.fillStyle = bodyColor;
        ctx.strokeStyle = outline;
        ctx.lineWidth = 2;

        ctx.beginPath();
        ctx.roundRect(-r * 0.7, -r * 2.6, r * 1.4, r * 3.0, r * 0.7);
        ctx.fill();
        ctx.stroke();

        // cabeza
        ctx.beginPath();
        ctx.arc(0, -r * 2.8, r * 0.9, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // cara kawaii
        ctx.fillStyle = "#3a1b1b";
        ctx.beginPath();
        ctx.arc(-r * 0.35, -r * 3.0, 1.3, 0, Math.PI * 2);
        ctx.arc(r * 0.35, -r * 3.0, 1.3, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        ctx.arc(0, -r * 2.7, 2, 0, Math.PI, false);
        ctx.lineWidth = 1.4;
        ctx.stroke();
      } else {
        // enrollado tipo resorte
        ctx.fillStyle = bodyColor;
        ctx.strokeStyle = outline;
        ctx.lineWidth = 2;

        // aros
        ctx.beginPath();
        ctx.roundRect(-r * 1.8, -r * 0.1, r * 3.6, r * 0.9, r * 0.5);
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.roundRect(-r * 1.4, -r * 0.9, r * 2.8, r * 0.9, r * 0.5);
        ctx.fill();
        ctx.stroke();

        // cuello
        ctx.beginPath();
        ctx.roundRect(-r * 0.7, -r * 2.0, r * 1.4, r * 1.7, r * 0.7);
        ctx.fill();
        ctx.stroke();

        // cabeza
        ctx.beginPath();
        ctx.arc(0, -r * 2.2, r * 0.9, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // cara kawaii
        ctx.fillStyle = "#3a1b1b";
        ctx.beginPath();
        ctx.arc(-r * 0.35, -r * 2.4, 1.3, 0, Math.PI * 2);
        ctx.arc(r * 0.35, -r * 2.4, 1.3, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        ctx.arc(0, -r * 2.1, 2, 0, Math.PI, false);
        ctx.lineWidth = 1.4;
        ctx.stroke();
      }

      ctx.restore();
    }

    function gameLoop(timestamp) {
      const dt = Math.min((timestamp - lastTime) / 16.67, 2); // ~60fps base
      lastTime = timestamp;

      update(dt);
      // dibujar en coordenadas virtuales
      ctx.save();
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.setTransform(canvas.width / (VW * (window.devicePixelRatio || 1)), 0, 0,
                       canvas.height / (VH * (window.devicePixelRatio || 1)), 0, 0);

      drawBackground();
      drawGroundAndHouse();
      drawPlatforms();
      drawPlayer();

      ctx.restore();

      requestAnimationFrame(gameLoop);
    }

    // Polyfill para roundRect en navegadores viejos
    if (!CanvasRenderingContext2D.prototype.roundRect) {
      CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
        const rr = Math.min(r, w / 2, h / 2);
        this.beginPath();
        this.moveTo(x + rr, y);
        this.arcTo(x + w, y, x + w, y + h, rr);
        this.arcTo(x + w, y + h, x, y + h, rr);
        this.arcTo(x, y + h, x, y, rr);
        this.arcTo(x, y, x + w, y, rr);
        this.closePath();
        return this;
      };
    }

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();
    resetGame();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
