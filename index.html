<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Gusano 3D Jump - @guilbardoX (Corregido)</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: linear-gradient(to bottom, #87CEEB, #E0F7FA);
            font-family: 'Arial', sans-serif;
        }
        canvas {
            display: block;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 0 5px rgba(0,0,0,0.5);
            z-index: 100;
        }
        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            color: #fff;
            padding: 30px 50px;
            border-radius: 20px;
            text-align: center;
            font-size: 28px;
            display: none;
            z-index: 200;
        }
        button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 18px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        button:hover { background: #45a049; }
        #debug {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: white;
            font-size: 12px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="ui">Puntuación: <span id="score">0</span></div>
    <div id="gameOver">
        <h2>¡Game Over!</h2>
        <p>Puntuación: <span id="finalScore">0</span></p>
        <button onclick="restartGame()">Jugar de Nuevo</button>
    </div>
    <div id="debug">Cargando...</div>

    <!-- Solo el core de Three.js, sin módulos obsoletos -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.167.1/build/three.min.js"></script>

    <script>
        try {
            console.log('Iniciando juego 3D...');
            document.getElementById('debug').textContent = 'Three.js cargado';

            // Escena, cámara, renderer
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);
            document.getElementById('debug').textContent = 'Renderer listo';

            // Iluminación
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(10, 20, 10);
            directionalLight.castShadow = true;
            directionalLight.shadow.camera.left = -50;
            directionalLight.shadow.camera.right = 50;
            directionalLight.shadow.camera.top = 50;
            directionalLight.shadow.camera.bottom = -50;
            scene.add(directionalLight);

            // Fondo (cielo)
            scene.background = new THREE.Color(0x87CEEB);

            // Gusano
            let worm = new THREE.Group();
            const wormCoiled = new THREE.Mesh(
                new THREE.SphereGeometry(1.2, 16, 16),
                new THREE.MeshPhongMaterial({ color: 0x00ff00, shininess: 100 })
            );
            const wormUncoiled = new THREE.Mesh(
                new THREE.CylinderGeometry(0.5, 0.5, 5, 16),
                new THREE.MeshPhongMaterial({ color: 0x00cc00, shininess: 80 })
            );
            wormUncoiled.rotation.x = Math.PI / 2;
            wormUncoiled.position.y = 1.5;
            wormUncoiled.visible = false;

            worm.add(wormCoiled);
            worm.add(wormUncoiled);
            worm.position.y = 5;
            worm.castShadow = true;
            scene.add(worm);
            document.getElementById('debug').textContent = 'Gusano creado';

            // Variables del juego
            const gravity = 0.05;
            const jumpPower = 1.8;
            let velocityY = 0;
            let velocityX = 0;
            let isUncoiled = false;
            let uncoilTime = 0;

            let platforms = [];
            let score = 0;
            let gameOver = false;
            let cameraOffsetY = 8;

            // Generar plataformas
            function createPlatform(x, y, z) {
                const geometry = new THREE.BoxGeometry(6 + Math.random() * 4, 0.5, 6);
                const material = new THREE.MeshPhongMaterial({
                    color: 0x8B4513 + Math.floor(Math.random() * 0x333333),
                    emissive: 0x222222
                });
                const platform = new THREE.Mesh(geometry, material);
                platform.position.set(x, y, z);
                platform.receiveShadow = true;
                platform.castShadow = true;
                scene.add(platform);
                platforms.push({ mesh: platform, broken: false });
                return platform;
            }

            function initPlatforms() {
                platforms.forEach(p => scene.remove(p.mesh));
                platforms = [];
                for (let i = 0; i < 15; i++) {
                    const x = (Math.random() - 0.5) * 30;
                    const z = (Math.random() - 0.5) * 30;
                    const y = i * 5;
                    createPlatform(x, y, z);
                }
                worm.position.set(0, 8, 0);
                velocityY = 0;
                velocityX = 0;
                score = 0;
                updateScore();
                document.getElementById('debug').textContent = 'Plataformas generadas';
            }

            // Controles
            const keys = {};
            window.addEventListener('keydown', e => keys[e.key] = true);
            window.addEventListener('keyup', e => keys[e.key] = false);

            // Controles táctiles
            let touchStartX = 0;
            renderer.domElement.addEventListener('touchstart', e => {
                touchStartX = e.touches[0].clientX;
            });
            renderer.domElement.addEventListener('touchmove', e => {
                const deltaX = e.touches[0].clientX - touchStartX;
                velocityX = deltaX * 0.0005;
            });

            // Actualización del juego
            function updateWorm() {
                if (gameOver) return;

                // Movimiento horizontal
                if (keys['ArrowLeft'] || keys['a'] || keys['A']) velocityX = -0.3;
                else if (keys['ArrowRight'] || keys['d'] || keys['D']) velocityX = 0.3;
                else velocityX *= 0.9;

                worm.position.x += velocityX;
                worm.position.x = Math.max(-15, Math.min(15, worm.position.x)); // Límites laterales

                // Gravedad
                velocityY -= gravity;
                worm.position.y += velocityY;

                // Desenrollar al saltar
                if (isUncoiled) {
                    uncoilTime--;
                    if (uncoilTime <= 0) {
                        isUncoiled = false;
                        wormCoiled.visible = true;
                        wormUncoiled.visible = false;
                    }
                }

                // Colisión con plataformas (simplificada)
                platforms.forEach(p => {
                    if (p.broken) return;
                    const distY = worm.position.y - p.mesh.position.y;
                    const distX = Math.abs(worm.position.x - p.mesh.position.x);
                    const distZ = Math.abs(worm.position.z - p.mesh.position.z);
                    if (distY < 2 && distY > 0 && distX < 4 && distZ < 4 && velocityY < 0) {
                        velocityY = jumpPower;
                        isUncoiled = true;
                        uncoilTime = 20;
                        wormCoiled.visible = false;
                        wormUncoiled.visible = true;

                        // Romper plataforma
                        setTimeout(() => {
                            p.mesh.material.color.set(0x555555);
                            p.broken = true;
                        }, 100);
                    }
                });

                // Caída = game over
                if (worm.position.y < -20) {
                    endGame();
                }

                // Puntuación
                if (worm.position.y > score) {
                    score = Math.floor(worm.position.y);
                    updateScore();
                }

                // Mover plataformas hacia abajo (cuando subiendo)
                if (velocityY < 0) {
                    platforms.forEach(p => {
                        p.mesh.position.y -= velocityY * 0.3;
                    });
                }

                // Generar nuevas plataformas
                platforms = platforms.filter(p => p.mesh.position.y > worm.position.y - 30);
                while (platforms.length < 15) {
                    const lastY = platforms.length ? platforms[platforms.length - 1].mesh.position.y : worm.position.y;
                    const x = (Math.random() - 0.5) * 35;
                    const z = (Math.random() - 0.5) * 35;
                    createPlatform(x, lastY + 6 + Math.random() * 4, z);
                }
            }

            function updateCamera() {
                camera.position.x = worm.position.x * 0.3;
                camera.position.y = worm.position.y + cameraOffsetY;
                camera.position.z = 15;
                camera.lookAt(worm.position.x, worm.position.y + 2, 0);
            }

            function updateScore() {
                document.getElementById('score').textContent = score;
            }

            function endGame() {
                gameOver = true;
                document.getElementById('finalScore').textContent = score;
                document.getElementById('gameOver').style.display = 'block';
            }

            function restartGame() {
                document.getElementById('gameOver').style.display = 'none';
                gameOver = false;
                initPlatforms();
            }

            // Responsive
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            // Bucle principal
            function animate() {
                requestAnimationFrame(animate);
                updateWorm();
                updateCamera();
                renderer.render(scene, camera);
            }

            // Iniciar
            initPlatforms();
            animate();
            document.getElementById('debug').textContent = '¡Juego iniciado! Usa ← → o desliza en móvil.';
            console.log('Juego listo sin errores.');

        } catch (error) {
            console.error('Error en el juego:', error);
            document.getElementById('debug').textContent = 'Error: ' + error.message + '. Revisa la consola (F12).';
        }
    </script>
</body>
</html>
