<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Ascensión del Gusano — Escena</title>
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  />
  <style>
    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #05030a;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    .frame {
      width: min(420px, 90vw);
      aspect-ratio: 9 / 16;
      border-radius: 16px;
      border: 2px solid #ff55dd;
      box-shadow: 0 0 32px rgba(255, 85, 221, 0.35);
      overflow: hidden;
      background: #000;
      position: relative;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .title {
      position: absolute;
      inset: 10px 12px auto;
      color: #ffffffdd;
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 0 8px rgba(0, 0, 0, 0.8);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="title">Ascensión del Gusano · Mockup</div>
    <canvas id="scene"></canvas>
  </div>

  <script>
    const canvas = document.getElementById("scene");
    const ctx = canvas.getContext("2d");

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);

    // --- Dibujos básicos helpers ---
    function roundedRect(x, y, w, h, r) {
      const rr = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + rr, y);
      ctx.arcTo(x + w, y, x + w, y + h, rr);
      ctx.arcTo(x + w, y + h, x, y + h, rr);
      ctx.arcTo(x, y + h, x, y, rr);
      ctx.arcTo(x, y, x + w, y, rr);
      ctx.closePath();
    }

    function drawScene(time = 0) {
      const t = time * 0.001;
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;

      // Fondo cielo degradado
      const sky = ctx.createLinearGradient(0, 0, 0, h);
      sky.addColorStop(0, "#120e3a");
      sky.addColorStop(0.5, "#1b2c64");
      sky.addColorStop(1, "#143c4e");
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, w, h);

      // Portal / anillo celeste
      const portalX = w * 0.15;
      const portalY = h * 0.08;
      const portalR = w * 0.09;
      ctx.save();
      ctx.translate(portalX, portalY);
      ctx.rotate(Math.sin(t * 0.7) * 0.15);
      const portalGrad = ctx.createLinearGradient(-portalR, 0, portalR, 0);
      portalGrad.addColorStop(0, "#6ff8ff");
      portalGrad.addColorStop(0.5, "#3ce2ff");
      portalGrad.addColorStop(1, "#00b1ff");
      ctx.lineWidth = portalR * 0.32;
      ctx.strokeStyle = portalGrad;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.arc(0, 0, portalR * 0.7, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();

      // Estrellas suaves
      ctx.fillStyle = "rgba(255,255,255,0.2)";
      for (let i = 0; i < 60; i++) {
        const sx = (i * 73.21) % w;
        const sy = ((i * 57.13) % h) * 0.6;
        const r = (i % 5) * 0.25 + 0.4;
        ctx.globalAlpha = 0.3 + 0.2 * Math.sin(t + i);
        ctx.beginPath();
        ctx.arc(sx, sy, r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      // Plataformas moradas
      const basePlatformY = h * 0.35;
      const platformCount = 6;
      for (let i = 0; i < platformCount; i++) {
        const offsetY = basePlatformY + i * (h * 0.1);
        const x = w * (0.18 + (i % 2 === 0 ? 0.0 : 0.45));
        const y = h - offsetY;
        const pw = w * 0.32;
        const ph = h * 0.018;

        // glow
        ctx.save();
        const glowGrad = ctx.createLinearGradient(x, y, x, y + ph);
        glowGrad.addColorStop(0, "rgba(255,115,255,0.9)");
        glowGrad.addColorStop(1, "rgba(190,60,255,0.9)");
        roundedRect(x, y, pw, ph, ph * 0.7);
        ctx.fillStyle = glowGrad;
        ctx.shadowColor = "rgba(255,0,200,0.8)";
        ctx.shadowBlur = 10;
        ctx.fill();
        ctx.restore();
      }

      // Suelo / tierra
      const groundHeight = h * 0.23;
      ctx.fillStyle = "#694322";
      ctx.fillRect(0, h - groundHeight, w, groundHeight);

      // Casa
      const houseWidth = w * 0.27;
      const houseHeight = groundHeight * 0.6;
      const houseX = w * 0.06;
      const houseY = h - groundHeight - houseHeight + 6;

      // cuerpo casa
      ctx.fillStyle = "#f9f4f0";
      ctx.fillRect(houseX, houseY, houseWidth, houseHeight);

      // techo
      ctx.beginPath();
      ctx.moveTo(houseX - 6, houseY);
      ctx.lineTo(houseX + houseWidth / 2, houseY - houseHeight * 0.45);
      ctx.lineTo(houseX + houseWidth + 6, houseY);
      ctx.closePath();
      ctx.fillStyle = "#3b1324";
      ctx.fill();

      // puerta
      const doorW = houseWidth * 0.2;
      const doorH = houseHeight * 0.42;
      const doorX = houseX + houseWidth * 0.4;
      const doorY = houseY + houseHeight - doorH;
      ctx.fillStyle = "#5e3440";
      ctx.fillRect(doorX, doorY, doorW, doorH);

      // ventanas con X
      ctx.strokeStyle = "#3b1324";
      ctx.lineWidth = 2;
      const winSize = houseWidth * 0.2;
      const winY = houseY + houseHeight * 0.22;
      const win1X = houseX + houseWidth * 0.1;
      const win2X = houseX + houseWidth * 0.63;
      [win1X, win2X].forEach((wx) => {
        ctx.strokeRect(wx, winY, winSize, winSize);
        ctx.beginPath();
        ctx.moveTo(wx, winY);
        ctx.lineTo(wx + winSize, winY + winSize);
        ctx.moveTo(wx + winSize, winY);
        ctx.lineTo(wx, winY + winSize);
        ctx.stroke();
      });

      // Trampolín (rojo)
      const trampCenterX = w * 0.45;
      const trampCenterY = h - groundHeight * 0.35;
      const trampRX = w * 0.16;
      const trampRY = h * 0.03;

      // patas
      ctx.strokeStyle = "#d62b3e";
      ctx.lineWidth = 3;
      const legOffset = trampRX * 0.7;
      const legTopY = trampCenterY + trampRY * 0.7;
      const legBottomY = legTopY + trampRY * 1.4;
      [ -legOffset, -legOffset * 0.25, legOffset * 0.25, legOffset ].forEach(
        (dx) => {
          ctx.beginPath();
          ctx.moveTo(trampCenterX + dx, legTopY);
          ctx.lineTo(trampCenterX + dx, legBottomY);
          ctx.stroke();
        }
      );

      // base trampolín
      ctx.beginPath();
      ctx.ellipse(trampCenterX, trampCenterY, trampRX, trampRY, 0, 0, Math.PI * 2);
      ctx.strokeStyle = "#ff3c4b";
      ctx.lineWidth = 4;
      ctx.stroke();

      // Resorte verde (3 aros)
      const bounce = Math.sin(t * 4) * (h * 0.005); // pequeña animación
      ctx.strokeStyle = "#00ff6a";
      ctx.lineWidth = 4;
      const springGap = trampRY * 0.9;
      for (let i = 0; i < 3; i++) {
        const sy = trampCenterY - trampRY * 0.4 - i * springGap + bounce;
        ctx.beginPath();
        ctx.ellipse(
          trampCenterX,
          sy,
          trampRX * 0.7,
          trampRY * 0.5,
          0,
          0,
          Math.PI * 2
        );
        ctx.stroke();
      }

      // Gusano verde encima
      const wormBaseY = trampCenterY - trampRY * 1.8 + bounce * 1.2;
      const segmentR = trampRY * 0.7;

      // segmentos base
      ctx.fillStyle = "#11ff7a";
      ctx.strokeStyle = "#018d40";
      ctx.lineWidth = 3;

      function drawSegment(cx, cy, r) {
        ctx.beginPath();
        ctx.ellipse(cx, cy, r * 1.3, r, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      }

      const cx = trampCenterX;
      drawSegment(cx, wormBaseY, segmentR);
      drawSegment(cx, wormBaseY - segmentR * 1.2, segmentR * 0.95);

      // cabeza
      const headY = wormBaseY - segmentR * 2.3;
      const headR = segmentR * 0.9;
      ctx.beginPath();
      ctx.ellipse(
        cx,
        headY,
        headR * 0.8,
        headR * 1.2,
        -0.1,
        0,
        Math.PI * 2
      );
      ctx.fill();
      ctx.stroke();

      // cara del gusano
      ctx.fillStyle = "#0b3a1f";
      const eyeOffsetX = headR * 0.25;
      const eyeY = headY - headR * 0.2;
      ctx.beginPath();
      ctx.arc(cx - eyeOffsetX, eyeY, 2, 0, Math.PI * 2);
      ctx.arc(cx + eyeOffsetX, eyeY, 2, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.arc(cx, headY + headR * 0.1, headR * 0.35, 0, Math.PI, false);
      ctx.lineWidth = 2;
      ctx.strokeStyle = "#0b3a1f";
      ctx.stroke();

      requestAnimationFrame(drawScene);
    }

    requestAnimationFrame(drawScene);
  </script>
</body>
</html>
