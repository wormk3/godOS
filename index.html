<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gusano Saltarín - Como Doodle Jump</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
        }
        canvas {
            border: 1px solid #000;
            background-color: #fff;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="400" height="600"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Configuración del juego
        const GRAVITY = 0.5;
        const JUMP_SPEED = -15;
        const PLATFORM_SPEED = 2;
        const PLATFORM_WIDTH = 80;
        const PLATFORM_HEIGHT = 10;
        const WORM_SIZE = 20; // Tamaño cuando enrollado (círculo)

        // Variables del gusano
        let wormX = canvas.width / 2;
        let wormY = canvas.height / 2;
        let wormVelocityY = 0;
        let wormVelocityX = 0;
        let isUncoiled = false; // Estado: enrollado o desenrollado
        let uncoilTimer = 0; // Temporizador para volver a enrollarse

        // Plataformas
        let platforms = [];
        let score = 0;
        let gameOver = false;

        // Generar plataformas iniciales
        function generatePlatforms() {
            platforms = [];
            for (let i = 0; i < 10; i++) {
                platforms.push({
                    x: Math.random() * (canvas.width - PLATFORM_WIDTH),
                    y: canvas.height - (i * 80) - 50
                });
            }
        }

        // Dibujar el gusano
        function drawWorm() {
            ctx.fillStyle = '#00ff00'; // Color verde para el gusano
            if (isUncoiled) {
                // Desenrollado: dibuja como una línea vertical
                ctx.fillRect(wormX - 5, wormY - WORM_SIZE * 2, 10, WORM_SIZE * 4);
            } else {
                // Enrollado: dibuja como un círculo
                ctx.beginPath();
                ctx.arc(wormX, wormY, WORM_SIZE, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Dibujar plataformas
        function drawPlatforms() {
            ctx.fillStyle = '#0000ff'; // Azul para plataformas
            platforms.forEach(platform => {
                ctx.fillRect(platform.x, platform.y, PLATFORM_WIDTH, PLATFORM_HEIGHT);
            });
        }

        // Actualizar posición del gusano
        function updateWorm() {
            wormVelocityY += GRAVITY;
            wormY += wormVelocityY;
            wormX += wormVelocityX;

            // Mantener dentro de los bordes laterales
            if (wormX < 0) wormX = 0;
            if (wormX > canvas.width - WORM_SIZE * 2) wormX = canvas.width - WORM_SIZE * 2;

            // Caída por debajo de la pantalla = game over
            if (wormY > canvas.height) {
                gameOver = true;
            }

            // Temporizador para enrollarse de nuevo
            if (isUncoiled) {
                uncoilTimer--;
                if (uncoilTimer <= 0) {
                    isUncoiled = false;
                }
            }
        }

        // Mover plataformas hacia abajo
        function updatePlatforms() {
            if (wormVelocityY < 0) { // Solo mover si el gusano está subiendo
                platforms.forEach(platform => {
                    platform.y += -wormVelocityY / 5; // Ajuste de velocidad
                });
                score += Math.abs(wormVelocityY / 5);
            }

            // Eliminar plataformas fuera de pantalla y generar nuevas
            platforms = platforms.filter(platform => platform.y < canvas.height);
            while (platforms.length < 10) {
                const lastY = platforms.length > 0 ? platforms[platforms.length - 1].y : 0;
                platforms.push({
                    x: Math.random() * (canvas.width - PLATFORM_WIDTH),
                    y: lastY - (Math.random() * 50 + 50)
                });
            }
        }

        // Verificar colisiones con plataformas
        function checkCollisions() {
            if (wormVelocityY > 0) { // Solo colisionar cuando cayendo
                platforms.forEach(platform => {
                    if (
                        wormX + WORM_SIZE > platform.x &&
                        wormX < platform.x + PLATFORM_WIDTH &&
                        wormY + WORM_SIZE > platform.y &&
                        wormY + WORM_SIZE < platform.y + PLATFORM_HEIGHT + 5
                    ) {
                        wormVelocityY = JUMP_SPEED;
                        isUncoiled = true; // Desenrollar al saltar
                        uncoilTimer = 30; // Tiempo desenrollado (frames)
                    }
                });
            }
        }

        // Dibujar puntuación
        function drawScore() {
            ctx.fillStyle = '#000';
            ctx.font = '20px Arial';
            ctx.fillText(`Puntuación: ${Math.floor(score)}`, 10, 30);
        }

        // Bucle principal del juego
        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (!gameOver) {
                updateWorm();
                updatePlatforms();
                checkCollisions();
                drawPlatforms();
                drawWorm();
                drawScore();
            } else {
                ctx.fillStyle = '#ff0000';
                ctx.font = '30px Arial';
                ctx.fillText('Game Over', canvas.width / 2 - 100, canvas.height / 2);
                ctx.fillText(`Puntuación: ${Math.floor(score)}`, canvas.width / 2 - 120, canvas.height / 2 + 40);
            }

            requestAnimationFrame(gameLoop);
        }

        // Controles del teclado
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') wormVelocityX = -5;
            if (e.key === 'ArrowRight') wormVelocityX = 5;
        });

        document.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') wormVelocityX = 0;
        });

        // Iniciar el juego
        generatePlatforms();
        gameLoop();
    </script>
</body>
</html>
