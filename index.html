<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Thunder Ascension</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #05030a;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #fff;
    }

    .frame {
      width: min(420px, 100vw);
      aspect-ratio: 9 / 16;
      border-radius: 16px;
      border: 2px solid #ff55dd;
      box-shadow: 0 0 32px rgba(255, 85, 221, 0.4);
      overflow: hidden;
      background: #000;
      position: relative;
      touch-action: none;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

.hud-top {
  position: absolute;
  top: 4px;
  left: 0;
  width: 100%;
  pointer-events: none;
  padding: 4px 10px;
  text-shadow: 0 0 4px #000;
  box-sizing: border-box;

  /* fondo gris con ~80% opacidad */
  background: rgba(40, 40, 40, 0.8);

  display: flex;
  justify-content: space-between;
  align-items: center;
}

.hud-left {
  display: flex;
  flex-direction: column;
}

.hud-score {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: 1px;
  text-align: left;
}

.hud-zone {
  font-size: 11px;
  text-transform: uppercase;
  opacity: 0.85;
}

/* Contador de monedas */
.hud-coins {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 14px;
  font-weight: 700;
}

.coin-icon {
  width: 18px;
  height: 18px;
  image-rendering: pixelated; /* importante para que se vea nítida */
}    .hud-bottom {
      position: absolute;
      bottom: 4px;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 12px;
      text-shadow: 0 0 4px #000;
      pointer-events: none;
      padding: 0 6px;
    }

    .hint {
      position: absolute;
      bottom: 26px;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 10px;
      opacity: 0.75;
      pointer-events: none;
    }
  </style>
</head>
<body>
<div class="hud-top">
  <div class="hud-left">
    <div id="hudScore" class="hud-score">0 m</div>
    <div id="hudZone" class="hud-zone">THUNDER ASCENSION — Zona: Jardín</div>
  </div>
  <div class="hud-coins">
    <img src="thunder-coin.png" class="coin-icon" alt="Coins" />
    <span id="hudCoins">0</span>
  </div>
</div>
    <!-- Mundo lógico fijo 180x320 -->
   <canvas id="game"></canvas>
    <div class="hud-bottom" id="hudBottom">Altura: 0 m · Mejor: 0 m</div>
    <div class="hint">PC: Flechas ← → · Móvil: toca izquierda / derecha</div>
  </div>

 <script>
// --------- FONDOS CON IMAGEN ---------
const bgImgs = {
  garden: new Image(),
  sky: new Image(),
  solar: new Image(),
  milkyway: new Image(),
  virgo: new Image(),
  horizon: new Image()
};

// Rutas de las imágenes
const bgPaths = {
  garden: "bg-garden.jpeg",
  sky: "bg-sky.jpeg",
  solar: "bg-solar.jpeg",
  milkyway: "bg-milkyway.JPG",
  virgo: "bg-virgo.JPG",
  horizon: "bg-horizon.JPG"
};

// --------- ORBE POWER-UP (SPRITE SHEET 8 FRAMES EN UNA FILA) ---------
const orbImg = new Image();
const orbPath = "orb-electric.png";

const ORB_COLS = 8;
const ORB_ROWS = 1;
const ORB_FRAME_COUNT = 8;

let ORB_FRAME_SIZE = 128;    // valor por defecto
const ORB_DRAW_SIZE  = 18;   // tamaño en el juego

// 🔥 variables de animación
let orbAnimTime = 0;
let orbFrame    = 0;

// --------- SPRITES DE THUNDER (UN PNG POR ESTADO) ---------
const SPRITE_DRAW_WIDTH  = 26;
const SPRITE_DRAW_HEIGHT = 36;

const thunderImgs = {
  idle:      new Image(),
  jumpRight: new Image(),
  jumpLeft:  new Image(),
  fall:      new Image()
};

const thunderPaths = {
  idle:      "thunder-idle.png",
  jumpRight: "thunder-jump_right.png",
  jumpLeft:  "thunder_jump_left.png",
  fall:      "thunder_fall.png"
};

// ---------- PRECARGA ----------
async function preloadAssets() {
  const allImages = [];

  const loadImage = (img, path) => new Promise((resolve) => {
    img.onload = () => resolve();
    img.onerror = () => {
      console.error("Error al cargar:", path);
      resolve();
    };
    img.src = path;
  });

  // Fondos
  for (const key in bgPaths) {
    allImages.push(loadImage(bgImgs[key], bgPaths[key]));
  }

  // Sprites de Thunder
  for (const key in thunderPaths) {
    allImages.push(loadImage(thunderImgs[key], thunderPaths[key]));
  }

  // Sprite sheet del orbe
  allImages.push(loadImage(orbImg, orbPath));

  // Espera a todo
  await Promise.all(allImages);
  console.log("Todos los recursos cargados. Iniciando juego.");

  // ✅ AHORA SÍ: ajustar tamaño del frame del orbe
  if (orbImg.naturalWidth) {
    ORB_FRAME_SIZE = orbImg.naturalWidth / ORB_COLS;
  }
}

// -------------------------------------------------------------------
//  A PARTIR DE AQUÍ ES TU LÓGICA DE JUEGO
// -------------------------------------------------------------------
const canvas = document.getElementById("game");
const ctx     = canvas.getContext("2d");

const hudBottom = document.getElementById("hudBottom");
const hudScore  = document.getElementById("hudScore");
const hudZone   = document.getElementById("hudZone");

// Resolución lógica del juego
const VW = 180;
const VH = 320;

// Resolución física x2 para pantallas retina (360x640)
canvas.width  = VW * 2;
canvas.height = VH * 2;
ctx.scale(2, 2);

function drawThunder(ctx, x, y, state) {
  let img = thunderImgs.idle;

  if (state === "jump-right")      img = thunderImgs.jumpRight;
  else if (state === "jump-left")  img = thunderImgs.jumpLeft;
  else if (state === "fall")       img = thunderImgs.fall;

  if (!img.complete) return;

  ctx.drawImage(
    img,
    x - SPRITE_DRAW_WIDTH / 2,
    y - SPRITE_DRAW_HEIGHT / 2,
    SPRITE_DRAW_WIDTH,
    SPRITE_DRAW_HEIGHT
  );
}

let lastTime   = 0;
let leftHeld   = false;
let rightHeld  = false;
let bestHeight = 0;

const world = {
  gravity: 0.4,
  baseJumpVel: -8.5,
  maxVX: 2.4,
  friction: 0.9,
  scrollY: 0,
  heightMeters: 0,
  zoneName: "Jardín",
  controlsInverted: false,
  invertTimer: 0,
  jumpBoostTimer: 0,
  jumpBoostMultiplier: 1.0
};

function currentJumpVel() {
  return world.baseJumpVel * (world.jumpBoostMultiplier || 1);
}

const player = {
  x: VW / 2,
  y: VH - 40,
  vx: 0,
  vy: 0,
  r: 7,
  alive: true
};

const platforms = [];
const PLATFORM_WIDTH     = 40;
const PLATFORM_HEIGHT    = 6;
const PLATFORM_GAP_MIN   = 18;
const PLATFORM_GAP_MAX   = 28;

const meteorites = [];
const blackHoles = [];
let meteorTimer  = 0;
let blackHoleTimer = 0;

let powerUps = [];

function getZone(heightM) {
  if (heightM < 150) {
    return { key: "garden", name: "Jardín",
      top: "#19143f", mid: "#182b57", bottom: "#0f4a3a", stars: 25 };
  } else if (heightM < 900) {
    return { key: "sky", name: "Cielo",
      top: "#203a7a", mid: "#246db0", bottom: "#63b3ff", stars: 36 };
  } else if (heightM < 3500) {
    return { key: "solar", name: "Sistema Solar",
      top: "#10152f", mid: "#171f4f", bottom: "#243a6b", stars: 60 };
  } else if (heightM < 12000) {
    return { key: "milkyway", name: "Vía Láctea",
      top: "#050313", mid: "#151437", bottom: "#203b6a", stars: 90 };
  } else if (heightM < 40000) {
    return { key: "virgo", name: "Supercúmulo de Virgo",
      top: "#05020c", mid: "#24062e", bottom: "#3c1458", stars: 120 };
  } else {
    return { key: "horizon", name: "Horizonte Cósmico",
      top: "#2b0538", mid: "#3b1374", bottom: "#ff0077", stars: 140 };
  }
}

function createPlatform(x, y) {
  const plat = {
    x,
    y,
    w: PLATFORM_WIDTH,
    h: PLATFORM_HEIGHT,
    vx: 0,
    rangeMin: x,
    rangeMax: x + PLATFORM_WIDTH
  };

  const zone = getZone(world.heightMeters);

  if ((zone.key === "milkyway" || zone.key === "virgo" || zone.key === "horizon") &&
      Math.random() < 0.35) {
    plat.vx = (Math.random() < 0.5 ? -0.4 : 0.4);
    plat.rangeMin = 10;
    plat.rangeMax = VW - PLATFORM_WIDTH - 10;
  }

  if (zone.key !== "garden" && Math.random() < 0.07) {
    powerUps.push({
      x: x + PLATFORM_WIDTH / 2,
      y: y - 10,
      r: ORB_DRAW_SIZE * 0.6,
      taken: false
    });
  }

  return plat;
}

function initPlatforms() {
  platforms.length = 0;
  powerUps = [];
  let y = VH - 20;
  platforms.push(createPlatform(VW / 2 - PLATFORM_WIDTH / 2, y));
  y -= 25;
  while (y > -VH) {
    const x = 10 + Math.random() * (VW - PLATFORM_WIDTH - 20);
    platforms.push(createPlatform(x, y));
    y -= PLATFORM_GAP_MIN + Math.random() * (PLATFORM_GAP_MAX - PLATFORM_GAP_MIN);
  }
}

function resetGame() {
  world.scrollY = 0;
  world.heightMeters = 0;
  world.zoneName = "Jardín";
  world.controlsInverted = false;
  world.invertTimer = 0;
  world.jumpBoostTimer = 0;
  world.jumpBoostMultiplier = 1.0;

  meteorites.length = 0;
  blackHoles.length = 0;
  meteorTimer = 0;
  blackHoleTimer = 0;
  powerUps = [];

  player.x = VW / 2;
  player.y = VH - 40;
  player.vx = 0;
  player.vy = -5;
  player.alive = true;

  initPlatforms();
}

// ………… (todo el resto de tu código: controles, hazards, update, drawBackground,
// drawHazards, drawPowerUps, drawPlayer, roundRect, gameLoop) …………
// NO HACE FALTA TOCARLO, SOLO CÓPIALO IGUAL QUE LO TIENES AHORA

// ---------- INICIO DEL JUEGO ----------
preloadAssets().then(() => {
  resetGame();
  requestAnimationFrame(gameLoop);
});
</script>
 </body>
</html>
