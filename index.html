<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ASCENSIÓN INFINITA</title>
    <style>
        /* Pantalla completa en móvil, sin scroll */
        body {
            margin: 0;
            overflow: hidden;
            touch-action: none; /* desactiva zoom/scroll gestual */
            background-color: #000;
            font-family: Arial, sans-serif;
        }
        canvas {
            display: block;
        }
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex; /* visible al inicio */
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            z-index: 10;
            cursor: pointer;
        }
        #overlay-content {
            padding: 20px;
            background-color: rgba(0, 0, 0, 0.7);
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>
    <div id="overlay">
        <div id="overlay-content">TOCA PARA EMPEZAR</div>
    </div>

    <script>
        // === VARIABLES GLOBALES ===

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('overlay');
        const overlayContent = document.getElementById('overlay-content');

        // Estado del juego
        let started = false;
        let gameOver = false;
        let lastTime = 0;
        let deltaTime = 0;

        // Tamaño pantalla
        let W, H;

        // Zonas y colores (por altura acumulada)
        const ZONE_HEIGHT = 10000;
        const COLORS = {
            'Jardín':    { top: 'hsl(120, 50%, 40%)', bottom: 'hsl(60, 50%, 50%)' },
            'Cielo':     { top: 'hsl(200, 70%, 70%)', bottom: 'hsl(180, 50%, 60%)' },
            'Atmósfera': { top: 'hsl(240, 50%, 50%)', bottom: 'hsl(200, 70%, 70%)' },
            'Espacio':   { top: 'hsl(270, 40%, 30%)', bottom: 'hsl(240, 50%, 50%)' },
            'Neon':      { top: 'hsl(300, 80%, 60%)', bottom: 'hsl(0, 80%, 60%)'   }
        };
        const ZONES = Object.keys(COLORS);

        // Jugador (forma de "8")
        const PLAYER_SIZE = 30;
        let player = {
            x: 0,
            y: 0,
            vx: 0,
            vy: 0,
            width: PLAYER_SIZE * 1.4,
            height: PLAYER_SIZE * 2.4,
            isJumping: false,
            maxHeight: 0,
            score: 0
        };

        // Física
        const GRAVITY = 1500;
        const JUMP_VELOCITY = -800;
        const MAX_HORIZONTAL_VELOCITY = 300;
        const DRAG = 0.98;

        // Controles móviles (inclinación)
        const TILT_SENSITIVITY = 700; // más bajo = menos sensible (tipo Doodle Jump)
        let tiltX = 0;

        // Plataformas
        const PLATFORM_COUNT = 15;
        const PLATFORM_WIDTH = 60;
        const PLATFORM_HEIGHT = 10;
        let platforms = [];
        let maxPlatformY = 0;

        // === INICIALIZACIÓN ===

        function setupCanvas() {
            W = window.innerWidth;
            H = window.innerHeight;
            canvas.width = W;
            canvas.height = H;

            // Posición inicial
            player.x = W / 2;
            player.y = H - 100;
            player.vx = 0;
            player.vy = 0;
            player.maxHeight = 0;
            player.score = 0;

            generateInitialPlatforms();
        }

        function generateInitialPlatforms() {
            platforms = [];
            maxPlatformY = H;

            // Plataforma de inicio
            platforms.push({
                x: W / 2 - PLATFORM_WIDTH / 2,
                y: H - 50,
                type: 'normal'
            });

            for (let i = 0; i < PLATFORM_COUNT; i++) {
                generateNewPlatform(maxPlatformY);
            }
        }

        function startGame() {
            started = true;
            gameOver = false;
            overlay.style.display = 'none';

            // Activar sensores de movimiento (móvil)
            if ('DeviceMotionEvent' in window) {
                window.addEventListener('devicemotion', handleTilt, false);
            }

            player.vy = JUMP_VELOCITY;
            player.isJumping = true;
        }

        function restartGame() {
            setupCanvas();
            gameOver = false;
            started = true;
            overlay.style.display = 'none';
            player.vy = JUMP_VELOCITY;
            player.isJumping = true;
        }

        function endGame() {
            gameOver = true;
            started = false;
            overlayContent.innerHTML = `GAME OVER<br>Puntuación: ${player.score}<br>TOCA PARA REINICIAR`;
            overlay.style.display = 'flex';
        }

        // === ENTRADA (INPUT) ===

        function handleInput(event) {
            event.preventDefault();

            if (!started && !gameOver) {
                startGame();
            } else if (gameOver) {
                restartGame();
            }
        }

        function handleTilt(event) {
            // AHORA: inclinar a la izquierda → tiltX negativo → se mueve a la izquierda
            tiltX = event.accelerationIncludingGravity.x;
        }

        function handleKeyDown(event) {
            if (event.key === 'ArrowLeft') {
                player.vx = -MAX_HORIZONTAL_VELOCITY;
            } else if (event.key === 'ArrowRight') {
                player.vx = MAX_HORIZONTAL_VELOCITY;
            }
        }

        function handleKeyUp(event) {
            if (event.key === 'ArrowLeft' && player.vx < 0) {
                player.vx = 0;
            } else if (event.key === 'ArrowRight' && player.vx > 0) {
                player.vx = 0;
            }
        }

        // === LÓGICA DEL JUGADOR ===

        function updatePlayer(dt) {
            if (gameOver || !started) return;

            // 1. Movimiento horizontal (móvil)
            if ('DeviceMotionEvent' in window) {
                const targetVx = tiltX * TILT_SENSITIVITY;
                player.vx = Math.max(
                    Math.min(targetVx, MAX_HORIZONTAL_VELOCITY),
                    -MAX_HORIZONTAL_VELOCITY
                );
            }

            // Arrastre ligero si casi no se mueve
            if (Math.abs(player.vx) < 1) {
                player.vx *= DRAG;
            }

            player.x += player.vx * dt;

            // 2. Movimiento vertical (gravedad)
            player.vy += GRAVITY * dt;
            player.y += player.vy * dt;

            // ¿está saltando (subiendo)?
            player.isJumping = player.vy < 0;

            // wrap horizontal
            if (player.x < -player.width / 2) {
                player.x = W + player.width / 2;
            } else if (player.x > W + player.width / 2) {
                player.x = -player.width / 2;
            }

            // 3. Scroll vertical / cámara
            if (player.y < H / 2) {
                const scrollAmount = H / 2 - player.y;
                player.y = H / 2;
                platforms.forEach(p => p.y += scrollAmount);
                maxPlatformY += scrollAmount;
                player.maxHeight += scrollAmount;
                player.score = Math.floor(player.maxHeight / 100);

                // generar más plataformas arriba
                while (platforms[platforms.length - 1].y > -H / 4) {
                    generateNewPlatform(platforms[platforms.length - 1].y);
                }
            }

            // 4. caer fuera de la pantalla → muerte
            if (player.y > H + player.height / 2) {
                endGame();
            }
        }

        function checkCollisions() {
            if (gameOver || !started) return;

            if (player.vy > 0) { // solo si está cayendo
                const playerBottom = player.y + player.height / 2;

                for (let i = 0; i < platforms.length; i++) {
                    const p = platforms[i];

                    if (
                        player.x - player.width / 2 < p.x + PLATFORM_WIDTH &&
                        player.x + player.width / 2 > p.x &&
                        playerBottom > p.y &&
                        playerBottom < p.y + PLATFORM_HEIGHT
                    ) {
                        // colisión con parte superior
                        if (player.vy > 0 && playerBottom < p.y + PLATFORM_HEIGHT / 2) {
                            player.y = p.y - player.height / 2;
                            player.vy = JUMP_VELOCITY;
                            player.isJumping = true;
                        }
                    }
                }
            }

            // limpiar plataformas muy abajo
            platforms = platforms.filter(p => p.y < H + 50);
        }

        // === PLATAFORMAS ===

        function generateNewPlatform(lastY) {
            const minSpacing = H * 0.08;
            const maxSpacing = H * 0.12;
            const minX = 50;
            const maxX = W - PLATFORM_WIDTH - 50;

            const newY = lastY - (minSpacing + Math.random() * (maxSpacing - minSpacing));

            let platformRange = W * 0.8;
            const zoneIndex = Math.floor(player.maxHeight / ZONE_HEIGHT);

            if (zoneIndex >= 1) {
                platformRange = W * (0.8 - Math.min(zoneIndex * 0.1, 0.4)); // se vuelven más difíciles
            }

            const newX = minX + Math.random() * (maxX - minX);

            platforms.push({
                x: newX,
                y: newY,
                type: 'normal'
            });

            maxPlatformY = newY;
        }

        // === DIBUJO / RENDER ===

        function drawBackground() {
            const currentHeight = Math.floor(player.maxHeight);
            const currentZoneIndex = Math.floor(currentHeight / ZONE_HEIGHT);
            const zoneName = ZONES[currentZoneIndex] || ZONES[ZONES.length - 1];
            const currentColors = COLORS[zoneName];

            const gradient = ctx.createLinearGradient(0, 0, 0, H);
            gradient.addColorStop(0, currentColors.top);
            gradient.addColorStop(1, currentColors.bottom);

            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, W, H);

            ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.font = 'bold 16px Arial';
            ctx.textAlign = 'right';
            ctx.fillText(`Zona: ${zoneName}`, W - 10, 22);
        }

        // Personaje como un "8" simple
        function drawPlayer() {
            ctx.save();
            ctx.translate(player.x, player.y);

            const rTop = PLAYER_SIZE * 0.5;  // círculo de arriba (cabeza)
            const rBot = PLAYER_SIZE * 0.6;  // círculo de abajo (cuerpo)

            // cuerpo: círculo de abajo
            const gradBot = ctx.createLinearGradient(-rBot, 0, rBot, 0);
            gradBot.addColorStop(0, "#ffcc88");
            gradBot.addColorStop(1, "#ff8855");
            ctx.fillStyle = gradBot;
            ctx.beginPath();
            ctx.arc(0, rBot * 0.4, rBot, 0, Math.PI * 2);
            ctx.fill();

            // círculo de arriba
            const gradTop = ctx.createLinearGradient(-rTop, -rTop, rTop, rTop);
            gradTop.addColorStop(0, "#ffe4aa");
            gradTop.addColorStop(1, "#ff9966");
            ctx.fillStyle = gradTop;
            ctx.beginPath();
            ctx.arc(0, -rTop * 0.9, rTop, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = "#331515";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, rBot * 0.4, rBot, 0, Math.PI * 2);
            ctx.arc(0, -rTop * 0.9, rTop, 0, Math.PI * 2);
            ctx.stroke();

            // ojos en el círculo de arriba
            ctx.fillStyle = "#ffffff";
            ctx.beginPath();
            ctx.arc(-rTop * 0.35, -rTop * 1.0, 2, 0, Math.PI * 2);
            ctx.arc( rTop * 0.35, -rTop * 1.0, 2, 0, Math.PI * 2);
            ctx.fill();

            // boca
            ctx.strokeStyle = "#552222";
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            if (player.isJumping) {
                // feliz al subir
                ctx.arc(0, -rTop * 0.75, 4, 0, Math.PI, false);
            } else if (player.vy > 600) {
                // recta al caer rápido
                ctx.moveTo(-3, -rTop * 0.7);
                ctx.lineTo( 3, -rTop * 0.7);
            } else {
                // ligera sonrisa neutra
                ctx.arc(0, -rTop * 0.8, 4, 0, Math.PI);
            }
            ctx.stroke();

            ctx.restore();

            // HUD (altura/puntuación)
            ctx.fillStyle = "white";
            ctx.font = "bold 20px Arial";
            ctx.textAlign = "left";
            ctx.fillText(`Altura: ${player.score}`, 10, 30);
        }

        function drawPlatforms() {
            ctx.fillStyle = "#171717";
            platforms.forEach(p => {
                ctx.fillRect(p.x, p.y, PLATFORM_WIDTH, PLATFORM_HEIGHT);
            });
        }

        // === GAME LOOP ===

        function gameLoop(currentTime) {
            deltaTime = (currentTime - lastTime) / 1000;
            lastTime = currentTime;

            drawBackground();

            if (started && !gameOver) {
                updatePlayer(deltaTime);
                checkCollisions();
            }

            drawPlatforms();
            drawPlayer();

            requestAnimationFrame(gameLoop);
        }

        // === RECURSOS (ya no hay imágenes, así que es instantáneo) ===

        function loadResources() {
            return Promise.resolve();
        }

        function init() {
            loadResources().then(() => {
                setupCanvas();
                window.addEventListener('resize', setupCanvas);

                document.addEventListener('mousedown', handleInput);
                document.addEventListener('touchstart', handleInput, { passive: false });
                document.addEventListener('keydown', handleKeyDown);
                document.addEventListener('keyup', handleKeyUp);

                requestAnimationFrame(gameLoop);
            });
        }

        init();
    </script>

</body>
</html>
