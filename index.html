<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Ascensión Infinita – Jardín Neon</title>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no" />
  <style>
    :root {
      --bg-body: #050510;
      --hud-color: #ffe9a6;
      --accent: #ff5bd4;
      --accent-dark: #7c2bb0;
      --ground-top: #37c95e;
      --ground-side: #168437;
    }
    * { box-sizing: border-box; padding:0; margin:0; }
    body {
      background: radial-gradient(circle at top, #17172b 0%, #050510 60%, #020208 100%);
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-start;
      height:100vh;
      overflow:hidden;
    }
    h1 {
      margin-top:10px;
      font-size:20px;
      letter-spacing:2px;
      text-transform:uppercase;
      color: var(--hud-color);
      text-shadow:0 0 8px rgba(0,0,0,0.9);
    }
    #info {
      font-size:11px;
      opacity:0.8;
      margin-bottom:6px;
      text-align:center;
    }
    #hud {
      margin:4px 0 6px 0;
      font-size:12px;
      opacity:0.95;
      text-align:center;
      color: var(--hud-color);
      text-shadow: 0 0 5px rgba(0,0,0,0.7);
    }
    canvas {
      border:2px solid var(--accent);
      border-radius:18px;
      box-shadow:
        0 0 18px rgba(255,91,212,0.4),
        0 0 40px rgba(0,0,0,0.9);
      background: transparent;
      touch-action:none;
    }
    #overlay {
      position:fixed;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      background: radial-gradient(circle at top, rgba(0,0,0,0.6), rgba(0,0,0,0.95));
      color:#fff;
      z-index:10;
      text-align:center;
      padding:20px;
    }
    #overlay-box {
      background: linear-gradient(135deg,#1b1027,#050510);
      border-radius:16px;
      padding:18px 22px;
      border:1px solid rgba(255,255,255,0.08);
      box-shadow:0 0 12px rgba(0,0,0,0.8);
      max-width:320px;
    }
    #overlay h2 {
      font-size:18px;
      margin-bottom:10px;
      color: var(--hud-color);
    }
    #overlay p {
      font-size:13px;
      margin-bottom:10px;
      opacity:0.9;
    }
    #overlay button {
      margin-top:6px;
      padding:8px 18px;
      border:none;
      border-radius:999px;
      background:linear-gradient(135deg,var(--accent),#ffd36a);
      color:#1a0b24;
      font-weight:600;
      font-size:14px;
      cursor:pointer;
      box-shadow:0 0 10px rgba(255,91,212,0.6);
    }
  </style>
</head>
<body>
  <h1>ASCENSIÓN INFINITA</h1>
  <div id="info">
    MÓVIL: Inclina el celular para moverte · PC: Flechas ← → · Rebotas en plataformas y subes sin límite
  </div>
  <div id="hud">
    Altura: <span id="hudAlt">0</span> m · Mejor: <span id="hudBest">0</span> m
  </div>

  <canvas id="game" width="360" height="640"></canvas>

  <div id="overlay">
    <div id="overlay-box">
      <h2>Wormk listo para saltar 🌱</h2>
      <p>
        Toca el botón para activar los sensores de movimiento en tu iPhone
        y empezar a subir desde el Jardín Neón.
      </p>
      <button id="btnStart">Empezar</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    const hudAlt = document.getElementById('hudAlt');
    const hudBest = document.getElementById('hudBest');

    const overlay = document.getElementById('overlay');
    const btnStart = document.getElementById('btnStart');

    let W = canvas.width;
    let H = canvas.height;

    // Mundo base
    const GRAVITY = 1900;
    const JUMP_VY = -900;
    const MAX_HSPEED = 320;
    const PLATFORM_WIDTH = 85;
    const PLATFORM_HEIGHT = 14;
    const PLATFORM_COUNT = 12;

    // Player (Wormk)
    const player = {
      x: W / 2,
      y: H - 120,
      vx: 0,
      vy: 0,
      radius: 18,
      maxHeight: 0,
      alive: true
    };

    let bestHeight = 0;
    let platforms = [];
    let lastTime = 0;
    let started = false;

    // Tilt
    let tiltX = 0;
    const TILT_STRENGTH = 90; // más bajo = menos sensibilidad

    // --------- INIT WORLD ----------

    function resetWorld() {
      player.x = W / 2;
      player.y = H - 120;
      player.vx = 0;
      player.vy = 0;
      player.maxHeight = 0;
      player.alive = true;

      platforms = [];
      // Plataforma base “suelo”
      platforms.push({
        x: W / 2 - PLATFORM_WIDTH / 2,
        y: H - 60,
        w: PLATFORM_WIDTH,
        h: PLATFORM_HEIGHT
      });
      let lastY = H - 100;
      for (let i = 0; i < PLATFORM_COUNT; i++) {
        lastY -= 60 + Math.random() * 35;
        platforms.push({
          x: 40 + Math.random() * (W - 80 - PLATFORM_WIDTH),
          y: lastY,
          w: PLATFORM_WIDTH,
          h: PLATFORM_HEIGHT
        });
      }
    }

    resetWorld();

    // --------- INPUT ---------

    function handleTilt(event) {
      // iOS portrait suele tener X horizontal; si está invertido, cambiamos signo
      const ax = event.accelerationIncludingGravity.x || 0;
      // Queremos que inclinar a la izquierda mueva a la izquierda
      tiltX = -ax;
    }

    function setupMotion() {
      // Manejo especial para iOS (permiso)
      if (typeof DeviceMotionEvent !== 'undefined' &&
          typeof DeviceMotionEvent.requestPermission === 'function') {
        DeviceMotionEvent.requestPermission()
          .then(response => {
            if (response === 'granted') {
              window.addEventListener('devicemotion', handleTilt);
              startGame();
            } else {
              // Sin permiso: el juego sigue, pero solo con teclado
              startGame();
            }
          })
          .catch(() => startGame());
      } else {
        // Android o navegadores sin permiso explícito
        window.addEventListener('devicemotion', handleTilt);
        startGame();
      }
    }

    document.addEventListener('keydown', e => {
      if (!started) return;
      if (e.key === 'ArrowLeft') {
        player.vx = -MAX_HSPEED;
      } else if (e.key === 'ArrowRight') {
        player.vx = MAX_HSPEED;
      }
    });
    document.addEventListener('keyup', e => {
      if (!started) return;
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
        player.vx = 0;
      }
    });

    btnStart.addEventListener('click', () => {
      if (!started) {
        overlay.style.display = 'none';
        setupMotion();
      }
    });

    function startGame() {
      started = true;
      player.vy = JUMP_VY;
      lastTime = performance.now();
      requestAnimationFrame(loop);
    }

    // --------- GAME LOOP ---------

    function loop(ts) {
      const dt = (ts - lastTime) / 1000;
      lastTime = ts;

      update(dt);
      draw();

      requestAnimationFrame(loop);
    }

    // --------- UPDATE ---------

    function update(dt) {
      if (!started || !player.alive) return;

      // Movimiento horizontal
      if (Math.abs(tiltX) > 0.05) {
        player.vx += tiltX * TILT_STRENGTH * dt;
      } else {
        // pequeña fricción cuando no hay tilt
        player.vx *= 0.9;
      }
      if (player.vx > MAX_HSPEED) player.vx = MAX_HSPEED;
      if (player.vx < -MAX_HSPEED) player.vx = -MAX_HSPEED;

      player.x += player.vx * dt;

      // Wrap en bordes
      if (player.x < -30) player.x = W + 30;
      if (player.x > W + 30) player.x = -30;

      // Vertical
      player.vy += GRAVITY * dt;
      player.y += player.vy * dt;

      // Colisiones con plataformas (solo cuando cae)
      if (player.vy > 0) {
        const pr = player.radius;
        const pxLeft = player.x - pr + 5;
        const pxRight = player.x + pr - 5;
        const pyBottom = player.y + pr;

        for (const p of platforms) {
          if (
            pyBottom > p.y &&
            pyBottom < p.y + p.h + 10 && // pequeño margen
            pxRight > p.x &&
            pxLeft < p.x + p.w
          ) {
            player.y = p.y - pr;
            player.vy = JUMP_VY;
            break;
          }
        }
      }

      // Scroll hacia arriba cuando el jugador sube
      const camY = H * 0.45;
      if (player.y < camY) {
        const shift = camY - player.y;
        player.y = camY;
        for (const p of platforms) {
          p.y += shift;
        }
        player.maxHeight += shift;
      }

      // Generar nuevas plataformas por arriba
      platforms = platforms.filter(p => p.y < H + 80);
      let highestY = Math.min(...platforms.map(p => p.y));
      while (highestY > -40) {
        highestY -= 60 + Math.random() * 40;
        platforms.push({
          x: 40 + Math.random() * (W - 80 - PLATFORM_WIDTH),
          y: highestY,
          w: PLATFORM_WIDTH,
          h: PLATFORM_HEIGHT
        });
      }

      // Si se cae
      if (player.y - player.radius > H + 40) {
        player.alive = false;
        if (player.maxHeight > bestHeight) bestHeight = player.maxHeight;
        // Reinicio suave
        setTimeout(() => {
          resetWorld();
          started = false;
          overlay.style.display = 'flex';
        }, 700);
      }

      const alturaMetros = Math.floor(player.maxHeight / 50);
      hudAlt.textContent = alturaMetros;
      hudBest.textContent = Math.floor(bestHeight / 50);
    }

    // --------- DRAW ---------

    function drawBackgroundGarden() {
      // Fondo gradiente tipo Mario + neón
      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, "#241745");
      g.addColorStop(0.4, "#182542");
      g.addColorStop(0.75, "#042b37");
      g.addColorStop(1, "#021d13");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);

      // Colinas difuminadas
      function drawHill(cx, cy, r, color, alpha) {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(1.4, 1);
        const grad = ctx.createRadialGradient(0, 0, r * 0.1, 0, 0, r);
        grad.addColorStop(0, `rgba(${color},${alpha})`);
        grad.addColorStop(1, `rgba(${color},0)`);
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(0, 0, r, Math.PI, 0);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
      drawHill(W * 0.2, H * 0.9, 260, "38, 20, 60", 0.9);
      drawHill(W * 0.8, H * 0.9, 230, "20, 18, 65", 0.9);

      // Árboles gorditos (troncos)
      function drawTree(x, baseY, height, width) {
        ctx.save();
        ctx.translate(x, baseY);
        ctx.fillStyle = "#1b1b2f";
        ctx.beginPath();
        ctx.moveTo(-width * 0.3, 0);
        ctx.quadraticCurveTo(-width * 0.4, -height * 0.4, -width * 0.15, -height);
        ctx.quadraticCurveTo(0, -height * 1.1, width * 0.15, -height);
        ctx.quadraticCurveTo(width * 0.4, -height * 0.4, width * 0.3, 0);
        ctx.closePath();
        ctx.fill();

        // brillo suave
        const lg = ctx.createLinearGradient(-width * 0.2, -height * 0.7, width * 0.2, 0);
        lg.addColorStop(0, "rgba(110,78,133,0.0)");
        lg.addColorStop(0.4, "rgba(148,102,189,0.25)");
        lg.addColorStop(1, "rgba(255,255,255,0)");
        ctx.fillStyle = lg;
        ctx.fill();
        ctx.restore();
      }
      drawTree(W * 0.25, H * 0.95, 260, 170);
      drawTree(W * 0.75, H * 0.98, 250, 160);

      // Silueta de hojas arriba
      ctx.save();
      const foliageGrad = ctx.createLinearGradient(0, 0, 0, H * 0.3);
      foliageGrad.addColorStop(0, "rgba(4,16,12,0.95)");
      foliageGrad.addColorStop(1, "rgba(4,16,12,0)");
      ctx.fillStyle = foliageGrad;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      for (let i = 0; i <= 8; i++) {
        const x = (W / 8) * i;
        const y = 20 + (i % 2 === 0 ? 35 : 10);
        ctx.quadraticCurveTo(x - W / 16, y + 30, x, y);
      }
      ctx.lineTo(W, 0);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function drawGroundAndHouse() {
      // Ground 3D tipo Mario
      const groundHeight = 70;
      const yTop = H - groundHeight;

      // parte frontal
      const gradFront = ctx.createLinearGradient(0, yTop, 0, H);
      gradFront.addColorStop(0, "#1f8e3b");
      gradFront.addColorStop(1, "#115224");
      ctx.fillStyle = gradFront;
      ctx.fillRect(0, yTop, W, groundHeight);

      // borde superior (hojas)
      const leafGrad = ctx.createLinearGradient(0, yTop - 10, 0, yTop + 10);
      leafGrad.addColorStop(0, "#7dffae");
      leafGrad.addColorStop(0.5, "#37d864");
      leafGrad.addColorStop(1, "#157a30");
      ctx.fillStyle = leafGrad;
      const leafH = 18;
      for (let i = 0; i < W; i += 22) {
        ctx.beginPath();
        ctx.moveTo(i, yTop);
        ctx.quadraticCurveTo(i + 11, yTop - leafH, i + 22, yTop);
        ctx.quadraticCurveTo(i + 11, yTop - leafH * 0.6, i, yTop);
        ctx.fill();
      }

      // Casa estilo Mario neón
      const houseWidth = 90;
      const houseHeight = 70;
      const hx = W * 0.22;
      const hy = yTop - houseHeight + 6;

      // cuerpo
      const bodyGrad = ctx.createLinearGradient(hx, hy, hx, hy + houseHeight);
      bodyGrad.addColorStop(0, "#ff99e3");
      bodyGrad.addColorStop(1, "#ff4f90");
      ctx.fillStyle = bodyGrad;
      const radius = 12;
      ctx.beginPath();
      ctx.moveTo(hx - houseWidth / 2 + radius, hy);
      ctx.lineTo(hx + houseWidth / 2 - radius, hy);
      ctx.quadraticCurveTo(hx + houseWidth / 2, hy, hx + houseWidth / 2, hy + radius);
      ctx.lineTo(hx + houseWidth / 2, hy + houseHeight - radius);
      ctx.quadraticCurveTo(hx + houseWidth / 2, hy + houseHeight, hx + houseWidth / 2 - radius, hy + houseHeight);
      ctx.lineTo(hx - houseWidth / 2 + radius, hy + houseHeight);
      ctx.quadraticCurveTo(hx - houseWidth / 2, hy + houseHeight, hx - houseWidth / 2, hy + houseHeight - radius);
      ctx.lineTo(hx - houseWidth / 2, hy + radius);
      ctx.quadraticCurveTo(hx - houseWidth / 2, hy, hx - houseWidth / 2 + radius, hy);
      ctx.closePath();
      ctx.fill();

      // puerta
      ctx.fillStyle = "#3a103b";
      const doorW = 20;
      const doorH = 32;
      ctx.fillRect(hx - doorW / 2, hy + houseHeight - doorH - 6, doorW, doorH);

      // ventanas
      ctx.fillStyle = "#ffeefb";
      const winSize = 14;
      ctx.fillRect(hx - houseWidth / 2 + 10, hy + 16, winSize, winSize);
      ctx.fillRect(hx + houseWidth / 2 - 10 - winSize, hy + 16, winSize, winSize);

      ctx.strokeStyle = "rgba(90, 0, 120, 0.9)";
      ctx.lineWidth = 2;
      ctx.strokeRect(hx - houseWidth / 2 + 10, hy + 16, winSize, winSize);
      ctx.strokeRect(hx + houseWidth / 2 - 10 - winSize, hy + 16, winSize, winSize);

      // techo
      ctx.beginPath();
      const roofY = hy - 18;
      ctx.moveTo(hx - houseWidth / 2 - 8, hy + 8);
      ctx.lineTo(hx, roofY);
      ctx.lineTo(hx + houseWidth / 2 + 8, hy + 8);
      ctx.closePath();
      const roofGrad = ctx.createLinearGradient(hx, roofY, hx, hy + 8);
      roofGrad.addColorStop(0, "#fffb9a");
      roofGrad.addColorStop(1, "#ff8b5b");
      ctx.fillStyle = roofGrad;
      ctx.fill();
      ctx.strokeStyle = "rgba(160,60,120,0.9)";
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    function drawPlatforms() {
      for (const p of platforms) {
        // 3D block style
        const topGrad = ctx.createLinearGradient(p.x, p.y, p.x, p.y + PLATFORM_HEIGHT);
        topGrad.addColorStop(0, "#f7cfff");
        topGrad.addColorStop(0.4, "#c580ff");
        topGrad.addColorStop(1, "#7a31d6");
        ctx.fillStyle = topGrad;
        const r = 6;
        ctx.beginPath();
        ctx.moveTo(p.x + r, p.y);
        ctx.lineTo(p.x + p.w - r, p.y);
        ctx.quadraticCurveTo(p.x + p.w, p.y, p.x + p.w, p.y + r);
        ctx.lineTo(p.x + p.w, p.y + PLATFORM_HEIGHT);
        ctx.lineTo(p.x, p.y + PLATFORM_HEIGHT);
        ctx.lineTo(p.x, p.y + r);
        ctx.quadraticCurveTo(p.x, p.y, p.x + r, p.y);
        ctx.closePath();
        ctx.fill();

        // sombrita
        ctx.fillStyle = "rgba(0,0,0,0.4)";
        ctx.fillRect(p.x + 3, p.y + PLATFORM_HEIGHT - 2, p.w - 6, 4);
      }
    }

    function drawPlayer() {
      const r = player.radius;
      ctx.save();
      ctx.translate(player.x, player.y);

      // glow exterior
      const glow = ctx.createRadialGradient(0, 0, r * 0.3, 0, 0, r * 2);
      glow.addColorStop(0, "rgba(255, 255, 200, 0.75)");
      glow.addColorStop(0.5, "rgba(255, 91, 212, 0.5)");
      glow.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(0, 0, r * 2, 0, Math.PI * 2);
      ctx.fill();

      // cuerpo
      const bodyGrad = ctx.createLinearGradient(-r, -r, r, r);
      bodyGrad.addColorStop(0, "#fff6c7");
      bodyGrad.addColorStop(0.4, "#ffe08b");
      bodyGrad.addColorStop(1, "#ffb45d");
      ctx.fillStyle = bodyGrad;
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.fill();

      // borde
      ctx.lineWidth = 3;
      ctx.strokeStyle = "rgba(80, 20, 90, 0.9)";
      ctx.stroke();

      // ojitos kawaii
      ctx.fillStyle = "#3b163b";
      ctx.beginPath();
      ctx.arc(-r * 0.35, -r * 0.15, 2.4, 0, Math.PI * 2);
      ctx.arc(r * 0.35, -r * 0.15, 2.4, 0, Math.PI * 2);
      ctx.fill();

      // boca
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, r * 0.1, r * 0.35, 0.15 * Math.PI, 0.85 * Math.PI);
      ctx.stroke();

      ctx.restore();
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);
      drawBackgroundGarden();
      drawGroundAndHouse();
      drawPlatforms();
      drawPlayer();
    }

    // Primer frame
    draw();
  </script>
</body>
</html>
